    ? endValue
      ? formatTableDate(endValue)
      : 'Present'
    : `<input class="pill-input" type="date" required${minAttr} data-edit-to data-original="${isDraft ? '' : view.endDate || ''}" value="${endValue}" aria-label="To date for ${u.code}" />`;
  const busy = !!draftUseCase && !isDraft;
  const actions = readOnly
    ? ''
    : isEditing
      ? `<button type="button" class="uc-act is-save" data-save-row="${u.id}" aria-label="Save" title="Save">${iconSaveRow()}</button>
         <button type="button" class="uc-act" data-cancel-row="${u.id}" aria-label="Cancel" title="Cancel">${iconCancelRow()}</button>`
      : `<button type="button" class="uc-act" data-edit-row="${u.id}" aria-label="Edit ${u.code}" title="Edit" ${busy ? 'disabled' : ''}>${iconPencil()}</button>
         <button type="button" class="uc-act is-danger" data-delete-row="${u.id}" aria-label="Remove ${u.code} from this version" title="Remove from this version" ${busy ? 'disabled' : ''}>${iconRemove()}</button>`;
  const desc = escText(u.description || u.name || '');
  return `
    <tr data-uc-row="${u.id}" data-original-weight="${u.weight ?? 0}" class="${isEditing ? 'is-editing' : ''}${isDraft ? ' is-draft' : ''}">
      <td><span class="check-code">${u.code}</span></td>
      <td class="uc-name"><span class="uc-desc" title="${desc}">${desc}</span></td>
      <td>${stageCell}</td>
      <td>${categoryCell}</td>
      <td class="uc-weight" data-weight-cell="${u.id}">${weightCell}</td>
      <td class="uc-date">${fromCell}</td>
      <td class="uc-date">${toCell}</td>
      <td class="uc-actions">${actions}</td>
    </tr>`;
}

function renderConfig(root, session) {
  if (!canAccess(session.role, 'config')) {
    location.hash = '#/queue';
    return;
  }

  const store = getConfigStore();
  const current = getCurrentConfigVersion(store);
  const view = getViewVersion() || current;
  const readOnly = isReadOnly();
  const rows = filteredRows(view.useCases);
  const pageInfo = paginate(rows, ucPage, ucPageSize);
  ucPage = pageInfo.page;
  const tableRows =
    draftUseCase && !readOnly
      ? [draftUseCase, ...pageInfo.slice.filter((u) => u.id !== draftUseCase.id)]
      : pageInfo.slice;
  const weightedRows = rows.filter((u) => !isCriticalUseCase(u));
  const weightTotal = weightedRows.reduce((sum, u) => sum + (Number(u.weight) || 0), 0);
  const weightFooterOk = weightedRows.length === 0 || weightTotal === 100;
  const passPct = Number(view.stagePassPct?.[scoringTab] ?? DEFAULT_STAGE_PASS[scoringTab] ?? 70);
  const tabLabel = stageName(scoringTab);

  const weightBar = Math.max(0, Math.min(100, weightTotal));
  const content = `
    <div class="cfg-page">
      <div class="cfg-hero">
        <div class="cfg-hero-copy">
          <p class="cfg-kicker">Scoring rules</p>
          <h1>Configuration</h1>
          <p>Set the pass mark, critical gates, and weightage for each claim stage. Changes publish as a dated version.</p>
        </div>
        <div class="cfg-hero-actions">
          ${versionSelectHtml(store)}
        </div>
      </div>
      ${feedback ? `<div class="save-feedback ${feedback.type}">${feedback.message}</div>` : ''}

      <div class="cfg-split">
      <section class="cfg-board">
        <div class="cfg-board-head">
          <div class="cfg-board-title">
            <h2>Use cases</h2>
            <p class="cfg-board-note">Critical checks are pass / fail. Other checks in a stage share 100%.</p>
          </div>
          ${
            scoringTab === 'all'
              ? ''
              : `<div class="cfg-pass-inline">
            <label for="stage-pass-pct">${tabLabel} pass mark</label>
            <div class="config-pass-input">
              <input type="number" id="stage-pass-pct" min="0" max="100" step="1" value="${passPct}" data-original="${passPct}" ${readOnly ? 'disabled' : ''} />
              <span>%</span>
            </div>
            ${
              readOnly
                ? ''
                : `<button type="button" class="btn btn-secondary" data-action="save-pass" disabled>Save</button>`
            }
          </div>`
          }
        </div>

        <div class="cfg-board-toolbar">
          <label class="listing-search">
            <span class="listing-search-icon">${iconSearch()}</span>
            <input type="search" id="uc-search" placeholder="Search use cases…" value="${filters.query.replace(/"/g, '&quot;')}" autocomplete="off" />
          </label>
          <div class="ov-pills cfg-stage-filters" role="group" aria-label="Stage">
            <button type="button" data-scoring-tab="all" class="${scoringTab === 'all' ? 'is-on' : ''}">All</button>
            ${SCORING_TABS.map(
              (tab) =>
                `<button type="button" data-scoring-tab="${tab.id}" class="${scoringTab === tab.id ? 'is-on' : ''}">${tab.label}</button>`
            ).join('')}
          </div>
          <div class="cfg-category">
            <label class="listing-mini-select">
              <select id="filter-category" aria-label="Category">
                <option value="all" ${filters.riskCategory === 'all' ? 'selected' : ''}>All categories</option>
                ${RISK_CATEGORIES.map((c) => `<option value="${c.id}" ${filters.riskCategory === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}
              </select>
              ${iconCaretDown()}
            </label>
          </div>
        </div>

        <p class="version-dates-error" data-row-error role="alert"${rowError ? '' : ' hidden'}>${rowError}</p>
        <div class="listing-table-wrap config-table-wrap">
          <table class="listing-table is-fluid uc-config-table">
            <colgroup>
              <col class="col-code" />
              <col class="col-name" />
              <col class="col-stage" />
              <col class="col-cat" />
              <col class="col-weight" />
              <col class="col-date" />
              <col class="col-date" />
              <col class="col-actions" />
            </colgroup>
            <thead>
              <tr>
                <th>Use-case</th>
                <th>Description</th>
                <th>Stage</th>
                <th>Category</th>
                <th>Weight</th>
                <th>From</th>
                <th>To</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              ${
                tableRows.length === 0
                  ? `<tr><td colspan="8" class="empty-cell">${
                      scoringTab === 'all' && filters.riskCategory === 'all' && !filters.query
                        ? 'No use cases configured yet.'
                        : 'No use cases match this filter.'
                    }</td></tr>`
                  : tableRows
                      .map((u) =>
                        useCaseRowHtml(u, {
                          readOnly,
                          view,
                          isDraft: !!(draftUseCase && u.id === draftUseCase.id),
                        })
                      )
                      .join('')
              }
            </tbody>
          </table>
        </div>
        ${
          pageInfo.total
            ? `<div class="listing-footer cfg-table-pager">
          <label class="listing-pagesize">
            <span>Rows/page</span>
            <span class="listing-pagesize-wrap">
              <select id="uc-page-size" aria-label="Rows per page">
                ${QUEUE_PAGE_SIZES.map(
                  (n) => `<option value="${n}" ${pageInfo.size === n ? 'selected' : ''}>${n}</option>`
                ).join('')}
              </select>
              ${iconCaretDown()}
            </span>
          </label>
          <p class="listing-range">${pageInfo.from} to ${pageInfo.to} of ${pageInfo.total} records</p>
          ${pageControlsHtml(pageInfo, 'data-uc-page')}
        </div>`
            : ''
        }
        ${
          scoringTab === 'all'
            ? `<div class="config-weight-footer">
          <div class="cfg-weight-copy cfg-weight-all">
            ${CLAIM_STAGES.map((stage) => {
              const stageRows = view.useCases.filter((u) => u.stage === stage.id && !isCriticalUseCase(u));
              const total = stageRows.reduce((sum, u) => sum + (Number(u.weight) || 0), 0);
              return `<span>${stage.name} <strong>${stageRows.length ? `${total}%` : '—'}</strong></span>`;
            }).join('')}
          </div>
        </div>`
            : `<div class="config-weight-footer ${weightFooterOk ? 'is-ok' : 'is-warn'}">
          <div class="cfg-weight-copy">
            <span>Stage weightage</span>
            <strong>${weightedRows.length === 0 ? '—' : `${weightTotal}% / 100%`}</strong>
            <small>${
              weightedRows.length === 0
                ? 'Critical use-cases have no weight. This stage is pass / fail on critical checks only.'
                : weightTotal === 100
                  ? 'Non-critical weights add up to 100%.'
                  : 'Non-critical use-cases in this stage should add to 100%.'
            }</small>
          </div>
          ${
            weightedRows.length
              ? `<div class="cfg-weight-track" aria-hidden="true"><span style="width:${weightBar}%"></span></div>`
              : ''
          }
        </div>`
        }
      </section>
      ${readOnly ? '' : availablePanelHtml(view.useCases)}
      </div>
    </div>

    ${renderModalHtml(view.useCases)}
  `;

  root.innerHTML = renderShell(session, '#/config', content, { mainClass: 'is-config' });
  root.querySelector('[data-role-label]').textContent = ROLE_LABELS[session.role];
  bindConfigEvents(root, session, view.useCases);
  if (focusDraft) {
    focusDraft = false;
    root.querySelector('tr.is-draft')?.scrollIntoView({ block: 'nearest' });
    root.querySelector('tr.is-draft [data-edit-cat]')?.focus();
  }
}

function renderModalHtml(currentUseCases) {
  if (!modal) return '';

  const draft = modal.draft || defaultVersionDates();
  const step = modal.step || 'form';

  if (step === 'version-dates') {
    const summary =
      modal.type === 'delete'
        ? `Delete use-case from configuration`
        : modal.type === 'add'
          ? `Add ${draft.code || ''} ${draft.name || 'use-case'}`
          : modal.type === 'pass'
            ? `Set ${stageName(scoringTab)} pass mark to ${draft.passPct}%`
              : `Update ${draft.code || ''} ${draft.name || 'use-case'}`;
    return modalFrame(
      'config-modal-title',
      'Save as a new version',
      `
          ${versionNoticeHtml()}
          <p class="modal-copy"><strong>Change:</strong> ${summary}</p>
          ${versionDateFieldsHtml(draft)}
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" data-action="back-form-step">Back</button>
            <button type="button" class="btn btn-primary" data-action="confirm-version" ${hasCompleteVersionDates(draft) ? '' : 'disabled'}>
              Create version
            </button>
          </div>
      `
    );
  }

  if (modal.type === 'delete') {
    const uc = currentUseCases.find((u) => u.id === modal.useCaseId);
    return modalFrame(
      'config-modal-title',
      'Remove scoring check?',
      `
          <div class="version-notice" role="status">Your changes will be saved as a new version.</div>
          <p class="modal-copy">Remove <strong>${uc?.code} ${uc?.name}</strong> from the scoring configuration? You will set the new version’s start and end dates next.</p>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" data-action="close-modal">Cancel</button>
            <button type="button" class="btn btn-danger" data-action="continue-version-dates">Continue</button>
          </div>
      `
    );
  }

  if (modal.type === 'pass') {
    return modalFrame(
      'config-modal-title',
      'Save stage pass threshold',
      `
          <div class="version-notice" role="status">Your changes will be saved as a new version.</div>
          <p class="modal-copy">${stageName(scoringTab)} will pass at ${draft.passPct}%.</p>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" data-action="close-modal">Cancel</button>
            <button type="button" class="btn btn-primary" data-action="continue-version-dates">Continue</button>
          </div>
      `
    );
  }

  const isAdd = modal.type === 'add';
  const selectedDef = draft.id ? USE_CASE_LIBRARY.find((d) => d.id === Number(draft.id)) : null;
  const selectedEnabled = selectedDef ? isTenantEnabledUseCase(selectedDef) : false;
  const isLockedSelection = isAdd && selectedDef && !selectedEnabled;
  const draftCritical = (draft.riskCategory || selectedDef?.riskCategory) === 'critical';

  let primaryLabel = 'Continue';
  let primaryAction = 'continue-version-dates';
  let primaryDisabled = false;
  let primaryClass = 'btn btn-primary';

  if (isAdd) {
    if (!selectedDef) {
      primaryLabel = 'Add use-case';
      primaryAction = 'confirm-version';
      primaryDisabled = true;
    } else if (isLockedSelection) {
      primaryLabel = 'Raise a request';
      primaryAction = 'raise-request';
      primaryClass = 'btn btn-primary btn-request';
    } else {
      primaryLabel = 'Add use-case';
      primaryAction = 'confirm-version';
      primaryDisabled = !hasCompleteVersionDates(draft);
    }
  }

  return modalFrame(
    'config-modal-title',
    isAdd ? 'Add scoring check' : 'Edit scoring check',
    `
        ${
          isLockedSelection
            ? `<p class="modal-copy">This scoring check is not enabled for your organisation. Raise a request to Azentio to enable it.</p>`
            : `<div class="version-notice" role="status">Your changes will be saved as a new version.</div>
               <p class="modal-copy">${isAdd ? 'Select an available (green) use-case. From and to dates unlock after you choose one, then add the use-case.' : 'Update category or weightage.'}</p>`
        }

        ${
          isAdd
            ? useCasePickerHtml(currentUseCases, draft)
            : `
        <div class="field">
          <label>Description</label>
          <div class="value-readonly uc-desc-full">${(draft.description || draft.name || '').replace(/</g, '&lt;')}</div>
        </div>`
        }

        ${
          isAdd && (draft.description || selectedDef?.description)
            ? `<div class="field">
          <label>Description</label>
          <div class="value-readonly uc-desc-full">${(draft.description || selectedDef?.description || '').replace(/</g, '&lt;')}</div>
        </div>`
            : ''
        }

        ${
          isLockedSelection
            ? ''
            : `
        <div class="field-row">
          <div class="field">
            <label>Stage</label>
            <select id="modal-stage" ${isAdd && !selectedDef ? 'disabled' : ''}>
              ${CLAIM_STAGES.map((s) => `<option value="${s.id}" ${(draft.stage || selectedDef?.stage || scoringTab) === s.id ? 'selected' : ''}>${s.name}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Category</label>
            <select id="modal-category" ${isAdd && !selectedDef ? 'disabled' : ''}>
              ${RISK_CATEGORIES.map((c) => `<option value="${c.id}" ${(draft.riskCategory || selectedDef?.riskCategory || 'high') === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Weightage %</label>
            ${
              draftCritical
                ? `<div class="value-readonly">Pass / fail — no weightage</div>`
                : `<input type="number" id="modal-weight" min="0" max="100" step="1"
              value="${draft.weight ?? selectedDef?.weight ?? 0}"
              ${isAdd && !selectedDef ? 'disabled' : ''} />`
            }
          </div>
        </div>
        `
        }

        ${isAdd && !isLockedSelection ? versionDateFieldsHtml(draft, { disabled: !selectedEnabled }) : ''}

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" data-action="close-modal">Cancel</button>
          <button type="button" class="${primaryClass}" data-action="${primaryAction}" ${primaryDisabled ? 'disabled' : ''}>${primaryLabel}</button>
        </div>
    `
  );
}

function bindConfigEvents(root, session, currentUseCases) {
  const rerender = () => renderConfig(root, session);

  root.querySelectorAll('[data-scoring-tab]').forEach((btn) => {
    btn.addEventListener('click', () => {
      scoringTab = btn.dataset.scoringTab;
      openMenuId = null;
      filters.query = '';
      ucPage = 1;
      rerender();
    });
  });

  root.querySelector('#uc-search')?.addEventListener('input', (e) => {
    keepUcSearchFocus = true;
    filters.query = e.target.value;
    ucPage = 1;
    rerender();
  });
  if (keepUcSearchFocus) {
    keepUcSearchFocus = false;
    const search = root.querySelector('#uc-search');
    if (search) {
      search.focus();
      const end = search.value.length;
      try {
        search.setSelectionRange(end, end);
      } catch {
        /* ignore */
      }
    }
  }
  root.querySelector('#filter-category')?.addEventListener('change', (e) => {
    filters.riskCategory = e.target.value;
    ucPage = 1;
    rerender();
  });

  root.querySelector('#uc-page-size')?.addEventListener('change', (e) => {
    const next = Number(e.target.value);
    ucPageSize = QUEUE_PAGE_SIZES.includes(next) ? next : 10;
    ucPage = 1;
    rerender();
  });
  root.querySelectorAll('[data-uc-page]').forEach((btn) => {
    btn.addEventListener('click', () => {
      ucPage = Number(btn.getAttribute('data-uc-page')) || 1;
      rerender();
    });
  });

  const saveButton = root.querySelector('[data-action="save-table"]');
  const saveError = root.querySelector('[data-table-save-error]');
  const tableDirty = () => {
    for (const sel of root.querySelectorAll('[data-edit-stage], [data-edit-cat]')) {
      if (sel.value !== sel.dataset.original) return true;
    }
    for (const input of root.querySelectorAll('[data-edit-weight]')) {
      if (Number(input.value) !== Number(input.dataset.original)) return true;
    }
    const from = root.querySelector('[data-edit-from]');
    const to = root.querySelector('[data-edit-to]');
    if (from && from.value !== (from.dataset.original || '')) return true;
    if (to && to.value !== (to.dataset.original || '')) return true;
    return false;
  };
  const syncTableSave = () => {
    if (saveButton) saveButton.disabled = !tableDirty();
    if (saveError && !tableDirty()) saveError.textContent = '';
  };
  const bindWeightInput = (input) => {
    input.addEventListener('input', syncTableSave);
    input.addEventListener('change', syncTableSave);
  };
  root.querySelectorAll('[data-edit-weight]').forEach(bindWeightInput);
  root.querySelectorAll('[data-edit-from], [data-edit-to]').forEach((input) => {
    input.addEventListener('change', () => {
      const selector = input.hasAttribute('data-edit-from') ? '[data-edit-from]' : '[data-edit-to]';
      root.querySelectorAll(selector).forEach((el) => {
        el.value = input.value;
      });
      syncTableSave();
    });
  });

  root.querySelector('#cfg-version')?.addEventListener('change', (e) => {
    const id = Number(e.target.value);
    const currentId = getConfigStore().currentId;
    viewingVersionId = id === currentId ? null : id;
    feedback = null;
    draftUseCase = null;
    editingId = null;
    rowError = '';
    rerender();
  });

  root.querySelectorAll('[data-edit-stage]').forEach((sel) => {
    sel.addEventListener('change', syncTableSave);
  });
  root.querySelectorAll('[data-edit-cat]').forEach((sel) => {
    sel.addEventListener('change', () => {
      const id = sel.dataset.editCat;
      const cell = root.querySelector(`[data-weight-cell="${id}"]`);
      const row = root.querySelector(`[data-uc-row="${id}"]`);
      if (!cell) return;
      if (sel.value === 'critical') {
        cell.textContent = 'Pass / fail';
      } else if (!cell.querySelector('input')) {
        const original = row?.dataset.originalWeight ?? '0';
        const value = original === '' ? '' : original;
        cell.innerHTML = `<input class="pill-input" type="number" min="0" max="100" step="1" data-edit-weight="${id}" data-original="${original}" value="${value}" aria-label="Weightage" />`;
        bindWeightInput(cell.querySelector('input'));
      }
      syncTableSave();
    });
  });

  const saveEditingRow = () => {
    const row = root.querySelector('tr.is-editing');
    if (!row) return;
    const id = Number(row.dataset.ucRow);
    const isDraft = !!(draftUseCase && draftUseCase.id === id);
    const stage = row.querySelector('[data-edit-stage]')?.value || '';
    const category = row.querySelector('[data-edit-cat]')?.value || '';
    const weightInput = row.querySelector('[data-edit-weight]');
    const startDate = row.querySelector('[data-edit-from]')?.value || '';
    const endDate = row.querySelector('[data-edit-to]')?.value || '';
    const critical = category === 'critical';
    const today = todayIso();
    const showRowError = (message) => {
      rowError = message;
      const el = root.querySelector('[data-row-error]');
      if (el) {
        el.hidden = false;
        el.textContent = message;
      }
    };
    if (!category) {
      showRowError('Category is required.');
      return;
    }
    if (!stage) {
      showRowError('Stage is required.');
      return;
    }
    if (!critical && (weightInput?.value === '' || !Number.isFinite(Number(weightInput?.value)))) {
      showRowError('Weightage is required.');
      return;
    }
    if (!startDate || !endDate) {
      showRowError('From and to dates are required.');
      return;
    }
    if (isDraft && (startDate < today || endDate < today)) {
      showRowError('From and to dates must be today or a future date.');
      return;
    }
    if (endDate < startDate) {
      showRowError('To date must be on or after the from date.');
      return;
    }
    const weight = critical ? 0 : Math.round(Number(weightInput.value));
    const dates = { startDate, endDate };
    const fields = { stage, riskCategory: category, hardFail: critical, weight };
    const stageChanged = stage !== (row.querySelector('[data-edit-stage]')?.dataset.original || '');
    const categoryChanged = category !== (row.querySelector('[data-edit-cat]')?.dataset.original || '');
    const weightChanged = !critical && String(weight) !== String(row.querySelector('[data-edit-weight]')?.dataset.original ?? '');
    const datesChanged =
      startDate !== (row.querySelector('[data-edit-from]')?.dataset.original || '') ||
      endDate !== (row.querySelector('[data-edit-to]')?.dataset.original || '');
    if (isDraft || stageChanged || categoryChanged || weightChanged) {
      applyMutation((list) => {
        if (isDraft) {
          return [
            {
              id: draftUseCase.id,
              code: draftUseCase.code,
              name: draftUseCase.name,
              description: draftUseCase.description,
              ...fields,
            },
            ...list,
          ];
        }
        return list.map((u) => (u.id === id ? { ...u, ...fields } : u));
      }, dates);
    } else if (datesChanged) {
      const versionId = viewingVersionId || getConfigStore().currentId;
      updateConfigVersionDates(versionId, dates);
      feedback = {
        type: 'success',
        message: `Dates updated (${formatLongDate(startDate)} – ${formatLongDate(endDate)}).`,
      };
    }
    draftUseCase = null;
    editingId = null;
    rowError = '';
    if (saveError) saveError.textContent = '';
    rerender();
  };

  root.querySelector('[data-action="save-table"]')?.addEventListener('click', saveEditingRow);
  root.querySelectorAll('[data-save-row]').forEach((btn) => {
    btn.addEventListener('click', saveEditingRow);
  });
  root.querySelectorAll('[data-cancel-row]').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (draftUseCase && Number(btn.dataset.cancelRow) === draftUseCase.id) draftUseCase = null;
      editingId = null;
      rowError = '';
      rerender();
    });
  });
  root.querySelectorAll('[data-edit-row]').forEach((btn) => {
    btn.addEventListener('click', () => {
      editingId = Number(btn.dataset.editRow);
      rowError = '';
      rerender();
    });
  });
  root.querySelectorAll('[data-delete-row]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.deleteRow);
      if (draftUseCase && draftUseCase.id === id) {
        draftUseCase = null;
        editingId = null;
        rowError = '';
        rerender();
        return;
      }
      const viewed = getViewVersion();
      const target = viewed?.useCases.find((u) => u.id === id);
      if (!target) return;
      if (!window.confirm(`Remove ${target.code} ${target.name} from this version? It will go back to Add use cases.`)) return;
      applyMutation((list) => list.filter((u) => u.id !== id), {
        startDate: viewed.startDate,
        endDate: viewed.endDate,
      });
      editingId = null;
      rowError = '';
      rerender();
    });
  });

  const availableSearch = root.querySelector('#available-search');
  availableSearch?.addEventListener('input', (e) => {
    keepAvailableSearchFocus = true;
    availableQuery = e.target.value;
    rerender();
  });
  root.querySelector('#available-search-form')?.addEventListener('submit', (e) => {
    e.preventDefault();
    keepAvailableSearchFocus = true;
    availableQuery = availableSearch?.value || '';
    rerender();
  });
  if (keepAvailableSearchFocus) {
    keepAvailableSearchFocus = false;
    const search = root.querySelector('#available-search');
    if (search) {
      search.focus();
      const end = search.value.length;
      try {
        search.setSelectionRange(end, end);
      } catch {
        /* ignore */
      }
    }
  }

  root.querySelectorAll('[data-add-uc]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const def = USE_CASE_LIBRARY.find((d) => d.id === Number(btn.dataset.addUc));
      if (!def || !isTenantEnabledUseCase(def)) {
        feedback = { type: 'error', message: 'That use case is not enabled.' };
        rerender();
        return;
      }
      if (draftUseCase) {
        rowError = 'Save or cancel the use case you are adding before adding another.';
        rerender();
        return;
      }
      draftUseCase = {
        id: def.id,
        code: catalogCode(def),
        name: def.name,
        description: def.description,
        stage: def.stage,
        riskCategory: '',
        hardFail: false,
        weight: '',
        startDate: '',
        endDate: '',
      };
      editingId = def.id;
      rowError = '';
      focusDraft = true;
      rerender();
    });
  });

  const passInput = root.querySelector('#stage-pass-pct');
  const savePass = root.querySelector('[data-action="save-pass"]');
  const syncPassSave = () => {
    if (!savePass || !passInput) return;
    const raw = Number(passInput.value);
    const original = Number(passInput.dataset.original);
    savePass.disabled = !Number.isFinite(raw) || Math.round(raw) === original;
  };
  passInput?.addEventListener('input', syncPassSave);
  passInput?.addEventListener('change', syncPassSave);

  root.querySelector('[data-action="save-pass"]')?.addEventListener('click', () => {
    const raw = Number(root.querySelector('#stage-pass-pct')?.value);
    if (!Number.isFinite(raw) || raw < 0 || raw > 100) {
      feedback = { type: 'error', message: 'Enter a pass mark between 0 and 100.' };
      rerender();
      return;
    }
    modal = {
      type: 'pass',
      step: 'form',
      draft: { passPct: Math.round(raw), ...defaultVersionDates() },
    };
    rerender();
  });

  root.querySelectorAll('[data-menu]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = Number(btn.dataset.menu);
      openMenuId = openMenuId === id ? null : id;
      prevVersionsOpen = false;
      rerender();
    });
  });

  root.querySelectorAll('[data-edit]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.edit);
      const uc = currentUseCases.find((u) => u.id === id);
      openMenuId = null;
      ucPickerOpen = false;
      modal = { type: 'edit', step: 'form', useCaseId: id, draft: { ...uc, ...defaultVersionDates() } };
      rerender();
    });
  });

  root.querySelectorAll('[data-delete]').forEach((btn) => {
    btn.addEventListener('click', () => {
      openMenuId = null;
      ucPickerOpen = false;
      modal = {
        type: 'delete',
        step: 'form',
        useCaseId: Number(btn.dataset.delete),
        draft: defaultVersionDates(),
      };
      rerender();
    });
  });

  root.querySelectorAll('[data-action="close-modal"]').forEach((btn) => {
    btn.addEventListener('click', () => {
      modal = null;
      ucPickerOpen = false;
      rerender();
    });
  });

  root.querySelector('[data-action="toggle-uc-picker"]')?.addEventListener('click', (e) => {
    e.stopPropagation();
    ucPickerOpen = !ucPickerOpen;
    rerender();
  });

  root.querySelectorAll('[data-pick-uc]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = Number(btn.dataset.pickUc);
      const def = USE_CASE_LIBRARY.find((d) => d.id === id);
      if (!def) return;
      modal.draft = {
        ...(modal.draft || {}),
        id: def.id,
        code: catalogCode(def),
        name: def.name,
        description: def.description,
        stage: def.stage || scoringTab,
        riskCategory: def.riskCategory,
        hardFail: isCriticalUseCase(def),
        weight: isCriticalUseCase(def) ? 0 : def.weight ?? 0,
        startDate: '',
        endDate: '',
        dateError: null,
      };
      ucPickerOpen = false;
      rerender();
    });
  });

  function captureFormDraft() {
    const stage = root.querySelector('#modal-stage')?.value;
    const riskCategory = root.querySelector('#modal-category')?.value;
    const weightRaw = root.querySelector('#modal-weight')?.value;
    const critical = riskCategory === 'critical';
    const weight = critical
      ? 0
      : weightRaw === '' || weightRaw == null
        ? modal.draft?.weight ?? 0
        : parseInt(weightRaw, 10);
    modal.draft = {
      ...(modal.draft || {}),
      stage: stage || modal.draft?.stage || scoringTab,
      riskCategory: riskCategory || modal.draft?.riskCategory,
      hardFail: critical,
      weight: Number.isFinite(weight) ? weight : modal.draft?.weight ?? 0,
      dateError: null,
    };
  }

  root.querySelector('#modal-category')?.addEventListener('change', () => {
    captureFormDraft();
    rerender();
  });

  root.querySelector('[data-action="continue-version-dates"]')?.addEventListener('click', () => {
    if (modal.type === 'add') {
      const id = Number(modal.draft?.id);
      const def = USE_CASE_LIBRARY.find((d) => d.id === id);
      if (!def || !isTenantEnabledUseCase(def)) {
        feedback = { type: 'error', message: 'Select an available (green) use-case to add.' };
        rerender();
        return;
      }
      captureFormDraft();
      if (!isCriticalUseCase(modal.draft) && (!Number.isFinite(modal.draft.weight) || modal.draft.weight < 0)) {
        feedback = { type: 'error', message: 'Enter a whole-number weightage.' };
        rerender();
        return;
      }
    } else if (modal.type === 'edit') {
      captureFormDraft();
      if (!isCriticalUseCase(modal.draft) && (!Number.isFinite(modal.draft.weight) || modal.draft.weight < 0)) {
        feedback = { type: 'error', message: 'Enter a whole-number weightage.' };
        rerender();
        return;
      }
    } else if (modal.type === 'delete') {
      const uc = currentUseCases.find((u) => u.id === modal.useCaseId);
      modal.draft = {
        ...(modal.draft || defaultVersionDates()),
        code: uc?.code,
        name: uc?.name,
        dateError: null,
      };
    }
    modal.step = 'version-dates';
    ucPickerOpen = false;
    rerender();
  });

  root.querySelector('[data-action="back-form-step"]')?.addEventListener('click', () => {
    const dates = readVersionDates(root);
    modal.draft = {
      ...(modal.draft || {}),
      startDate: dates.startDate || '',
      endDate: dates.endDate || '',
      dateError: null,
    };
    modal.step = 'form';
    rerender();
  });

  const syncVersionDateDraft = () => {
    const dates = readVersionDates(root);
    modal.draft = {
      ...(modal.draft || {}),
      startDate: dates.startDate || '',
      endDate: dates.endDate || '',
      dateError: null,
    };
    const btn = root.querySelector('[data-action="confirm-version"]');
    if (btn) btn.disabled = !hasCompleteVersionDates(modal.draft);
  };

  root.querySelector('#modal-start-date')?.addEventListener('change', syncVersionDateDraft);
  root.querySelector('#modal-end-date')?.addEventListener('change', syncVersionDateDraft);
  root.querySelector('#modal-start-date')?.addEventListener('input', syncVersionDateDraft);
  root.querySelector('#modal-end-date')?.addEventListener('input', syncVersionDateDraft);

  root.querySelector('[data-action="confirm-version"]')?.addEventListener('click', () => {
    if (modal.type === 'add' && (modal.step || 'form') === 'form') {
      const id = Number(modal.draft?.id);
      const def = USE_CASE_LIBRARY.find((d) => d.id === id);
      if (!def || !isTenantEnabledUseCase(def)) {
        feedback = { type: 'error', message: 'Select an available (green) use-case to add.' };
        rerender();
        return;
      }
      captureFormDraft();
      if (!isCriticalUseCase(modal.draft) && (!Number.isFinite(modal.draft.weight) || modal.draft.weight < 0)) {
        feedback = { type: 'error', message: 'Enter a whole-number weightage.' };
        rerender();
        return;
      }
    }

    const dates = readVersionDates(root);
    const dateError = validateVersionDates(dates);
    if (dateError) {
      modal.draft = {
        ...(modal.draft || {}),
        startDate: dates.startDate || '',
        endDate: dates.endDate || '',
        dateError,
      };
      rerender();
      return;
    }

    if (modal.type === 'add') {
      const def = USE_CASE_LIBRARY.find((d) => d.id === Number(modal.draft?.id));
      if (!def || !isTenantEnabledUseCase(def)) {
        feedback = { type: 'error', message: 'Select an available (green) use-case to add.' };
        modal = null;
        rerender();
        return;
      }
      applyMutation((list) => [
        ...list,
        {
          id: def.id,
          code: catalogCode(def),
          name: def.name,
          description: def.description,
          stage: modal.draft.stage || scoringTab || def.stage,
          riskCategory: modal.draft.riskCategory || def.riskCategory,
          hardFail: (modal.draft.riskCategory || def.riskCategory) === 'critical',
          weight: (modal.draft.riskCategory || def.riskCategory) === 'critical' ? 0 : modal.draft.weight ?? def.weight ?? 0,
        },
      ], dates);
    } else if (modal.type === 'edit') {
      const id = modal.useCaseId;
      applyMutation(
        (list) =>
          list.map((u) => {
            if (u.id !== id) return u;
            return {
              ...u,
              stage: modal.draft.stage || u.stage,
              riskCategory: modal.draft.riskCategory || u.riskCategory,
              hardFail: (modal.draft.riskCategory || u.riskCategory) === 'critical',
              weight: (modal.draft.riskCategory || u.riskCategory) === 'critical' ? 0 : modal.draft.weight ?? u.weight ?? 0,
            };
          }),
        dates
      );
    } else if (modal.type === 'delete') {
      const id = modal.useCaseId;
      applyMutation((list) => list.filter((u) => u.id !== id), dates);
    } else if (modal.type === 'pass') {
      const current = getCurrentConfigVersion();
      const nextPass = { ...DEFAULT_STAGE_PASS, ...(current.stagePassPct || {}), [scoringTab]: modal.draft.passPct };
      applyMutation((list) => list, dates, { stagePassPct: nextPass });
    }

    modal = null;
    ucPickerOpen = false;
    rerender();
  });

  root.querySelector('[data-action="raise-request"]')?.addEventListener('click', () => {
    const def = USE_CASE_LIBRARY.find((d) => d.id === Number(modal?.draft?.id));
    feedback = {
      type: 'success',
      message: def
        ? `Request raised for ${catalogCode(def)} — ${def.name}. Azentio will follow up to enable it.`
        : 'Request raised. Azentio will follow up.',
    };
    modal = null;
    ucPickerOpen = false;
    rerender();
  });

  root.querySelector('.uc-picker-menu')?.addEventListener('click', (e) => e.stopPropagation());

  if (modal) {
    bindDialogDismiss(root, () => {
      modal = null;
      ucPickerOpen = false;
      rerender();
    });
  } else {
    bindDialogDismiss(root);
  }

  root.querySelector('.main')?.addEventListener(
    'click',
    () => {
      if (openMenuId != null || prevVersionsOpen || ucPickerOpen) {
        openMenuId = null;
        prevVersionsOpen = false;
        ucPickerOpen = false;
        rerender();
      }
    },
    { once: true }
  );
}
  __ns.renderConfig = renderConfig;
})();

(function () {
  const { renderShell, exportMenuHtml, bindExportMenus, downloadCsv, downloadXls, downloadPdf, iconSearch, iconCaretDown, ROLE_LABELS, canAccess, formatDate, getConfigAuditLog, DAY_RANGE_PRESETS, AUDIT_EVENT_TYPES, resolvePeriodRange, flattenClaimLedger, formatLedgerDelta, formatRangeLabel, paginate, pagerHtml } = __ns;
function esc(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

let keepAuditSearchFocus = false;

function renderAudit(root, session, claims, state, onChange) {
  if (!canAccess(session.role, 'audit')) {
    location.hash = '#/queue';
    return;
  }

  const { period = '30', from, to, changeType = 'all', user = 'all', query = '', page = 1 } = state;
  const range = resolvePeriodRange(period, { from, to });
  const claimRows = flattenClaimLedger(claims);
  const configRows = getConfigAuditLog().map((entry) => ({
    ...entry,
    claimId: entry.claimId || '—',
    fnolNumber: entry.fnolNumber || '—',
    registrationNo: entry.registrationNo || '—',
    workflowStageName: '—',
    ledgerType: 'Config',
    userAction: entry.action,
    delta: formatLedgerDelta(entry),
  }));
  const merged = [...claimRows, ...configRows];
  const actors = [...new Set(merged.map((r) => r.user).filter(Boolean))].sort();

  let list = merged.filter((r) => r.date && r.date >= range.from && r.date <= range.to);
  if (changeType && changeType !== 'all') list = list.filter((r) => r.ledgerType === changeType);
  if (user && user !== 'all') list = list.filter((r) => r.user === user);
  if (query) {
    const q = query.trim().toLowerCase();
    list = list.filter((r) => {
      const blob = `${r.claimId} ${r.fnolNumber} ${r.registrationNo} ${r.claimant || ''} ${r.user} ${r.action} ${r.field} ${r.delta || ''}`.toLowerCase();
      return blob.includes(q);
    });
  }
  list.sort((a, b) => `${b.date}T${b.time || '00:00'}`.localeCompare(`${a.date}T${a.time || '00:00'}`));
  const paged = paginate(list, page);

  const csvRows = [
    ['When', 'Actor', 'Action', 'Claim', 'FNOL', 'Type', 'Field', 'Old value', 'New value'],
    ...list.map((row) => [
      `${row.date} ${row.time || ''}`.trim(),
      row.user || '',
      row.userAction || row.action || '',
      row.claimId || '',
      row.fnolNumber || '',
      row.ledgerType || '',
      row.field || '',
      row.oldValue || '',
      row.newValue || '',
    ]),
  ];
  const pdfHtml = `
    <h1>Audit trail</h1>
    <p>${list.length} events · ${formatRangeLabel(range)}</p>
    <table>
      <thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Claim</th><th>FNOL</th><th>Type</th><th>Change</th></tr></thead>
      <tbody>
        ${list
          .map(
            (row) =>
              `<tr><td>${formatDate(row.date)} ${esc(row.time || '')}</td><td>${esc(row.user || '—')}</td>
              <td>${esc(row.userAction || row.action || '—')}</td><td>${esc(row.claimId && row.claimId !== '—' ? row.claimId : 'Configuration')}</td>
              <td>${esc(row.fnolNumber && row.fnolNumber !== '—' ? row.fnolNumber : '—')}</td>
              <td>${esc(row.ledgerType)}</td><td>${esc(row.delta || '—')}</td></tr>`

          .join('')}

    <div class="listing-page">
      <div class="listing-head">
        <div>
          <h1>Audit trail</h1>
          <p class="listing-count">${list.length} event${list.length === 1 ? '' : 's'} · ${formatRangeLabel(range)}</p>

      </div>

      <div class="listing-toolbar audit-toolbar">
        <label class="listing-search">
          <span class="listing-search-icon">${iconSearch()}</span>
          <input id="audit-search" type="search" placeholder="Search by claimant name, claim #" value="${esc(query)}" autocomplete="off" />
        </label>
        <label class="listing-mini-select">
          <select id="audit-type" aria-label="Event type">
            ${AUDIT_EVENT_TYPES.map(
              (t) => `<option value="${t}" ${changeType === t ? 'selected' : ''}>${t === 'all' ? 'Event type (All)' : t}</option>`
            ).join('')}
          </select>
          ${iconCaretDown()}
        </label>
        <label class="listing-mini-select">
          <select id="audit-user" aria-label="Actor">
            <option value="all" ${user === 'all' ? 'selected' : ''}>Actor (All)</option>
            ${actors.map((name) => `<option value="${esc(name)}" ${user === name ? 'selected' : ''}>${esc(name)}</option>`).join('')}
          </select>
          ${iconCaretDown()}
        </label>
        <label class="listing-mini-select">
          <select id="audit-period" aria-label="Date range">
            ${DAY_RANGE_PRESETS.map(
              (p) => `<option value="${p.id}" ${period === p.id ? 'selected' : ''}>${p.label}</option>`
            ).join('')}
            <option value="custom" ${period === 'custom' ? 'selected' : ''}>Custom range</option>
          </select>
          ${iconCaretDown()}
        </label>
        ${
          period === 'custom'
            ? `<div class="listing-custom-dates audit-custom-dates">
            <label>From <input id="audit-from" type="date" value="${esc(from || range.from)}" /></label>
            <label>To <input id="audit-to" type="date" value="${esc(to || range.to)}" /></label>
          </div>`
            : ''
        }
        <div class="audit-toolbar-export">
          ${exportMenuHtml('audit', { disabled: !list.length })}
        </div>
      </div>

      ${
        list.length === 0
          ? `<div class="listing-card"><div class="chart-empty">No audit events in this filter.</div></div>`
          : `<div class="listing-card">
      <div class="listing-table-wrap">
      <table class="listing-table audit-table">
        <thead>
          <tr>
            <th>When</th>
            <th>Actor</th>
            <th>Action</th>
            <th>Claim</th>
            <th>FNOL</th>
            <th class="col-type">Type</th>
            <th>Change</th>
          </tr>
        </thead>
        <tbody>
          ${paged.slice
            .map(
              (row) => `
            <tr>
              <td class="mono">${formatDate(row.date)} ${esc(row.time || '')}</td>
              <td>${esc(row.user || '—')}</td>
              <td>${esc(row.userAction || row.action || '—')}</td>
              <td class="col-claim">${
                row.claimId && row.claimId !== '—'
                  ? `<a class="listing-link" href="#/claim/${esc(row.claimId)}">${esc(row.claimId)}</a>`
                  : 'Configuration'
              }</td>
              <td class="col-fnol">${
                row.claimId && row.claimId !== '—' && row.fnolNumber && row.fnolNumber !== '—'
                  ? `<a class="listing-link" href="#/claim/${esc(row.claimId)}">${esc(row.fnolNumber)}</a>`
                  : '—'
              }</td>
              <td class="col-type">${esc(row.ledgerType)}</td>
              <td>${esc(row.delta || '—')}</td>
            </tr>`
            )
            .join('')}
        </tbody>
      </table>
    </div>
    ${pagerHtml(paged)}
    </div>`
      }
    </div>
  `;

  root.innerHTML = renderShell(session, '#/audit', content, { mainClass: 'is-listing' });
  root.querySelector('[data-role-label]').textContent = ROLE_LABELS[session.role];

  const patch = (partial, { keepPage = false } = {}) => {
    const next = { ...state, ...partial };
    if (!keepPage && partial.page === undefined) next.page = 1;
    onChange(next);
  };
  root.querySelector('#audit-search')?.addEventListener('input', (e) => {
    keepAuditSearchFocus = true;
    patch({ query: e.target.value });
  });
  if (keepAuditSearchFocus) {
    keepAuditSearchFocus = false;
    const search = root.querySelector('#audit-search');
    if (search) {
      search.focus();
      const end = search.value.length;
      try {
        search.setSelectionRange(end, end);
      } catch {
        /* ignore */
      }
    }
  }

  root.querySelector('#audit-type')?.addEventListener('change', (e) => {
    patch({ changeType: e.target.value });
  });
  root.querySelector('#audit-user')?.addEventListener('change', (e) => {
    patch({ user: e.target.value });

  root.querySelector('#audit-period')?.addEventListener('change', (e) => {

    btn.addEventListener('click', () => patch({ page: Number(btn.getAttribute('data-page')) }, { keepPage: true }));
  });
  bindExportMenus(root, {
    audit: {
      csv: () => downloadCsv(`claim-intel-audit-${range.from}-to-${range.to}.csv`, csvRows),
      xls: () => downloadXls(`claim-intel-audit-${range.from}-to-${range.to}.xls`, csvRows),
      pdf: () => downloadPdf('Audit trail', pdfHtml),
    },
  });
}
  __ns.renderAudit = renderAudit;
})();

    claimType: params.get('claimType') || 'all',
    period: params.get('period') || queueState.period,
    filtersOpen: false,
    draftFilters: null,
    page: 1,
  };
  return true;
}

function bindGlobalActions() {
  root.querySelectorAll('[data-action="logout"]').forEach((btn) => {
    btn.addEventListener('click', () => {
      clearSession();
      destroyChart();
      location.hash = '#/login';
      render();
    });
  });
  root.querySelectorAll('[data-action="toggle-profile"]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const wrap = btn.closest('.persona-wrap');
      const menu = wrap?.querySelector('.persona-menu');
      if (!menu) return;
      const willOpen = menu.hidden;
      root.querySelectorAll('.persona-menu').forEach((m) => {
        m.hidden = true;
      });
      root.querySelectorAll('.persona-wrap').forEach((w) => w.classList.remove('is-open'));
      menu.hidden = !willOpen;
      wrap.classList.toggle('is-open', willOpen);
      btn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
    });
  });
  document.addEventListener(
    'click',
    () => {
      root.querySelectorAll('.persona-menu').forEach((m) => {
        m.hidden = true;
      });
      root.querySelectorAll('.persona-wrap').forEach((w) => w.classList.remove('is-open'));
    },
    { once: true }
  );
}

function render() {
  const session = getSession();
  const { parts, params } = parseRoute();
  const route = parts[0] || 'login';

  if (!session && route !== 'login') {
    sessionStorage.setItem('claim-intel-next', location.hash);
    renderLogin(root);
    return;
  }

  if (session && route === 'login') {
    location.hash = homeRouteForRole(session.role);
    return;
  }

  if (route === 'login') {
    destroyChart();
    renderLogin(root);
    return;
  }

  const claims = scoreAllClaims(weights);

  if (route === 'queue') {
    destroyChart();
    if (applyQueueLaunch(params)) {
      history.replaceState(null, '', `${location.pathname}${location.search}#/queue`);
    }
    renderQueue(root, session, claims, queueState, (next) => {
      queueState = next;
      render();
    });
  } else if (route === 'claim') {
    destroyChart();
    const id = parts.slice(1).join('/');
    if (id !== lastClaimId) {
      lastClaimId = id;
      claimFilter = 'all';
      claimStageTab = session.role === 'surveyor' ? 'assessment' : null;
      claimPageTab = 'overview';
      claimVersionKey = null;
      claimExceptionPanel = null;
      claimExceptionNotice = null;
      claimExtractedDocId = null;
    }
    const claim = claims.find((c) => c.id === id);
    renderClaimDetail(
      root,
      session,
      claim,
      claimFilter,
      (f, opts = {}) => {
        claimFilter = f === 'cant_evaluate' ? 'fail' : f;
        if (opts.selectedStage !== undefined) claimStageTab = opts.selectedStage;
        if (opts.pageTab !== undefined) claimPageTab = opts.pageTab;
        if (opts.versionKey !== undefined) claimVersionKey = opts.versionKey;
        if (opts.exceptionPanel !== undefined) claimExceptionPanel = opts.exceptionPanel;
        if (opts.exceptionNotice !== undefined) claimExceptionNotice = opts.exceptionNotice;
        if (opts.extractedDocId !== undefined) claimExtractedDocId = opts.extractedDocId;
        render();
      },
      {
        selectedStage: claimStageTab,
        pageTab: claimPageTab,
        versionKey: claimVersionKey,
        exceptionPanel: claimExceptionPanel,
        exceptionNotice: claimExceptionNotice,
        extractedDocId: claimExtractedDocId,
      }
    );
  } else if (route === 'dashboard') {
    if (!canAccess(session.role, 'dashboard')) {
      location.hash = '#/queue';
      return;
    }
    renderDashboard(root, session, claims, dashState, (next) => {
      dashState = next;
      render();
    });
  } else if (route === 'report' || route === 'audit') {
    location.hash = '#/dashboard';
    return;
  } else if (route === 'config') {
    destroyChart();
    if (!canAccess(session.role, 'config')) {
      location.hash = '#/queue';
      return;
    }
    renderConfig(root, session);
    // Refresh weights from config store after config interactions
    weights = getWeights();
    weightDraft = { ...weights };
  } else {
    location.hash = session ? homeRouteForRole(session.role) : '#/login';
    return;
  }

  bindGlobalActions();
}

window.addEventListener('hashchange', () => {
  const { parts } = parseRoute();
  if (parts[0] !== 'claim') {
    claimFilter = 'all';
    claimStageTab = null;
    claimPageTab = 'overview';
    claimVersionKey = null;
    claimExceptionPanel = null;
    claimExceptionNotice = null;
    lastClaimId = null;
  }
  render();
});

if (!location.hash) {
  const session = getSession();
  location.hash = session ? homeRouteForRole(session.role) : '#/login';
} else {
  render();
}

window.addEventListener('load', render);
})();

})();

  </script>
</body>
</html>
