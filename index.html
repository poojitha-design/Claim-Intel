<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claim Intel</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111111'/%3E%3Cpath d='M8 22V10l8-4 8 4v12l-8 4-8-4z' fill='%232EDB8E'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
:root {
  --bg: #f4f6f5;
  --surface: #ffffff;
  --surface-muted: #f3f7f5;
  --border: #e2e8e5;
  --border-strong: #c5d0cb;
  --text: #1a1a1a;
  --text-secondary: #4b5560;
  --text-muted: #6b7780;
  --navy: #111111;
  --navy-deep: #111111;
  --navy-soft: #e8fbf3;
  --header: #111111;
  --header-text: #ffffff;
  --header-muted: #b8c0bc;
  --accent: #2edb8e;
  --accent-hover: #25c47d;
  --accent-text: #0b1f18;
  --mint: #2edb8e;
  --mint-soft: #e8fbf3;
  --green: #13be2e;
  --green-bg: #ecfdf3;
  --green-border: #bbf7d0;
  --amber: #ffc33d;
  --amber-bg: #fffbeb;
  --amber-border: #fde68a;
  --red: #f24456;
  --red-bg: #fef2f2;
  --red-border: #fecaca;
  --urgent: #f24456;
  --shadow: 0 1px 2px rgba(17, 17, 17, 0.04), 0 8px 24px rgba(17, 17, 17, 0.06);
  --radius: 8px;
  --radius-sm: 6px;
  --font: "Poppins", system-ui, sans-serif;
  --mono: "Poppins", system-ui, sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

button,
input,
select {
  font: inherit;
}

a {
  color: inherit;
  text-decoration: none;
}

#app {
  min-height: 100vh;
}

/* ---------- Login ---------- */
.login-page {
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: #111;
}

.login-hero {
  position: absolute;
  inset: 0 0 36px;
  z-index: 0;
}

.login-hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center center;
  display: block;
}

.login-stage {
  position: relative;
  z-index: 1;
  flex: 1;
  display: grid;
  grid-template-columns: minmax(24px, 1fr) minmax(360px, 460px) minmax(24px, 0.22fr);
  align-items: center;
  min-width: 0;
  padding: 40px 0 56px;
}

.login-card {
  grid-column: 2;
  width: 100%;
  min-width: 0;
  background: var(--surface);
  border-radius: 20px;
  box-shadow: 0 24px 60px rgba(17, 17, 17, 0.22);
  padding: 32px 28px 24px;
}

.login-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 28px;
}

.login-company {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--navy);
}

.login-company .azentio-logo {
  height: 32px;
  width: auto;
}

.login-company-name {
  display: flex;
  flex-direction: column;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-size: 0.68rem;
  line-height: 1.15;
  padding-left: 12px;
  border-left: 1px solid var(--border-strong);
}

.login-az-mark {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  color: #2edb8e;
}

.login-az-mark svg {
  width: 34px;
  height: 34px;
  display: block;
}

.login-card h1 {
  margin: 0 0 22px;
  font-size: 1.65rem;
  font-weight: 500;
  line-height: 1.25;
  letter-spacing: -0.02em;
  color: var(--navy);
}

.login-card h1 span {
  font-weight: 700;
}

.login-input {
  position: relative;
  display: block;
  margin-bottom: 14px;
}

.login-input input {
  width: 100%;
  height: 48px;
  padding: 0 44px 0 44px;
  border: 1px solid #e9e9e9;
  border-radius: 8px;
  background: #fff;
  color: #16303d;
  outline: none;
}

.login-input input::placeholder {
  color: #adbcc0;
}

.login-input input:hover {
  border-color: #779398;
}

.login-input input:focus {
  border-color: #7b959c;
  box-shadow: inset 0 0 2px rgba(3, 89, 39, 0.15);
}

.login-input-icon,
.login-eye {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  color: #7b959c;
  display: grid;
  place-items: center;
}

.login-input-icon {
  left: 14px;
  pointer-events: none;
}

.login-eye {
  right: 10px;
  width: 32px;
  height: 32px;
  border: 0;
  background: transparent;
  cursor: pointer;
}

.login-forgot {
  display: inline-block;
  margin: 2px 0 16px;
  padding: 0;
  border: 0;
  background: none;
  color: #2edb8e;
  font-size: 0.875rem;
  font-weight: 600;
  cursor: pointer;
}

.login-forgot:hover {
  text-decoration: underline;
}

.login-keep {
  margin: 0 0 18px;
}

.btn-login {
  background: #16303d;
  color: #55ffbe;
  height: 42px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
}

.btn-login:hover:not(:disabled) {
  background: #0f222b;
  color: #55ffbe;
}

.login-sso-link {
  display: block;
  width: 100%;
  margin-top: 14px;
  padding: 0;
  border: 0;
  background: none;
  color: #2edb8e;
  font-size: 0.9rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
}

.login-sso-link:hover {
  text-decoration: underline;
}

.login-demo {
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
}

.login-demo-label {
  margin: 0 0 10px;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.login-demo-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.login-demo-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  text-align: left;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
}

.login-demo-chip:hover {
  border-color: var(--accent);
  background: var(--mint-soft);
}

.login-demo-chip .persona-avatar {
  width: 28px;
  height: 28px;
  font-size: 0.7rem;
}

.login-demo-chip strong {
  display: block;
  font-size: 0.78rem;
  color: var(--navy);
}

.login-demo-chip small {
  color: var(--text-muted);
  font-size: 0.7rem;
}

.login-footer {
  position: relative;
  z-index: 1;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 0 28px;
  background: #16303d;
  color: #d7e0e3;
  font-size: 0.75rem;
}

@media (max-width: 860px) {
  .login-hero {
    inset: 0 0 36px;
    filter: brightness(0.78);
  }

  .login-stage {
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
  }

  .login-card {
    padding: 28px 22px 22px;
  }

  .login-card h1 {
    font-size: 1.35rem;
  }
}

.brand-mark {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.azentio-logo {
  display: block;
  height: 32px;
  width: auto;
  object-fit: contain;
  filter: none;
}

.brand-divider {
  width: 1px;
  height: 22px;
  background: var(--border-strong);
  flex-shrink: 0;
}

.brand-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: linear-gradient(145deg, #5fffbe 0%, #3aefad 100%);
  display: grid;
  place-items: center;
  color: var(--accent-text);
  flex-shrink: 0;
}

.brand-icon svg {
  width: 22px;
  height: 22px;
}

.brand-name {
  font-size: 1.35rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--navy-deep);
}

.login-helper {
  margin: 0 0 28px;
  color: var(--text-muted);
  font-size: 0.9rem;
  line-height: 1.45;
}

.field {
  margin-bottom: 16px;
}

.field label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: #16303d;
  margin-bottom: 6px;
}

.field input[type="text"],
.field input[type="password"],
.field input[type="number"] {
  width: 100%;
  height: 30px;
  padding: 0 12px;
  border: 1px solid #e9e9e9;
  border-radius: 6px;
  background: #fff;
  color: #16303d;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}

.field input::placeholder {
  color: #adbcc0;
}

.field input:hover:not(:disabled) {
  border-color: #779398;
}

.field input:focus {
  border-color: #7b959c;
  box-shadow: inset 0 0 2px rgba(3, 89, 39, 0.15);
}

.field input:disabled {
  background: #f0f1f5;
  color: #7b959c;
  border-color: #e9e9e9;
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 18px 0 22px;
  font-size: 0.875rem;
  color: var(--text-secondary);
}

.checkbox-row input {
  width: 16px;
  height: 16px;
  accent-color: var(--accent);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 36px;
  padding: 0 16px;
  border-radius: 8px;
  border: 1px solid transparent;
  font-weight: 500;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}

.btn:disabled,
.btn:disabled:hover {
  opacity: 1;
  background: #e8eaec;
  color: #7b959c;
  border-color: #e8eaec;
  cursor: not-allowed;
}

.btn-primary,
.btn-ink,
.btn-export {
  background: #16303d;
  color: #55ffbe;
  border-color: #16303d;
}

.btn-primary:hover:not(:disabled),
.btn-ink:hover:not(:disabled),
.btn-export:hover:not(:disabled) {
  background: #0f222b;
  color: #55ffbe;
  border-color: #0f222b;
}

.btn-secondary,
.btn-sso {
  background: #fff;
  border-color: #e9e9e9;
  color: #16303d;
}

.btn-secondary:hover:not(:disabled),
.btn-sso:hover:not(:disabled) {
  background: #fff;
  border-color: #779398;
  color: #16303d;
}

.btn-ghost {
  background: transparent;
  color: #16303d;
  border-color: transparent;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.btn-ghost:hover:not(:disabled) {
  background: transparent;
  color: #16303d;
}

.btn-block {
  width: 100%;
}

.btn-sm {
  height: 30px;
  padding: 0 12px;
  font-size: 12px;
  gap: 8px;
}

.btn.btn-login {
  height: 42px;
  padding: 0 16px;
  font-size: 14px;
}

.btn-export svg {
  transition: transform 0.15s;
}

.export-menu.is-open .btn-export svg {
  transform: rotate(180deg);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.login-error {
  background: var(--red-bg);
  border: 1px solid var(--red-border);
  color: var(--red);
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  margin-bottom: 14px;
}

.demo-accounts {
  margin-top: 24px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
}

.demo-accounts h3 {
  margin: 0 0 10px;
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
}

.demo-list {
  display: grid;
  gap: 8px;
}

.demo-chip {
  display: grid;
  grid-template-columns: 40px 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  cursor: pointer;
  text-align: left;
  transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
}

.demo-chip:hover,
.demo-chip.is-selected {
  border-color: var(--accent);
  background: var(--mint-soft);
  box-shadow: 0 0 0 3px rgba(46, 219, 142, 0.12);
}

.demo-chip .persona-avatar {
  width: 40px;
  height: 40px;
  font-size: 0.75rem;
}

.demo-chip .demo-copy {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.demo-chip .role {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--navy);
}

.demo-chip .blurb {
  font-size: 0.75rem;
  color: var(--text-muted);
}

.demo-chip .enter {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--accent-text);
  background: var(--accent);
  border-radius: 999px;
  padding: 6px 10px;
  white-space: nowrap;
}

/* ---------- App shell ---------- */
.app-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.topbar {
  background: var(--bg);
  color: #16303d;
  border-bottom: none;
  padding: 8px 24px;
  height: 64px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 50;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 24px;
  min-width: 0;
  justify-self: start;
}

.topbar .brand-mark {
  margin: 0;
}

.topbar .azentio-logo {
  height: 26px;
  width: auto;
  object-fit: contain;
}

.nav-capsule {
  justify-self: center;
  display: flex;
  align-items: center;
  gap: 2px;
  height: 48px;
  padding: 3.5px 8px;
  border-radius: 24px;
  background: #a0e7c9;
}

.nav-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 41px;
  padding: 0 14px;
  border-radius: 20.5px;
  font-size: 0.875rem;
  font-weight: 500;
  color: #16303d;
  white-space: nowrap;
  text-decoration: none;
}

.nav-link .nav-ico {
  display: grid;
  place-items: center;
  color: #16303d;
  flex-shrink: 0;
}

.nav-link.active .nav-ico {
  color: #2ed88e;
}

.nav-link:hover {
  background: rgba(255, 255, 255, 0.55);
  color: #16303d;
  text-decoration: none;
}

.nav-link.active {
  background: #fff;
  color: #16303d;
  font-weight: 500;
  box-shadow: 0 1px 3px rgba(22, 48, 61, 0.08);
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
  justify-self: end;
}

.topbar-date {
  font-size: 0.8125rem;
  font-weight: 500;
  color: #7b959c;
  white-space: nowrap;
  padding-right: 4px;
}

.topbar-icon-btn {
  position: relative;
  width: 32px;
  height: 32px;
  border: 0;
  background: transparent;
  color: #16303d;
  cursor: pointer;
  display: grid;
  place-items: center;
  padding: 0;
  flex-shrink: 0;
}

.topbar-icon-btn:hover {
  color: #0f2430;
}

.topbar-badge {
  position: absolute;
  top: 1px;
  right: -2px;
  min-width: 15px;
  height: 15px;
  padding: 0 3px;
  border-radius: 8px;
  background: #55ffbe;
  color: #16303d;
  font-size: 8px;
  font-weight: 700;
  line-height: 15px;
  text-align: center;
}

.topbar-lang {
  border: 0;
  background: transparent;
  color: #16303d;
  font: inherit;
  font-size: 0.875rem;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 0 2px;
}

.persona-badge {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: #16303d;
  cursor: pointer;
  font: inherit;
}

.persona-badge:hover,
.persona-wrap.is-open .persona-badge {
  background: transparent;
}

.persona-avatar {
  width: 33px;
  height: 33px;
  border-radius: 50%;
  background: #d4ffef;
  color: #16303d;
  border: 1.5px solid #2ed88e;
  display: grid;
  place-items: center;
  overflow: hidden;
}

.persona-avatar svg {
  margin-top: 4px;
}

.persona-meta {
  display: none;
}

.persona-meta .name {
  font-size: 0.8rem;
  font-weight: 600;
}

.persona-meta .role {
  font-size: 0.7rem;
  color: var(--header-muted);
}

.persona-wrap {
  position: relative;
}

.persona-menu {
  position: absolute;
  right: 0;
  top: calc(100% + 8px);
  width: 240px;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 8px;
  z-index: 60;
}

.persona-menu[hidden] {
  display: none;
}

.persona-menu-identity {
  padding: 8px 10px 10px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 6px;
}

.persona-menu-identity strong {
  display: block;
  font-size: 0.875rem;
}

.persona-menu-identity small {
  color: var(--text-muted);
  font-size: 0.75rem;
}

.persona-menu button {
  width: 100%;
  justify-content: flex-start;
}

.workbench-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin: -4px 0 16px;
}

.workbench-chip {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  padding: 16px 16px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.workbench-chip .value {
  font-size: 1.75rem;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1;
  color: var(--navy-deep);
}

.workbench-chip a {
  font-size: 0.8125rem;
  font-weight: 600;
  color: #16303d;
  text-decoration: underline;
  text-underline-offset: 2px;
}

.workbench-chip a:hover {
  color: var(--navy);
}

.workbench-chip.is-alert {
  border-color: #f9c5cb;
  background: var(--red-bg);
}

.workbench-chip.is-active {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}

@media (max-width: 980px) {
  .workbench-strip {
    grid-template-columns: 1fr 1fr;
  }
}

@media (max-width: 560px) {
  .workbench-strip {
    grid-template-columns: 1fr;
  }
}

.main {
  flex: 1;
  padding: 20px 24px 48px;
  max-width: none;
  width: 100%;
  margin: 0;
}

/* ---------- Claims listing ---------- */
.listing-crumb {
  display: none;
}

.listing-crumb a {
  color: #1a56a0;
  font-weight: 500;
  text-decoration: underline;
  text-underline-offset: 2px;
}

.listing-crumb a:hover {
  color: #16303d;
}

.listing-page {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.listing-sheet {
  background: var(--surface);
  border-radius: 20px;
  padding: 20px 20px 12px;
  min-width: 0;
  box-shadow: 0 1px 2px rgba(17, 17, 17, 0.03);
}

.listing-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 14px;
}

.listing-head h1 {
  margin: 0;
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: #1b2430;
}

.listing-count {
  margin: 0;
  font-size: 0.8125rem;
  color: var(--text-muted);
}

.listing-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.listing-search-form {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 0 0 auto;
}

.listing-search {

  flex: 0 1 360px;

  min-width: 200px;

}

.listing-search-icon {

  pointer-events: none;
}

.listing-search input {
  width: 100%;
  height: 30px;
  padding: 0 12px 0 38px;

  font-size: 13px;
}

.listing-search input::placeholder {
  color: #adbcc0;
}

.listing-search input::-webkit-search-decoration,
.listing-search input::-webkit-search-cancel-button {

}

.listing-search input:hover {
  border-color: #779398;
}

.listing-search input:focus {

}

.listing-chips {

  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  flex: 1 1 180px;
  min-width: 0;
}

.filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 26px;
  padding: 0 8px 0 10px;
  border: 1px solid #d7dde3;
  border-radius: 999px;
  background: #fff;
  color: #16303d;
  font-size: 0.75rem;
  font-weight: 500;
  cursor: pointer;
}

.filter-chip:hover {
  border-color: #b8c0c6;
  background: #f7f8f9;
}

.filter-chip-x {
  color: #5b6570;
  font-size: 0.95rem;
  line-height: 1;
}

.listing-clear-all {
  height: 26px;
  padding: 0;
  border: 0;
  background: none;
  color: #16303d;
  font: inherit;
  font-size: 0.8125rem;
  font-weight: 600;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.listing-clear-all:hover {
  color: #0f222b;
}

.listing-toolbar-end {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
  flex-wrap: wrap;
}

.listing-mini-select {
  position: relative;
  display: inline-flex;
  align-items: center;
}

label.listing-mini-select select,
.listing-custom-dates input,
.pill-input {
  -webkit-appearance: none;
  -moz-appearance: none;
  appearance: none;
  height: 30px;
  padding: 0 32px 0 12px;
  border: 1px solid #e9e9e9;
  border-radius: 8px;
  background-color: #fff;
  color: #16303d;
  font: inherit;
  font-size: 13px;
  font-weight: 400;
  line-height: 1;
  cursor: pointer;
  box-shadow: none;
}

.listing-custom-dates input,
.pill-input {
  padding: 0 14px;
  cursor: text;
}

.listing-mini-select svg {
  position: absolute;
  right: 8px;
  pointer-events: none;
  color: #7b959c;
}

.listing-custom-dates {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: -4px 0 12px;
  flex-wrap: wrap;
}

.listing-custom-dates label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.78rem;
  color: var(--text-muted);
}

.listing-table-wrap {
  overflow-x: auto;
  border: 1px solid #e4e8ea;
  border-radius: 10px;
  background: #fff;
}

.listing-table {
  width: 100%;
  border-collapse: collapse;
  min-width: 1080px;
}

.listing-table.is-fluid {
  min-width: 720px;
}

.listing-table.is-fluid th,
.listing-table.is-fluid td {
  height: auto;
  min-height: 40px;
  padding-top: 10px;
  padding-bottom: 10px;
  white-space: normal;
}

.listing-table th,
.listing-table td {
  padding: 0 12px;
  height: 40px;
  text-align: left;
  vertical-align: middle;
  border-bottom: 1px solid #f0f2f4;
  font-size: 0.8125rem;
  color: #2b3540;
}

.listing-table thead th {
  height: 32px;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0;
  text-transform: none;
  color: #5b6570;
  background: #f0f2f4;
  white-space: nowrap;
}

.listing-table thead th:first-child {
  border-top-left-radius: 10px;
}

.listing-table thead th:last-child {
  border-top-right-radius: 10px;
}

.listing-table tbody tr.listing-row:hover {
  background: #fbfcfd;
}

.listing-table tbody tr.listing-row.is-open {
  background: #f7fbf9;
}

.listing-table tbody tr:last-child td {
  border-bottom: 0;
}

.listing-table .col-expand {
  width: 36px;
  padding-left: 8px;
  padding-right: 0;
}

.claims-table {
  table-layout: fixed;
}

.claims-table col.col-expand {
  width: 40px;
}

.claims-table col:not(.col-expand) {
  width: calc((100% - 40px) / 8);
}

.claims-table tbody tr.listing-row td {
  overflow: hidden;
  text-overflow: ellipsis;
}

.claims-table .claimant-cell > span:first-child {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}

.listing-table .col-score {
  white-space: nowrap;
}

.listing-table .col-num,
.listing-table .col-amount {
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.listing-table .col-deadline {
  white-space: nowrap;
  color: #3a4550;
}

.listing-table .col-deadline.is-overdue {
  color: var(--red);
  font-weight: 600;
}

.listing-link {
  color: #1a4f9c;
  font-weight: 500;
  font-size: 0.8125rem;
  white-space: nowrap;
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-thickness: 1px;
}

.listing-link:hover {
  color: #16303d;
}

button.stage-pop {
  border: 0;
  background: none;
  padding: 0;
  color: #1a4f9c;
  font: inherit;
  font-size: 0.8125rem;
  font-weight: 400;
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-thickness: 1px;
  cursor: pointer;
}

button.stage-pop:hover {
  color: #16303d;
}

.claimant-cell {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.expand-btn {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  padding: 0;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: #8a949c;
  cursor: pointer;
}

.expand-btn:hover,
.expand-btn.is-open {
  background: #eef6f2;
  color: var(--navy-deep);
}

.expand-btn svg {
  transition: transform 0.15s ease;
}

.expand-btn.is-open svg {
  transform: rotate(180deg);
}

.listing-empty {
  text-align: center !important;
  color: var(--text-muted);
  padding: 48px 16px !important;
  height: auto !important;
}

.listing-versions td {
  background: #f7fbf9;
  padding: 0 14px 16px 8px;
  border-bottom: 1px solid #f0f2f4;
  vertical-align: top;
  height: auto;
}

.listing-footer {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  padding: 10px 8px 6px;
}

.listing-footer.is-simple {
  grid-template-columns: 1fr auto;
}

.ov-card .listing-footer {
  padding: 12px 4px 2px;
}

.listing-pagesize {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 0.78rem;
  color: #6b7780;
  justify-self: start;
}

.listing-pagesize-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
}

.listing-pagesize-wrap select {
  appearance: none;
  height: 28px;
  padding: 0 26px 0 10px;
  border: 1px solid #d7dde3;
  border-radius: 8px;
  background: #fff;
  font: inherit;
  font-size: 0.78rem;
  color: #2b3540;
  cursor: pointer;
}

.listing-pagesize-wrap svg {
  position: absolute;
  right: 7px;
  pointer-events: none;
  color: #6b7780;
}

.listing-range {
  margin: 0;
  font-size: 0.78rem;
  color: #6b7780;
  text-align: center;
}

.listing-pager {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  justify-self: end;
}

.listing-page-of {
  font-size: 0.78rem;
  color: #6b7780;
  margin-right: 6px;
  white-space: nowrap;
}

.listing-page-btn {
  display: grid;
  place-items: center;
  min-width: 28px;
  height: 28px;
  padding: 0 6px;
  border: 1px solid #d7dde3;
  border-radius: 8px;
  background: #fff;
  color: #5b6570;
  font: inherit;
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
}

.listing-page-btn:hover:not(:disabled):not(.is-current) {
  border-color: #b8c0c6;
  background: #f7f8f9;
}

.listing-page-btn:disabled {
  opacity: 0.45;
  cursor: default;
}

.listing-page-btn.is-current {
  background: #1b2430;
  border-color: #1b2430;
  color: #fff;
  pointer-events: none;
}

.score-cell {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.listing-table .score-ring {
  width: 18px;
  height: 18px;
  margin: 0;
}

.listing-table .score-ring::after {
  width: 12px;
  height: 12px;
}

.listing-table .score-ring span {
  display: none;
}

.score-pct {
  font-size: 0.8125rem;
  font-weight: 600;
  color: #2b3540;
  font-variant-numeric: tabular-nums;
}

.listing-table .score-ring.is-fail + .score-pct,
.listing-table .score-ring.is-high + .score-pct {
  color: var(--red);
}

.status-pill {
  display: inline-flex;
  align-items: center;
  height: 24px;
  padding: 0 10px;
  border-radius: 999px;
  background: #eef1f3;
  color: #5b6570;
  font-size: 0.75rem;
  font-weight: 500;
  white-space: nowrap;
}

.listing-table .risk-pill.is-pass {
  background: #f3e8ff;
  color: #7c3aed;
}

.score-ring {
  --p: 0;
  --ring: var(--green);
  --track: #e7eeea;
  width: 40px;
  height: 40px;
  margin: 0 auto;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: conic-gradient(var(--ring) calc(var(--p) * 1%), var(--track) 0);
}

.score-ring::after {
  content: "";
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #fff;
  grid-area: 1 / 1;
}

.score-ring span {
  grid-area: 1 / 1;
  z-index: 1;
  font-size: 0.68rem;
  font-weight: 700;
  font-family: var(--mono);
  color: var(--navy-deep);
}

.score-ring.is-fail span {
  font-size: 0.52rem;
  letter-spacing: 0.02em;
  color: var(--red);
}

.score-ring.is-pass {
  --ring: var(--green);
  --track: #e4f6ea;
}

.score-ring.is-medium {
  --ring: #e0a21a;
  --track: #fff4d6;
}

.score-ring.is-high,
.score-ring.is-fail {
  --ring: var(--red);
  --track: #fde4e7;
}

.score-ring.is-high span {
  color: var(--red);
}

.risk-pill {
  display: inline-flex;
  align-items: center;
  height: 24px;
  padding: 0 10px;
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 600;
  white-space: nowrap;
}

.risk-pill.is-pass {
  background: var(--green-bg);
  color: var(--green);
}

.risk-pill.is-medium {
  background: var(--amber-bg);
  color: #b45309;
}

.risk-pill.is-high,
.risk-pill.is-fail {
  background: var(--red-bg);
  color: var(--red);
}

.risk-pill.is-pending {
  background: var(--amber-bg);
  color: #b45309;
}

.filters-scrim {
  position: fixed;
  inset: 0;
  background: rgba(17, 17, 17, 0.28);
  z-index: 70;
}

.filters-drawer {
  position: fixed;
  top: 56px;
  left: 0;
  bottom: 0;
  width: min(360px, 92vw);
  background: var(--surface);
  z-index: 71;
  display: flex;
  flex-direction: column;
  box-shadow: 8px 0 32px rgba(17, 17, 17, 0.12);
}

.filters-drawer-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 18px 20px 12px;
}

.filters-drawer-head h2 {
  margin: 0;
  font-size: 1.05rem;
}

.filters-drawer-body {
  flex: 1;
  overflow: auto;
  padding: 8px 20px 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.filters-drawer .filter-group {
  width: 100%;
}

.filters-drawer .filter-group select,
.filters-drawer .filter-group input[type="date"] {
  width: 100%;
}

.filters-drawer-foot {
  display: flex;
  gap: 10px;
  padding: 14px 20px 20px;
  border-top: 1px solid var(--border);
}

.filters-drawer-foot .btn {
  min-width: 88px;
}

.version-tree {
  margin: 4px 0 0 8px;
  overflow-x: auto;
}

.version-tree-head,
.version-tree-row {
  display: grid;
  grid-template-columns: 28px 64px minmax(140px, 1fr) minmax(140px, 1fr) 118px;
  gap: 12px;
  align-items: center;
  min-width: 620px;
}

.version-tree-head {
  padding: 8px 8px 6px;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.version-tree-row {
  position: relative;
  min-height: 36px;
  padding: 4px 8px;
  font-size: 0.8rem;
}

.version-tree-row .mono {
  font-family: var(--mono);
  font-size: 0.78rem;
}

.tree-gutter {
  position: relative;
  display: grid;
  place-items: center;
  height: 100%;
  min-height: 28px;
}

.tree-rail {
  position: absolute;
  left: 50%;
  top: -10px;
  bottom: -10px;
  width: 1px;
  background: #c5d0cb;
  transform: translateX(-50%);
}

.version-tree-row.is-last .tree-rail {
  bottom: 50%;
}

.tree-node {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #16303d;
  z-index: 1;
  box-shadow: 0 0 0 3px #f4faf7;
}

@media (max-width: 1100px) {
  .listing-footer {
    grid-template-columns: 1fr;
    justify-items: start;
  }

  .listing-range,
  .listing-pager {
    justify-self: start;
  }
}

.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.page-header h1 {
  margin: 0;
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--navy-deep);
}

.page-subtitle {
  margin: 4px 0 0;
  color: var(--text-muted);
  font-size: 0.9rem;
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--accent);
  margin-bottom: 12px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
}

.back-link:hover {
  text-decoration: underline;
}

/* ---------- Controls ---------- */
.segmented {
  display: inline-flex;
  padding: 3px;
  background: var(--surface-muted);
  border: 1px solid var(--border);
  border-radius: 8px;
  gap: 2px;
}

.segmented button {
  border: none;
  background: transparent;
  padding: 7px 14px;
  border-radius: 6px;
  font-size: 0.825rem;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
}

.segmented button.active {
  background: var(--surface);
  color: var(--navy);
  font-weight: 600;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
}

.tier-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  padding: 12px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 16px;
}

.tier-strip.is-filter {
  padding: 0;
  background: transparent;
  border: 0;
  margin: 0;
  gap: 8px;
}

.tier-strip.is-filter .tier-stat {
  border: 1px solid var(--border-strong);
  background: var(--surface);
  border-radius: 999px;
  padding: 8px 12px;
  cursor: pointer;
  font: inherit;
}

.tier-strip.is-filter .tier-stat.is-active {
  border-color: var(--navy);
  background: var(--navy-soft);
  color: var(--navy-deep);
}

.queue-priority-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-items: flex-end;
  margin-bottom: 14px;
}

.queue-search-group {
  flex: 1;
  min-width: 240px;
}

.queue-search-group input {
  width: 100%;
}

.col-sort {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  letter-spacing: inherit;
  text-transform: inherit;
  color: inherit;
  cursor: pointer;
}

.col-sort.is-right { margin-left: auto; }
.col-sort.is-center { margin-inline: auto; }

.sort-arrows {
  display: inline-flex;
  flex-direction: column;
  line-height: 0.55;
  font-size: 0.55rem;
  opacity: 0.35;
}

.sort-arrows .is-on {
  opacity: 1;
  color: var(--navy-deep);
}

.col-sort.is-active {
  color: var(--navy-deep);
}

.header-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.linkish {
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  color: var(--navy);
  text-decoration: underline;
  cursor: pointer;
}

.stat-tile.is-link,
.compose-row.is-link,
.attention-row,
.trend-banner {
  text-decoration: none;
  color: inherit;
}

.stat-tile.is-link {
  display: block;
  transition: border-color 0.15s, box-shadow 0.15s;
}

.stat-tile.is-link:hover,
.compose-row.is-link:hover,
.attention-row:hover {
  border-color: var(--navy);
}

.compose-row.is-link {
  display: grid;
}

.dash-concentrate,
.dash-attention {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px 28px;
}

.attention-row {
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.85rem;
}

.trend-banner {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface-muted);
  margin-bottom: 12px;
}

.trend-banner.is-up { border-color: var(--red-border); background: var(--red-bg); }
.trend-banner.is-down { border-color: var(--green-border); background: var(--green-bg); }

.risk-mix {
  display: grid;
  gap: 12px;
}

.risk-mix-bar {
  display: flex;
  height: 16px;
  border-radius: 999px;
  overflow: hidden;
  background: var(--surface-muted);
}

.risk-mix-bar span,
.risk-mix-legend i {
  display: block;
}

.risk-mix-bar .is-high,
.risk-mix-legend .is-high { background: var(--red); }
.risk-mix-bar .is-medium,
.risk-mix-legend .is-medium { background: var(--amber); }
.risk-mix-bar .is-low,
.risk-mix-legend .is-low { background: var(--green); }

.risk-mix-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 20px;
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: 0.85rem;
  color: var(--text-secondary);
}

.risk-mix-legend i {
  width: 8px;
  height: 8px;
  border-radius: 99px;
  display: inline-block;
  margin-right: 6px;
}

.risk-mix-legend strong {
  color: var(--navy);
  margin: 0 4px;
}

.risk-mix-insight {
  margin: 0;
  font-size: 0.9rem;
  color: var(--text);
}

.share-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 4px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  color: inherit;
  text-decoration: none;
  font-size: 0.82rem;
}

a.share-row:hover {
  border-color: var(--navy);
}

.share-row-name {

}

}

.share-row-meta {

.fail-bars {

}

.fail-bar-row {

.fail-bar-rank {

.fail-bar-label {

.fail-bar-track span {

.fail-bar-val {

.modal-head {

.pop.is-up { color: var(--red); font-weight: 600; }

.audit-scroll { max-height: 640px; overflow: auto; }

.tier-stat {

  align-items: center;
  gap: 8px;

}

.tier-stat strong {

}

.dot {

  height: 8px;

}

.dot.red { background: var(--red); }
.dot.yellow { background: #d97706; }
.dot.green { background: var(--green); }
.dot.amber { background: #d97706; }

.toolbar {

  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.toolbar-label {

  font-weight: 600;
  color: var(--text-muted);

}

.toolbar > div {

  flex-wrap: wrap;

}

.toolbar select {

/* ---------- Claims list ---------- */
.claims-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.claims-list-head,
.claim-row {
  display: grid;
  grid-template-columns: 4.75rem minmax(0, 1fr) 7.5rem 5.75rem 7.25rem 6.75rem;
  align-items: center;
  gap: 16px;
}

.claims-list-head {
  padding: 0 16px 6px;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.claims-list.has-audit .claims-list-head {
  grid-template-columns: 32px 4.75rem minmax(0, 1fr) 7.5rem 5.75rem 7.25rem 6.75rem;
}

.claims-list-head .h-amount,
.claim-amount {
  text-align: right;
}

.claims-list-head .h-risk,
.claim-tier,
.claims-list-head .h-stage,
.claim-stage-cell {

}

.claims-list-head .h-due,

}

.claim-row {
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);

  width: 100%;
}

.claim-row:hover {

}

.claim-item {

}

.claim-row-line {
  display: grid;
  grid-template-columns: 32px 1fr;
  align-items: stretch;
}

.audit-toggle {
  display: grid;
  place-items: center;
  width: 32px;
  padding: 0;
  border: 1px solid var(--border);
  border-right: 0;
  border-radius: var(--radius) 0 0 var(--radius);
  background: var(--surface-muted);
  color: var(--text-muted);
  cursor: pointer;
}

.audit-toggle:hover {
  color: var(--navy-deep);
  background: var(--navy-soft);
}

.audit-toggle.is-open {
  color: var(--navy-deep);
  background: var(--navy-soft);
}

.audit-toggle svg {
  transition: transform 0.15s ease;
}

.audit-toggle.is-open svg {
  transform: rotate(90deg);
}

.claim-item .claim-row {
  border-radius: 0 var(--radius) var(--radius) 0;
}

.claim-item.is-open .claim-row {
  border-radius: 0 var(--radius) 0 0;
}

.claim-item.is-open .audit-toggle {
  border-radius: var(--radius) 0 0 0;
}

.claim-audit {
  border: 1px solid var(--border);
  border-top: 0;
  border-radius: 0 0 var(--radius) var(--radius);
  background: var(--surface-muted);
}

.claim-audit-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 14px 8px;
  font-size: 0.8rem;
  color: var(--text-muted);
}

.claim-audit-head strong {
  color: var(--navy-deep);
  font-size: 0.85rem;
}

.claim-audit-scroll {
  overflow-x: auto;
  padding: 0 10px 12px;
}

.claim-audit-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.8rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
}

.claim-audit-table.version-table {
  min-width: 0;
}

.claim-audit-table th,
.claim-audit-table td {
  padding: 7px 8px;

  vertical-align: top;
  white-space: nowrap;
}

.claim-audit-table th {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--text-muted);
  background: #f8fbf9;
}

.claim-audit-table tr:last-child td {
  border-bottom: 0;
}

.claim-audit-table .mono {
  font-family: var(--mono);
}

.claim-audit-table .audit-comment {
  white-space: normal;

  color: var(--text-secondary);
}

.audit-status {

  border-radius: 4px;

  color: var(--green);

}

.audit-status.is-fail {
  background: var(--red-bg);
  color: var(--red);
}

.audit-status.is-bypassed,
.audit-status.is-waived {

}

.version-link {

  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  font-family: var(--mono);
  font-weight: 700;

}

.version-link:hover {

}

.modal-card-version {

}

.version-dialog {

}

.version-modal-head {

}

.version-dialog .version-modal-head {

}

.version-modal-title-row {

.version-modal-head h2 {

.version-modal-sub {

.history-dialog .az-grid-table td:nth-child(2) {

}

.version-modal-section {

}

}

.version-modal-copy {
  margin: -6px 0 10px;
  color: var(--text-secondary);
  font-size: 0.8rem;
  line-height: 1.45;
}

.version-detail-grid {

}

@media (max-width: 720px) {

    grid-template-columns: 1fr 1fr;
  }

@media (max-width: 520px) {

  }
}

.version-detail-grid dt {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.version-detail-grid dd {
  margin: 4px 0 0;
  font-size: 0.875rem;
  color: var(--navy-deep);
}

.version-table-wrap {
  overflow-x: auto;
  border: 1px solid #e4eae6;
  border-radius: 8px;
}

.az-grid-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.8rem;
  background: var(--surface);
}

.az-grid-table th,
.az-grid-table td {
  text-align: left;
  padding: 10px 12px;
  vertical-align: middle;
  border-bottom: 1px solid #eef2f0;

}

.az-grid-table th {
  background: #eef2f0;
  color: #5f6b72;
  font-size: 0.68rem;

  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.az-grid-table th::after {
  content: " :";
}

.az-grid-table tbody tr:last-child td {
  border-bottom: 0;
}

.az-grid-table td:nth-child(2) {

}

.version-dialog .audit-status {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 8px;
  border-radius: 4px;
  background: #d9f8e8;
  color: #13be2e;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.version-dialog .audit-status.is-fail {

}

.version-dialog .audit-status.is-bypassed,

}

.version-dialog .tag.critical {

  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.version-change-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.8rem;
}

.version-change-table th,
.version-change-table td {

  border-bottom: 1px solid var(--border);
  vertical-align: top;
}

.version-change-table th {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.version-uc-scroll {

}

.ledger-table.version-table {

.version-claim-scroll {

.claim-audit-empty {

}

.score-circle.lg {

.score-circle.lg.is-fail-text {

.score-circle.red {

.score-circle.yellow {

.score-circle.green {

.claim-main {

.claim-id-line {

.claim-id {
