.check-state-icon.fail {
  background: var(--red-bg);
  color: var(--red);
}

.check-state-icon.cant_evaluate {
  background: var(--amber-bg);
  color: var(--amber);
}

.check-state-icon.bypassed,
.check-state-icon.waived {
  background: var(--navy-soft);
  color: var(--navy);
}

.check-body .check-name {
  font-weight: 600;
  font-size: 0.9rem;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.check-body .evidence {
  margin: 4px 0 0;
  font-size: 0.825rem;
  color: var(--text-secondary);
  line-height: 1.4;
}

.check-weight {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  font-family: var(--mono);
  white-space: nowrap;
  padding-top: 2px;
  text-align: right;
}

.check-weight-was,
.check-weight-excluded,
.check-weight-gate {
  display: block;
  font-size: 0.68rem;
  font-weight: 500;
  color: var(--text-muted);
}

.stage-norm-hint {
  margin: 8px 0 0;
  font-size: 0.78rem;
  color: var(--text-secondary);
}

/* ---------- Dashboard ---------- */
.filters-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
  align-items: flex-end;
}

.toolbar-panel {
  display: flex;
  flex-wrap: nowrap;
  gap: 12px 14px;
  align-items: flex-end;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 16px;
  overflow-x: auto;
}

.toolbar-panel .filter-group {
  flex: 0 0 164px;
  width: 164px;
  min-width: 0;
}

.toolbar-panel .queue-search-group {
  flex: 1 1 auto;
  width: auto;
  min-width: 200px;
  max-width: none;
}

.toolbar-panel .filter-date-pair {
  display: flex;
  gap: 12px;
  flex: 0 0 auto;
}

.toolbar-panel .filter-date-pair .filter-group {
  flex: 0 0 148px;
  width: 148px;
}

.toolbar-panel .filter-group select,
.toolbar-panel .filter-group input[type="date"],
.toolbar-panel .filter-group input[type="search"] {
  min-width: 0;
  width: 100%;
}

.toolbar-panel:not(:has(.queue-search-group)) .filter-group {
  flex: 1 1 164px;
  width: auto;
  max-width: 220px;
}

@media (max-width: 760px) {
  .toolbar-panel {
    flex-wrap: wrap;
  }

  .toolbar-panel .filter-group,
  .toolbar-panel .filter-date-pair .filter-group,
  .toolbar-panel:not(:has(.queue-search-group)) .filter-group {
    flex: 1 1 148px;
    width: auto;
    max-width: none;
  }

  .toolbar-panel .queue-search-group {
    flex: 1 1 100%;
    min-width: 0;
  }

  .toolbar-panel .filter-date-pair {
    flex: 1 1 100%;
  }
}

.section-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px 16px;
  margin-bottom: 12px;
}

.section-toolbar .section-chips {
  margin-bottom: 0;
}

.section-toolbar .filter-group {
  min-width: 200px;
}

.export-menu {
  position: relative;
  display: inline-block;
}

.export-menu-panel {
  position: absolute;
  right: 0;
  top: calc(100% + 4px);
  z-index: 30;
  min-width: 188px;
  padding: 6px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
}

.export-menu-panel button {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  border-radius: 6px;
  padding: 8px 10px;
  font: inherit;
  font-size: 0.85rem;
  color: var(--text);
  cursor: pointer;
}

.export-menu-panel button:hover {
  background: var(--navy-soft);
}

.pager {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.pager-bar {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px 16px;
  flex-wrap: wrap;
  margin-top: 14px;
}

.pager-bar .pager {
  flex: 1;
  min-width: 0;
  justify-content: flex-end;
  margin-top: 0;
}

.pager-size {
  min-width: 120px;
  width: 120px;
}

.pager-size select {
  min-width: 0;
}

.pager-meta {
  font-size: 0.8rem;
  color: var(--text-muted);
}

.pager-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.pager-ellipsis {
  min-width: 1.25rem;
  text-align: center;
  color: var(--text-muted);
  font-size: 0.85rem;
}

.pager-page {
  min-width: 2rem;
  justify-content: center;
}

.pager-page.is-current {
  background: var(--navy);
  color: #fff;
  border-color: var(--navy);
  pointer-events: none;
}

.claims-list-scroll {
  max-height: min(68vh, 720px);
  overflow: auto;
  padding-right: 2px;
}

.claims-list-scroll .claims-list-head {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--bg);
}

.listing-card {
  background: #fff;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 1px 2px rgba(17, 17, 17, 0.03);
}

.listing-card .listing-table-wrap {
  border: none;
  background: #fff;
}

.audit-table {
  background: #fff;
}

.audit-table thead th {
  background: #f0f2f4;
  color: #5b6570;
}

.audit-table tbody td {
  background: #fff;
}

.audit-table th.col-type,
.audit-table td.col-type {
  text-align: left;
  vertical-align: middle;
  width: 7.5rem;
  min-width: 7.5rem;
}

.audit-table td.col-type {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-secondary);
  letter-spacing: 0.01em;
}

.audit-table .col-claim,
.audit-table .col-fnol {
  white-space: nowrap;
}

.audit-toolbar {
  gap: 8px;
}

.audit-toolbar-export {
  margin-left: auto;
}

.audit-toolbar .export-menu .btn-export {
  height: 36px;
}

.audit-custom-dates {
  margin: 0;
}

.filter-group {
  min-width: 160px;
}

.filter-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: #16303d;
  margin-bottom: 6px;
}

.filter-group select,
.filter-group input[type="date"],
.filter-group input[type="search"] {
  display: block;
  width: 100%;
  min-width: 160px;
  height: 30px;
  padding: 0 12px;
  border: 1px solid #e9e9e9;
  border-radius: 6px;
  background: #fff;
  color: #16303d;
  font: inherit;
  font-size: 13px;
  box-sizing: border-box;
}

.queue-filters {
  margin-bottom: 16px;
}

.usecase-fail-table .check-code {
  margin-right: 8px;
}

.scope-line {
  margin: 0 0 16px;
  font-size: 0.85rem;
  color: var(--text-secondary);
}

.report-sticky-bar {
  position: sticky;
  top: 0;
  z-index: 4;
  background: var(--bg);
  padding: 4px 0 4px;
  margin: 0 0 8px;
}

.report-sticky-bar .scope-line {
  margin-bottom: 8px;
}

.report-scorecard {
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
}

.report-compose {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 24px;
}

.compose-title {
  margin: 0 0 10px;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
}

.compose-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 10px;
  align-items: baseline;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.85rem;
}

.compose-row .muted,
.sample-table .muted,
.ledger-comment {
  color: var(--text-muted);
}

.section-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 14px;
}

.chip {
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text-secondary);
  border-radius: 999px;
  padding: 5px 10px;
  font-size: 0.75rem;
  font-weight: 600;
  cursor: pointer;
}

.chip:hover,
.chip.active {
  border-color: var(--accent);
  background: var(--mint-soft);
  color: var(--navy-deep);
}

.usecase-fail-row.is-button {
  width: 100%;
  text-align: left;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  cursor: pointer;
}

.usecase-fail-row.is-button:hover,
.usecase-fail-row.is-selected {
  border-color: var(--accent);
  background: var(--navy-soft);
}

.sample-table-wrap {
  overflow-x: auto;
}

.sample-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.825rem;
}

.sample-table th,
.sample-table td {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
}

.sample-table th {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--text-muted);
}

.sample-table a {
  font-weight: 600;
  color: #1a56a0;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.sample-table a:hover {
  color: #16303d;
}

.sample-table .mono {
  font-family: var(--mono);
  font-weight: 600;
}

.ledger-day {
  margin-top: 14px;
}

.ledger-day-title {
  margin: 0 0 8px;
  font-size: 0.8rem;
  color: var(--navy-deep);
}

.ledger-table {
  min-width: 1100px;
}

.ledger-row {
  display: grid;
  grid-template-columns: 52px minmax(120px, auto) minmax(110px, 1fr) minmax(160px, 1.6fr) auto auto minmax(120px, 1fr);
  gap: 10px;
  align-items: baseline;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.8rem;
}

.ledger-time {
  font-family: var(--mono);
  color: var(--text-muted);
}

.ledger-claim {
  font-weight: 600;
  color: var(--navy-deep);
}

.ledger-delta {
  color: var(--text);
}

.ledger-chip {
  display: inline-flex;
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--navy-soft);
  color: var(--navy);
  font-size: 0.7rem;
  font-weight: 600;
}

.ledger-comment {
  font-size: 0.75rem;
}

@media (max-width: 900px) {
  .ledger-row {
    grid-template-columns: 1fr 1fr;
  }
}

.stat-tiles {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}

.stat-tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
}

.stat-tile .label {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.03em;
  margin-bottom: 8px;
}

.stat-tile .value {
  font-size: 1.45rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--navy-deep);
}

.stat-tile .sub {
  margin-top: 4px;
  font-size: 0.8rem;
  color: var(--text-secondary);
}

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.panel-header h2 {
  margin: 0;
  font-size: 1rem;
  font-weight: 700;
}

.risk-breakdown {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.risk-row {
  display: grid;
  grid-template-columns: 100px 1fr;
  gap: 16px;
  align-items: center;
}

.risk-row-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: 0.875rem;
}

.risk-metrics {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.risk-numbers {
  display: flex;
  justify-content: space-between;
  font-size: 0.85rem;
  color: var(--text-secondary);
}

.risk-numbers strong {
  color: var(--text);
}

.bar-track {
  height: 8px;
  background: #eef2f6;
  border-radius: 999px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  border-radius: 999px;
}

.bar-fill.red { background: var(--red); }
.bar-fill.yellow { background: #d97706; }
.bar-fill.green { background: var(--green); }

.chart-wrap {
  position: relative;
  height: 280px;
}

.chart-empty {
  height: 220px;
  display: grid;
  place-items: center;
  color: var(--text-muted);
  font-size: 0.9rem;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface-muted);
}

/* ---------- Config ---------- */
.info-banner {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 14px 16px;
  background: #f1f5f9;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 20px;
  color: var(--text-secondary);
}

.info-banner .lock-icon {
  flex-shrink: 0;
  color: var(--text-muted);
  margin-top: 1px;
}

.info-banner strong {
  display: block;
  color: var(--text);
  margin-bottom: 2px;
  font-size: 0.9rem;
}

.info-banner p {
  margin: 0;
  font-size: 0.85rem;
  line-height: 1.4;
}

.config-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}

.config-section h2 {
  margin: 0 0 4px;
  font-size: 1rem;
}

.config-section .section-desc {
  margin: 0 0 16px;
  font-size: 0.85rem;
  color: var(--text-muted);
}

.config-check {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}

.config-check:last-child {
  border-bottom: none;
  padding-bottom: 0;
}

.config-check:first-of-type {
  padding-top: 0;
}

.config-check .name {
  font-weight: 600;
  font-size: 0.9rem;
}

.config-check .category {
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-top: 2px;
}

.weight-input-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
}

.weight-input-wrap input {
  width: 72px;
  padding: 7px 8px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  text-align: right;
  font-family: var(--mono);
  font-size: 0.875rem;
}

.weight-input-wrap input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(13, 110, 138, 0.12);
}

.weight-input-wrap .pct {
  font-size: 0.85rem;
  color: var(--text-muted);
  font-weight: 600;
}

.config-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding: 16px 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  position: sticky;
  bottom: 16px;
  box-shadow: var(--shadow);
}

.running-total {
  font-size: 0.95rem;
  font-weight: 600;
}

.running-total .total-value {
  font-family: var(--mono);
  font-size: 1.1rem;
  margin-left: 6px;
}

.running-total.at-100 .total-value {
  color: var(--green);
}

.running-total.not-100 .total-value {
  color: var(--amber);
}

.save-feedback {
  font-size: 0.85rem;
  margin: 0 0 12px;
}

.save-feedback.error {
  color: var(--red);
}

.save-feedback.success {
  color: var(--green);
  font-weight: 600;
}

.footer-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  .main {
    padding-left: 16px;
    padding-right: 16px;
  }

  .stat-tiles {
    grid-template-columns: repeat(2, 1fr);
  }

  .claims-list-head {
    display: none;
  }

  .claim-row,
  .claims-list.has-audit .claim-row {
    grid-template-columns: 48px 1fr;
    gap: 12px;
  }

  .claim-amount,
  .claim-tier,
  .claim-stage-cell,
  .due-badge {
    grid-column: 2;
    text-align: left;
    min-width: 0;
  }

  .claim-amount { margin-top: -4px; }
  .nav-capsule {
    display: none;
  }

  .mobile-nav {
    display: flex !important;
  }

  .topbar {
    grid-template-columns: 1fr auto;
    height: 56px;
    padding: 0 16px;
  }

  .topbar-date,
  .topbar-icon-btn,
  .topbar-lang {
    display: none;
  }
}

.mobile-nav {
  display: none;
  gap: 4px;
  padding: 8px 16px 12px;
  background: var(--bg);
  border-bottom: none;
  overflow-x: auto;
}

.mobile-nav .nav-link {
  height: 36px;
  padding: 0 12px;
  background: rgba(255, 255, 255, 0.55);
}

.mobile-nav .nav-link.active {
  background: #fff;
}

@media (max-width: 600px) {
  .main {
    padding: 20px 14px 40px;
  }

  .stat-tiles {
    grid-template-columns: 1fr;
  }

  .login-card {
    padding: 28px 20px 22px;
  }

  .topbar {
    padding: 0 14px;
  }

  .persona-meta .name {
    max-width: 100px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
}

/* ---------- Azentio extras ---------- */
.login-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 18px 0 14px;
  color: var(--text-muted);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.login-divider::before,
.login-divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--border);
}

.btn-sso {
  background: #fff;
  border: 1px solid #e9e9e9;
  color: #16303d;
  font-weight: 500;
}

.btn-sso:hover:not(:disabled) {
  background: #fff;
  border-color: #779398;
}

.modal-backdrop,
.drawer-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 34, 43, 0.45);
  z-index: 80;
  display: flex;
  justify-content: flex-end;
}

.modal-backdrop {
  align-items: flex-start;
  justify-content: center;
  padding: 32px 20px;
  overflow: auto;
}

.modal-backdrop[data-stage-backdrop] {
  align-items: center;
  justify-content: center;
}

.modal-backdrop[data-stage-backdrop] .modal-card.version-dialog {
  max-height: calc(100vh - 64px);
  margin: auto;
  overflow: auto;
}

.modal-backdrop[data-stage-backdrop] .version-dialog .version-modal-head {
  padding: 18px 16px 8px;
}

.modal-backdrop[data-stage-backdrop] .version-modal-body {
  padding: 0 12px 4px;
}

.modal-backdrop[data-stage-backdrop] .listing-table.is-fluid {
  min-width: 0;
  width: 100%;
}

.modal-backdrop[data-stage-backdrop] .listing-table th:nth-child(n + 2),
.modal-backdrop[data-stage-backdrop] .listing-table td:nth-child(n + 2) {
  width: 1%;
  white-space: nowrap;
}

.modal-backdrop[data-stage-backdrop] .listing-table th:last-child,
.modal-backdrop[data-stage-backdrop] .listing-table td:last-child {
  padding-right: 12px;
}

.modal-card {
  width: min(420px, 100%);
  background: var(--surface);
  border-radius: 14px;
  padding: 24px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

.modal-card.version-dialog,
.modal-card.history-dialog,
.modal-card.modal-card-version {
  width: min(980px, calc(100vw - 40px));
  max-width: none;
  max-height: none;
  display: flex;
  flex-direction: column;
  padding: 0;
  overflow: visible;
  border-radius: 16px;
}

.modal-card.version-dialog h2,
.modal-card.history-dialog h2,
.modal-card.modal-card-version h2 {
  margin: 0;
  white-space: nowrap;
}

.modal-card.modal-card-wide {
  width: min(560px, 100%);
  max-width: none;
}

.modal-card h2 {
  margin: 0 0 8px;
  font-size: 1.15rem;
  color: var(--navy-deep);
}

.modal-copy {
  margin: 0 0 16px;
  color: var(--text-secondary);
  font-size: 0.875rem;
  line-height: 1.45;
}

.sso-persona-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 14px;
}

.sso-persona {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-muted);
  cursor: pointer;
}

.sso-persona:hover {
  border-color: var(--accent);
  background: var(--navy-soft);
}

.sso-persona strong {
  display: block;
  font-size: 0.9rem;
}

.sso-persona small {
  color: var(--text-muted);
  font-size: 0.75rem;
}

.claim-link {
  background: none;
  border: none;
  padding: 0;
  color: var(--accent);
  font-weight: 700;
  font-size: inherit;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
}

.claim-link:hover {
  color: var(--accent-hover);
}

.claim-drawer {
  width: min(420px, 100%);
  height: 100%;
  background: var(--surface);
  border-left: 1px solid var(--border);
  box-shadow: -8px 0 32px rgba(22, 48, 61, 0.12);
  display: flex;
  flex-direction: column;
  animation: slideIn 0.2s ease;
}

@keyframes slideIn {
  from { transform: translateX(24px); opacity: 0.6; }
  to { transform: translateX(0); opacity: 1; }
}

.drawer-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
}

.drawer-header h2 {
  margin: 0;
  font-size: 1.05rem;
}

.drawer-sub {
  margin: 4px 0 0;
  color: var(--text-muted);
  font-size: 0.8rem;
  font-family: var(--mono);
}

.drawer-body {
  padding: 18px 20px 28px;
  overflow: auto;
}

.drawer-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.drawer-section-title {
  margin: 22px 0 10px;
  font-size: 0.85rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.stage-score-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.stage-score-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 10px;
  background: var(--surface-muted);
  border-radius: var(--radius-sm);
  font-size: 0.875rem;
}

.icon-btn {
  appearance: none;
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
}

.icon-btn:hover {
  background: var(--surface-muted);
  color: var(--navy);
}

.check-code {
  display: inline-flex;
  align-items: center;
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--accent-text);
  background: var(--mint-soft);
  border: 1px solid var(--accent);
  border-radius: 4px;
  padding: 1px 6px;
  margin-right: 6px;
}

.score-circle.xs {
  width: 34px;
  height: 34px;
  font-size: 0.55rem;
  border-width: 2px;
}

.score-circle.xs.is-fail-text {
  font-size: 0.48rem;
}

.stage-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}

.stage-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-secondary);
}

button.stage-chip {
  cursor: pointer;
  font: inherit;
}

button.stage-chip:hover {
  border-color: var(--border-strong);
}

button.stage-chip.is-active {
  border-color: var(--accent);
  background: var(--mint-soft);
  color: var(--navy-deep);
}

.stage-block {
  margin-bottom: 18px;
}

.stage-block-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}

.stage-block-header h3 {
  margin: 0;
  font-size: 0.95rem;
  color: var(--navy-deep);
}

.stage-block-header p {
  margin: 2px 0 0;
  font-size: 0.8rem;
  color: var(--text-muted);
}

.config-subhead {
  margin: 16px 0 8px;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.stage-config .running-total {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

.stage-fail-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.stage-fail-card {
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-muted);
}

.stage-fail-top {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 0.85rem;
  margin-bottom: 8px;
}

.stage-fail-top span {
  color: var(--text-muted);
}

.stage-fail-top-uc {
  margin: 8px 0 0;
  font-size: 0.75rem;
  color: var(--text-secondary);
  line-height: 1.35;
}

.usecase-fail-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.usecase-fail-row {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 16px;
  align-items: center;
}

.usecase-fail-meta {
  display: flex;
  align-items: flex-start;
  gap: 8px;
}

.usecase-fail-meta strong {
  display: block;
  font-size: 0.875rem;
}

.usecase-fail-meta small {
  color: var(--text-muted);
  font-size: 0.75rem;
}

.usecase-fail-bar-wrap {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  align-items: center;
}

@media (max-width: 800px) {
  .stage-fail-grid,
  .usecase-fail-row,
  .drawer-grid {
    grid-template-columns: 1fr;
  }
}

/* ---------- Config table ---------- */
.config-layout {
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}

.config-subnav {
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: sticky;
  top: 12px;
}

.config-subnav-item {
  text-align: left;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-secondary);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
}

.config-subnav-item:hover,
.config-subnav-item.is-active {
  border-color: var(--accent);
  background: var(--mint-soft);
  color: var(--navy-deep);
}

.config-stage-pane {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.config-criteria-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  display: flex;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.config-criteria-card h2 {
  margin: 0 0 6px;
  font-size: 1rem;
}

.config-criteria-card p {
  margin: 0;
  color: var(--text-secondary);
  font-size: 0.85rem;
}

.config-pass-field {
  display: flex;
  align-items: flex-end;
  gap: 10px;
}

.config-pass-input {
  display: flex;
  align-items: center;
  gap: 6px;
}

.config-pass-input input {
  width: 72px;
}

.config-mix-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  width: 100%;
}

.config-mix-card {
  flex-direction: column;
}

.config-weight-footer {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  background: var(--surface-muted);
  font-size: 0.85rem;
}

.config-weight-footer.is-ok strong {
  color: var(--green);
}

.config-weight-footer.is-warn strong {
  color: var(--amber);
}

.config-weight-footer small {
  color: var(--text-muted);
}

@media (max-width: 900px) {
  .config-layout {
    grid-template-columns: 1fr;
  }
  .config-subnav {
    flex-direction: row;
    flex-wrap: wrap;
    position: static;
  }
}

.config-page-header {
  align-items: flex-end;
}

.config-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.version-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.current-version-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--mint-soft);
  border: 1px solid var(--accent);
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--accent-text);
}

.readonly-tag {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  background: var(--surface);
  border-radius: 999px;
  padding: 2px 8px;
  color: var(--text-muted);
}

.prev-versions-wrap {
  position: relative;
}

.prev-versions-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.prev-versions-menu {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  min-width: 280px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  z-index: 40;
  padding: 6px;
}

.prev-version-item {
  display: block;
  width: 100%;
  text-align: left;
  border: none;
  background: transparent;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 0.85rem;
  color: var(--text);
}

.prev-version-item:hover {
  background: var(--mint-soft);
}

.prev-empty {
  padding: 12px;
  font-size: 0.85rem;
  color: var(--text-muted);
}

.config-table-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.config-table-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-muted);
}

.config-table-wrap {
  overflow: auto;
}

.config-table {
  width: 100%;
  border-collapse: collapse;
}

.config-table .col-menu {
  width: 44px;
  padding-left: 10px;
  padding-right: 4px;
}

.uc-name {
  font-weight: 600;
  color: var(--navy-deep);
  min-width: 180px;
}

.uc-desc {
  color: var(--text-secondary);
  max-width: 320px;
  line-height: 1.4;
}

.uc-weight {
  font-family: var(--mono);
  font-weight: 600;
}

.empty-cell {
  text-align: center;
  color: var(--text-muted);
  padding: 28px !important;
}

.cat-pill {
  display: inline-flex;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: capitalize;
}

.cat-critical {
  background: var(--red-bg);
  color: var(--red);
  border: 1px solid var(--red-border);
}

.cat-high {
  background: var(--amber-bg);
  color: var(--amber);
  border: 1px solid var(--amber-border);
}

.cat-low {
  background: var(--mint-soft);
  color: var(--accent-text);
  border: 1px solid var(--accent);
}

.row-menu-wrap {
  position: relative;
}

.row-menu-btn {
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px;
  border-radius: 6px;
}

.row-menu-btn:hover {
  background: var(--mint-soft);
  color: var(--accent-text);
}

.row-menu {
  position: absolute;
  top: 100%;
  left: 0;
  min-width: 200px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  z-index: 30;
  padding: 4px;
}

.row-menu button {
  display: block;
  width: 100%;
  text-align: left;
  border: none;
  background: transparent;
  padding: 8px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.825rem;
}

.row-menu button:hover {
  background: var(--mint-soft);
}

.row-menu button.danger {
  color: var(--red);
}

.btn-danger {
  background: rgba(242, 68, 86, 0.2);
  color: #f24456;
  border: 1px solid transparent;
}

.btn-danger:hover:not(:disabled) {
  background: rgba(242, 68, 86, 0.28);
  color: #f24456;
}

.modal-card-wide {
  width: min(560px, 100%);
}

.field-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.field-row-2 {
  grid-template-columns: repeat(2, 1fr);
}

.version-dates-block {
  margin-top: 16px;
  padding: 14px 14px 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-muted);
}

.version-dates-block.is-disabled {
  opacity: 1;
}

.version-dates-block.is-disabled input {
  background: #eef1f3;
  cursor: not-allowed;
}

.version-dates-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}

.version-dates-hint {
  margin: 0 0 12px;
  font-size: 12px;
  line-height: 1.4;
  color: var(--text-secondary);
}

.version-dates-error {
  margin: 0 0 12px;
  font-size: 12px;
  color: #f24456;
  font-weight: 500;
}

.optional-label {
  font-weight: 400;
  color: var(--text-secondary);
}

.required-mark {
  color: #f24456;
  font-weight: 700;
}

.modal-card input[type='date'],
.modal-card input[type='text'],
.modal-card input[type='number'],
.modal-card select {
  width: 100%;
  height: 30px;
  padding: 0 12px;
  border: 1px solid #e9e9e9;
  border-radius: 6px;
  background: #fff;
  color: #16303d;
  font: inherit;
  font-size: 13px;
}

.modal-card input:focus,
.modal-card select:focus,
.modal-card textarea:focus {
  outline: none;
  border-color: #7b959c;
  box-shadow: inset 0 0 2px rgba(3, 89, 39, 0.15);
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 18px;
}

.value-readonly {
  padding: 10px 12px;
  background: var(--surface-muted);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-weight: 600;
}

.modal-card textarea {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid #e9e9e9;
  border-radius: 6px;
  resize: vertical;
  background: #fff;
  color: #16303d;
  font: inherit;
  font-size: 13px;
}

.modal-card select,
.config-table-filters select,
.config-table-filters input {
  width: 100%;
  height: 30px;
  padding: 0 12px;
  border: 1px solid #e9e9e9;
  border-radius: 6px;
  background: #fff;
  color: #16303d;
  font-size: 13px;
}

@media (max-width: 700px) {
  .field-row {
    grid-template-columns: 1fr;
  }
}




.version-notice {
  margin: 0 0 14px;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid #86efac;
  background: #f0fdf4;
  color: #166534;
  font-size: 13px;
  line-height: 1.45;
  font-weight: 500;
}

.btn-request,
.btn-request:hover:not(:disabled) {
  background: #16303d;
  color: #55ffbe;
  border-color: #16303d;
}

.uc-picker {
  position: relative;
}

.uc-picker-trigger {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  text-align: left;
  cursor: pointer;
  font: inherit;
  color: var(--text);
}

.uc-picker-trigger-label {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.uc-picker-caret {
  color: var(--text-secondary);
}

.uc-status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  background: #cbd5e1;
}

.uc-picker-trigger.is-enabled .uc-status-dot,
.uc-picker-option.is-enabled .uc-status-dot,
.uc-status-dot.is-enabled {
  background: #22c55e;
  box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
}

.uc-picker-trigger.is-locked .uc-status-dot,
.uc-picker-option.is-locked .uc-status-dot,
.uc-status-dot.is-locked {
  background: #94a3b8;
}

.uc-picker-menu {
  position: absolute;
  z-index: 40;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  max-height: 280px;
  overflow: auto;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
  padding: 8px;
}

.uc-picker-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding: 4px 6px 10px;
  font-size: 12px;
  color: var(--text-secondary);
}

.uc-picker-legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.uc-picker-group-label {
  padding: 8px 8px 4px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-secondary);
}

.uc-picker-empty {
  padding: 12px;
  font-size: 13px;
  color: var(--text-secondary);
}

.uc-picker-option {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 8px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  cursor: pointer;
  text-align: left;
  font: inherit;
  color: var(--text);
}

.uc-picker-option:hover,
.uc-picker-option.is-selected {
  background: var(--surface-muted);
}

.uc-picker-option.is-locked {
  color: #64748b;
}

.uc-picker-option-text {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.uc-picker-code {
  font-family: "Poppins", system-ui, sans-serif;
  font-size: 12px;
  font-weight: 600;
}

.uc-picker-name {
  font-size: 13px;
  font-weight: 400;
  line-height: 1.35;
}

.uc-picker-badge {
  flex-shrink: 0;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 999px;
}

.uc-picker-option.is-enabled .uc-picker-badge {
  background: #dcfce7;
  color: #166534;
}

.stage-block-score {
  display: flex;
  align-items: center;
  gap: 8px;
}

.empty-checks {
  padding: 10px 12px;
  font-size: 0.8rem;
  color: var(--text-muted);
}

.doc-complete-chip {
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--navy);
  background: var(--mint-soft);
  border: 1px solid var(--accent);
  border-radius: 999px;
  padding: 3px 8px;
  white-space: nowrap;
}

.doc-disclosure {
  margin-top: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-muted);
}

.doc-disclosure > summary {
  cursor: pointer;
  list-style: none;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 10px 14px;
}

.doc-disclosure > summary::-webkit-details-marker {
  display: none;
}

.doc-disclosure > summary::after {
  content: '▸';
  float: right;
  font-size: 0.8rem;
  color: var(--text-muted);
}

.doc-disclosure[open] > summary::after {
  content: '▾';
}

.doc-disclosure .doc-checklist {
  margin-top: 0;
  padding: 0 10px 10px;
}

.doc-checklist {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.doc-checklist-label {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 2px 2px 0;
}

.stage-hold-note {
  margin: 0 0 10px;
  padding: 10px 12px;
  font-size: 0.82rem;
  line-height: 1.45;
  color: var(--text-secondary);
  background: var(--amber-bg, #fff6e5);
  border: 1px solid var(--amber);
  border-radius: var(--radius-sm);
}

.doc-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: start;
  padding: 12px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  text-align: left;
  font: inherit;
  color: inherit;
  width: 100%;
}

.doc-row.is-action {
  cursor: pointer;
}

.doc-row.is-action:hover {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(95, 255, 190, 0.25);
}

.doc-row.missing {
  border-left: 3px solid var(--amber);
}

.doc-row.rejected {
  border-left: 3px solid var(--red);
}

.doc-row.is-highlight.missing {
  background: var(--amber-bg, #fff8eb);
}

.doc-row.is-highlight.rejected {
  background: var(--red-bg, #fff1f1);
}

.doc-row.uploaded,
.doc-row.already_on_file,
.doc-row.waived {
  border-left: 3px solid var(--green);
}

.doc-row-title {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.doc-name {
  font-weight: 600;
  font-size: 0.88rem;
}

.doc-min {
  font-weight: 500;
  color: var(--text-muted);
  font-size: 0.75rem;
}

.doc-note {
  margin: 4px 0 0;
  font-size: 0.8rem;
  color: var(--text-secondary);
  line-height: 1.4;
}

.doc-why {
  margin: 4px 0 0;
  font-size: 0.78rem;
  color: var(--text-muted);
  line-height: 1.4;
}

.doc-status {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

.doc-status.missing { color: var(--amber); }
.doc-status.rejected { color: var(--red); }
.doc-status.uploaded,
.doc-status.already_on_file,
.doc-status.waived { color: var(--green); }

.tag.doc-required {
  background: var(--navy-soft);
  color: var(--navy);
  border: 1px solid var(--border-strong);
}

.tag.doc-optional {
  background: #f1f5f9;
  color: var(--text-secondary);
  border: 1px solid var(--border);
}

.tag.doc-conditional {
  background: #fff7ed;
  color: #c2410c;
  border: 1px solid #fdba74;
}

.doc-thumb {
  width: 56px;
  height: 44px;
  border-radius: 6px;
  background: linear-gradient(135deg, #16303d 0%, #1d4d3c 100%);
  color: var(--mint);
  display: grid;
  place-items: center;
  font-size: 0.62rem;
  font-weight: 700;
  text-align: center;
  padding: 4px;
  line-height: 1.2;
}

.doc-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  max-width: 160px;
  padding: 6px 8px;
  border-radius: 6px;
  font-size: 0.7rem;
  font-weight: 600;
  border: 1px solid var(--border);
  background: var(--surface-muted);
  color: var(--text-secondary);
}

.doc-chip.pdf {
  background: #f8fafc;
  color: var(--navy);
}

.doc-chip.missing {
  opacity: 0.55;
  border-style: dashed;
}

.doc-chip.on-file {
  background: var(--mint-soft);
  border-color: var(--accent);
  color: var(--navy);
}

.doc-chip.waived {
  background: #f1f5f9;
}

.doc-chip-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--mono);
  font-weight: 500;
}

.surveyor-banner {
  margin: 0 0 16px;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--navy-soft);
  color: var(--navy);
}

.surveyor-banner strong {
  display: block;
  font-size: 0.9rem;
  margin-bottom: 4px;
}

.surveyor-banner p {
  margin: 0;
  font-size: 0.82rem;
  line-height: 1.4;
  color: var(--text-secondary);
}

.surveyor-banner.is-done {
  border-color: #86efac;
  background: #f0fdf4;
}

.surveyor-banner.is-done strong {
  color: #166534;
}

.surveyor-submit {
  margin-top: 12px;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-muted);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.surveyor-submit p {
  margin: 0;
  font-size: 0.82rem;
  color: var(--text-secondary);
  flex: 1;
  min-width: 220px;
}

.exception-block {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
}

.exception-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.exception-status {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--navy);
}

.exception-status.is-pending {
  color: #b45309;
}

.exception-status.is-back {
  color: var(--red);
}

.exception-note,
.exception-lead,
.exception-evidence {
  margin: 0;
  font-size: 0.8rem;
  color: var(--text-secondary);
  line-height: 1.4;
}

.exception-panel {
  width: 100%;
  margin-top: 4px;
  padding: 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--navy-soft);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.exception-panel strong {
  color: var(--navy-deep);
  font-size: 0.85rem;
}

.exception-fields {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 10px;
}

.exception-panel label,
.exception-fields label {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 12px;
  font-weight: 600;
  color: #16303d;
}

.exception-panel input,
.exception-panel textarea {
  font: inherit;
  font-weight: 400;
  color: #16303d;
  padding: 0 12px;
  height: 30px;
  border: 1px solid #e9e9e9;
  border-radius: 6px;
  background: #fff;
}

.exception-panel textarea {
  height: auto;
  padding: 8px 12px;
  resize: vertical;
  min-height: 56px;
}

.exception-panel input:focus,
.exception-panel textarea:focus {
  outline: none;
  border-color: #7b959c;
  box-shadow: inset 0 0 2px rgba(3, 89, 39, 0.15);
}

.tier-label .tag {
  margin-left: 6px;
  vertical-align: middle;
}

/* ---------- Risk overview (ClaimFlow layout, AZ colour) ---------- */
.ov-page {
  display: grid;
  gap: 20px;
}

.ov-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.ov-head h1 {
  margin: 0;
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--navy-deep);
}

.ov-tools {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.ov-search {
  position: relative;
  min-width: 220px;
  flex: 1 1 220px;
  max-width: 280px;
}

.ov-search-wide {
  flex: 1 1 auto;
  width: min(560px, 100%);
  min-width: 380px;
  max-width: 560px;
}

.ov-search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: #7b959c;
  display: grid;
  pointer-events: none;
}

.ov-search input,
.ov-select {
  height: 30px;
  border: 1px solid #e9e9e9;
  border-radius: 8px;
  background: #fff;
  color: #16303d;
  font-size: 13px;
}

.ov-search input::placeholder,
.listing-search input::placeholder,
.pill-input::placeholder,
textarea::placeholder {
  color: #adbcc0;
}

.ov-search input {
  width: 100%;
  padding: 0 12px 0 38px;
}

.ov-select {
  padding: 0 12px;
  min-width: 140px;
}

.ov-search input:hover,
.ov-select:hover,
label.listing-mini-select select:hover,
.pill-input:hover,
.filter-group select:hover,
.filter-group input:hover,
.toolbar select:hover {
  border-color: #779398;
}

.ov-search input:focus,
.ov-select:focus,
label.listing-mini-select select:focus,
.pill-input:focus,
.filter-group select:focus,
.filter-group input:focus,
.toolbar select:focus {
  outline: none;
  border-color: #7b959c;
  box-shadow: inset 0 0 2px rgba(3, 89, 39, 0.15);
}

.ov-report {
  height: 40px;
  white-space: nowrap;
}

.ov-kpis {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
}

.ov-kpi {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
  min-height: 168px;
  padding: 20px 20px 16px;
  border-radius: 18px;
  text-decoration: none;
  overflow: hidden;
  box-shadow: 0 10px 28px rgba(17, 17, 17, 0.06);
  color: inherit;
  cursor: default;
}

.ov-kpi:hover {
  box-shadow: 0 10px 28px rgba(17, 17, 17, 0.06);
}

.ov-kpi-icon {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.16);
  margin-bottom: 4px;
}

.ov-kpi-value {
  font-size: 2rem;
  font-weight: 700;
  letter-spacing: -0.04em;
  line-height: 1.1;
}

.ov-kpi-label {
  font-size: 0.88rem;
  font-weight: 500;
  opacity: 0.86;
}

.ov-kpi-delta {
  margin-top: auto;
  font-size: 0.78rem;
  font-weight: 600;
}

.ov-kpi.is-navy {
  background: linear-gradient(145deg, #1c4454 0%, #16303d 58%, #0e222c 100%);
  color: #fff;
}

.ov-kpi.is-navy .ov-kpi-delta {
  color: var(--accent);
}

.ov-kpi.is-mint {
  background: linear-gradient(145deg, #4ae6a3 0%, #2edb8e 48%, #1bb574 100%);
  color: #0b1f18;
}

.ov-kpi.is-mint .ov-kpi-icon {
  background: rgba(11, 31, 24, 0.12);
}

.ov-kpi.is-mint .ov-kpi-delta {
  color: #16303d;
  opacity: 0.82;
}

.ov-kpi.is-mint .ov-kpi-delta.is-up {
  color: #16303d;
  opacity: 0.9;
}

.ov-kpi.is-white {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--navy-deep);
}

.ov-kpi.is-white .ov-kpi-icon {
  background: var(--mint-soft);
  color: #16303d;
}

.ov-kpi.is-white .ov-kpi-icon.is-alert {
  background: var(--red-bg);
  color: var(--red);
}

.ov-kpi.is-white .ov-kpi-label,
.ov-kpi.is-white .ov-kpi-delta {
  color: var(--text-muted);
  font-weight: 500;
}

.ov-kpi.is-white .ov-kpi-delta.is-up {
  color: var(--red);
  font-weight: 600;
}

.ov-kpi.is-white .ov-kpi-delta.is-down {
  color: var(--green);
  font-weight: 600;
}

.ov-kpi-flag {
  position: absolute;
  top: 18px;
  right: 16px;
  padding: 4px 8px;
  border-radius: 999px;
  background: var(--red-bg);
  color: var(--red);
  font-size: 0.7rem;
  font-weight: 700;
}

.ov-spark {
  display: block;
  width: 100%;
  height: 44px;
  margin-top: 4px;
}

.ov-charts {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(260px, 0.9fr);
  gap: 14px;
}

.ov-charts.is-equal {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.ov-charts.is-equal .ov-chart-h {
  height: 200px;
}

.ov-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 18px 18px 16px;
  box-shadow: 0 8px 24px rgba(17, 17, 17, 0.04);
  min-width: 0;
}

.ov-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 12px;
}

.ov-card-head h2 {
  margin: 0;
  font-size: 1rem;
  font-weight: 700;
  color: var(--navy-deep);
}

.ov-card-head p {
  margin: 2px 0 0;
  font-size: 0.78rem;
  color: var(--text-muted);
}

.ov-card-actions {
  display: flex;
  align-items: center;
  flex-wrap: nowrap;
  gap: 8px;
  flex: 0 0 auto;
}

.ov-card-table .ov-card-actions {
  flex: 1 1 auto;
  justify-content: flex-end;
  min-width: 0;
}

.ov-card-table .ov-search {
  flex: 1 1 auto;
  width: 100%;
  min-width: 380px;
  max-width: 560px;
}

.ov-card-table .ov-search input,
.ov-card-table .ov-toolbar-row .ov-select {
  height: 30px;
}

.ov-card-table .ov-card-actions .btn,
.ov-toolbar-end .btn {
  height: 36px;
}

.ov-toolbar-row {
  display: flex;
  flex-wrap: nowrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 0 0 14px;
}

.ov-toolbar-row .ov-pills {
  flex: 0 1 auto;
  min-width: 0;
}

.ov-toolbar-end {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 0 0 auto;
}

.ov-toolbar-row .ov-select {
  min-width: 148px;
  width: 168px;
}

.ov-select.ov-date {
  min-width: 148px;
}

.ov-tools .export-menu .btn,
.ov-tools .btn-export {
  height: 36px;
}

.ov-head .export-menu .btn-export {
  min-width: 0;
  height: 30px;
  padding: 0 12px;
  font-size: 13px;
}

.ov-card-table .ov-card-actions .btn-export,
.ov-toolbar-end .btn-export {
  height: 36px;
}

.ov-card .pager {
  margin-top: 12px;
  padding-top: 4px;
}

.ov-pills {
  display: inline-flex;
  padding: 3px;
  background: var(--surface-muted);
  border-radius: 8px;
  gap: 2px;
}

.ov-pills button {
  border: 0;
  background: transparent;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
}

.ov-pills button:hover:not(.is-on) {
  background: #fff;
  color: #16303d;
}

.ov-pills button.is-on {
  background: #16303d;
  color: #fff;
}

.ov-chart-h {
  height: 220px;
}

.ov-donut {
  display: grid;
  justify-items: center;
  gap: 12px;
}

.ov-donut-plot {
  position: relative;
  width: 180px;
  height: 180px;
}

.ov-donut-center {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  text-align: center;
  pointer-events: none;
}

.ov-donut-center strong {
  font-size: 1.35rem;
  letter-spacing: -0.03em;
}

.ov-donut-center span {
  font-size: 0.72rem;
  color: var(--text-muted);
}

.ov-donut-legend {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 6px;
  width: 100%;
  font-size: 0.8rem;
}

.ov-donut-legend li {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-secondary);
}

.ov-donut-legend i {
  width: 9px;
  height: 9px;
  border-radius: 50%;
}

.ov-donut-legend .is-high { background: var(--red); }
.ov-donut-legend .is-medium { background: var(--amber); }
.ov-donut-legend .is-low { background: var(--green); }

.ov-donut-legend span {
  margin-left: auto;
  font-weight: 700;
  color: var(--navy-deep);
}

.ov-bottom {
  display: grid;
  grid-template-columns: minmax(0, 1.7fr) minmax(260px, 0.9fr);
  gap: 14px;
}

.ov-table-wrap {
  overflow-x: auto;
}

.ov-table {
  width: 100%;
  border-collapse: collapse;
}

.ov-table th,
.ov-table td {
  padding: 12px 10px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  font-size: 0.82rem;
  white-space: nowrap;
}

.ov-table th {
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.ov-table .col-num {
  text-align: right;
}

.rpt-row {
  cursor: pointer;
}

.rpt-row:hover td {
  background: #f4f7f8;
}

.rpt-outcome {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 10px;
  align-items: center;
}

.rpt-inline {
  color: #16303d;
  font-weight: 600;
  text-decoration: none;
}

.rpt-inline:hover {
  text-decoration: underline;
}

.rpt-dot {
  color: var(--text-muted);
}

.ov-table .is-urgent {
  color: var(--red);
  font-weight: 600;
}

.ov-workload {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.ov-work-row {
  display: grid;
  grid-template-columns: 36px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  text-decoration: none;
  color: inherit;
}

.ov-work-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 0.7rem;
  font-weight: 700;
  background: var(--mint-soft);
  color: #16303d;
}

.ov-work-copy {
  min-width: 0;
  display: grid;
  gap: 6px;
}

.ov-work-copy strong {
  font-size: 0.82rem;
  font-weight: 600;
}

.ov-work-track {
  height: 8px;
  border-radius: 999px;
  background: #eef3f0;
  overflow: hidden;
}

.ov-work-track span {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #2edb8e, #16303d);
}

.ov-work-n {
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--navy-deep);
}

.ov-scope {
  margin: -8px 0 0;
  font-size: 0.8rem;
  color: var(--text-muted);
}

.ov-kpis.is-six {
  grid-template-columns: repeat(6, minmax(0, 1fr));
}

.ov-kpis.is-six .ov-kpi {
  min-height: 156px;
  padding: 16px 16px 14px;
}

.ov-kpis.is-six .ov-kpi-value {
  font-size: 1.45rem;
}

.ov-compose {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px 28px;
}

.ov-compose.is-charts {
  gap: 20px;
  align-items: start;
}

.ov-compose.is-charts .ov-chart-h {
  height: 200px;
  margin-bottom: 8px;
}

.ov-donut-plot.is-sm {
  width: 150px;
  height: 150px;
}

.ov-compose.is-charts .ov-donut {
  margin-bottom: 8px;
}

.ov-compose-col h3 {
  margin: 0 0 8px;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.ov-compose-note {
  margin: 0;
  font-size: 0.8rem;
  color: var(--text-muted);
}

.ov-mix-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  gap: 10px;
  align-items: baseline;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.82rem;
}

.ov-mix-row:last-child {
  border-bottom: 0;
}

.ov-mix-row strong {
  color: var(--navy-deep);
}

.ov-mix-row em {
  font-style: normal;
  color: var(--text-muted);
  font-size: 0.75rem;
}

@media (max-width: 1180px) {
  .ov-kpis,
  .ov-charts,
  .ov-bottom {
    grid-template-columns: 1fr 1fr;
  }

  .ov-kpis.is-six,
  .ov-compose,
  .ov-charts.is-equal {
    grid-template-columns: 1fr 1fr;
  }

  .ov-card-wide {
    grid-column: 1 / -1;
  }
}

@media (max-width: 720px) {
  .ov-kpis,
  .ov-kpis.is-six,
  .ov-charts,
  .ov-bottom,
  .ov-compose {
    grid-template-columns: 1fr;
  }

  .ov-kpi {
    min-height: 148px;
  }

  .version-modal-head h2 {
    white-space: normal;
  }
}

/* ---------- Claim details (compact workbench) ---------- */

.cd-stage-score {

function documentApplies(claim, def) {
  if (!def) return false;
  const type = claim.claimType || 'own_damage';
  if (!def.condition) return true;
  if (def.condition === 'tp') return type === 'tp';
  if (def.condition === 'theft') return type === 'theft';
  if (def.condition === 'total_loss') return type === 'total_loss';
  if (def.condition === 'towed') return !!claim.towed;
  if (def.condition === 'police') return type === 'tp' || type === 'theft';
  return true;
}

function emptyDocRecord() {
  return { status: 'missing', filename: null, thumb: null, note: '', count: 0 };
}

function getDocRecord(claim, docId) {
  return claim.documents?.[docId] || emptyDocRecord();
}

function countMeetsMin(def, rec) {
  return (rec.count || 0) >= (def.minCount || 1);
}

function isDocumentSatisfied(claim, def) {
  if (!def) return false;
  const rec = getDocRecord(claim, def.id);
  if (rec.status === 'waived') return true;
  if (rec.status === 'uploaded' && countMeetsMin(def, rec)) return true;
  if (def.carryFrom) {
    const prior = DOCUMENT_CATALOG.find((d) => d.id === def.carryFrom);
    if (prior && isDocumentSatisfied(claim, prior) && rec.status !== 'rejected') return true;
  }
  return false;
}

/** Required or applicable-conditional docs still outstanding for a check. */
function missingRequiredDocsForCheck(claim, checkId) {
  return DOCUMENT_CATALOG.filter((def) => {
    if (!def.linkedCheckIds?.includes(checkId)) return false;
    if (def.required === 'optional') return false;
    if (!documentApplies(claim, def)) return false;
    return !isDocumentSatisfied(claim, def);
  });
}

function uploadedDocsForCheck(claim, checkId) {
  return DOCUMENT_CATALOG.filter((def) => {
    if (!def.linkedCheckIds?.includes(checkId)) return false;
    if (!documentApplies(claim, def)) return false;
    const rec = getDocRecord(claim, def.id);
    return rec.status === 'uploaded' && countMeetsMin(def, rec);
  });
}

function getStageDocumentRows(claim, stageId) {
  return DOCUMENT_CATALOG.filter((def) => def.stage === stageId && documentApplies(claim, def)).map((def) => {
    const rec = getDocRecord(claim, def.id);
    const prior = def.carryFrom ? DOCUMENT_CATALOG.find((d) => d.id === def.carryFrom) : null;
    const carried =
      prior &&
      isDocumentSatisfied(claim, prior) &&
      rec.status !== 'uploaded' &&
      rec.status !== 'rejected' &&
      rec.status !== 'waived';
    return {
      def,
      rec,
      displayStatus: carried ? 'already_on_file' : rec.status,
      alreadyOnFile: !!carried,
    };
  });
}

function getStageDocCompleteness(claim, stageId) {
  const rows = getStageDocumentRows(claim, stageId).filter((row) => row.def.required !== 'optional');
  const done = rows.filter((row) => isDocumentSatisfied(claim, row.def)).length;
  return { done, total: rows.length };
}

function hasStageDocsComplete(claim, stageId) {
  const { done, total } = getStageDocCompleteness(claim, stageId);
  return total === 0 || done === total;
}

function hasPassedPriorStages(claim, stageIds) {
  return stageIds.every((id) => hasStageDocsComplete(claim, id) && !stageHasCriticalFail(claim, id));
}

/** Claims that cleared FNOL + Registration and are waiting on assessment submit. */
function isReadyForSurveyor(claim) {
  return hasPassedPriorStages(claim, ['fnol', 'intimation']) && !claim.surveyorSubmitted;
}

function stageHasCriticalFail(claim, stageId, stageScores = claim?.stageScores) {
  return (stageScores || []).some((s) => s.stageId === stageId && s.criticalFailed);
}

/** Current workflow stage for queue column / filters. A critical fail holds the claim on that stage. */
function getClaimWorkflowStage(claim, stageScores) {
  const scores = stageScores || claim?.stageScores;
  if (!hasStageDocsComplete(claim, 'fnol') || stageHasCriticalFail(claim, 'fnol', scores)) return 'fnol';
  if (!hasStageDocsComplete(claim, 'intimation') || stageHasCriticalFail(claim, 'intimation', scores)) return 'intimation';
  if (!claim.surveyorSubmitted || !hasStageDocsComplete(claim, 'assessment') || stageHasCriticalFail(claim, 'assessment', scores)) {
    return 'assessment';
  }
  return 'settlement';
}

function defaultUploadedRecord(def) {
  const pdf = def.kind === 'pdf';
  const count = def.minCount || 1;
  return {
    status: 'uploaded',
    filename: pdf ? `${def.id}.pdf` : `${def.id}-01.jpg`,
    thumb: pdf ? 'PDF' : count > 1 ? `${count} photos` : 'Photo',
    note: 'On file from intake.',
    count,
  };
}

function seedDocuments(claim, overrides = {}) {
  const docs = {};
  DOCUMENT_CATALOG.forEach((def) => {
    if (!documentApplies(claim, def)) return;
    if (overrides[def.id]) {
      docs[def.id] = { ...emptyDocRecord(), ...overrides[def.id] };
      return;
    }
    if (def.required === 'optional') {
      docs[def.id] = {
        ...emptyDocRecord(),
        note: 'Not provided.',
      };
      return;
    }
    if (def.carryFrom) {
      docs[def.id] = emptyDocRecord();
      return;
    }
    docs[def.id] = defaultUploadedRecord(def);
  });
  return docs;
}

function mockUploadClaimDocument(claimId, docId, actor) {
  const claim = RAW_CLAIMS.find((c) => c.id === claimId);
  const def = DOCUMENT_CATALOG.find((d) => d.id === docId);
  if (!claim || !def) return null;
  const pdf = def.kind === 'pdf';
  const count = def.minCount || 1;
  const prev = claim.documents?.[docId];
  claim.documents = claim.documents || {};
  claim.documents[docId] = {
    status: 'uploaded',
    filename: pdf ? `${def.id}-uploaded.pdf` : `${def.id}-upload-01.jpg`,
    thumb: pdf ? 'PDF' : count > 1 ? `${count} photos` : 'Photo',
    note: 'Uploaded in Claim Intel (demo).',
    count,
  };
  appendClaimAudit(claimId, {
    user: actor?.name || 'Demo user',
    action: 'Uploaded',
    changeType: 'Upload',
    entity: 'Document',
    field: def.name,
    oldValue: prev?.filename || 'Missing',
    newValue: claim.documents[docId].filename,
    comments: `Document captured at ${stageDisplayName(def.stage)}.`,
  });
  persistClaimRuntime(claim);
  return claim.documents[docId];
}

function buildChecks(overrides = {}) {
  return enabledSeedDefinitions().map((def) => {
    const o = overrides[def.id] || {};
    return {
      checkId: def.id,
      state: /** @type {CheckState} */ (o.state || 'pass'),
      evidence:
        o.evidence ||
        (def.hardFail
          ? 'Matched policy record — no discrepancy found'
          : 'Within expected range for this claim profile'),
    };
  });
}

function shiftDate(iso, days) {
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function parseVehicle(vehicle) {
  const raw = String(vehicle || '');
  const [left, colourPart] = raw.split('·').map((s) => s.trim());
  const yearMatch = (left || '').match(/(\d{4})$/);
  const year = yearMatch ? yearMatch[1] : '';
  const rest = (left || '').replace(/\s+\d{4}$/, '').trim();
  const parts = rest.split(' ').filter(Boolean);
  return {
    make: parts[0] || '',
    model: parts.slice(1).join(' '),
    year,
    colour: colourPart || '',
  };
}

function composeVehicle(claim) {
  const year = claim.vehicleYear ? ` ${claim.vehicleYear}` : '';
  const colour = claim.vehicleColour ? ` · ${claim.vehicleColour}` : '';
  return `${claim.vehicleMake || ''} ${claim.vehicleModel || ''}${year}${colour}`.replace(/\s+/g, ' ').trim();
}

/** Keep field-level checks in sync with seeded fail states so scores stay varied. */
function applyEvaluableFailFields(claim) {
  const failed = new Set(
    (claim.checks || [])
      .filter((c) => c.state === 'fail' || c.state === 'cant_evaluate')
      .map((c) => c.checkId)
  );
  if (!failed.size) return claim;
  const same = (a, b) =>
    String(a || '')
      .trim()
      .toLowerCase() ===
    String(b || '')
      .trim()
      .toLowerCase();
  if (failed.has(1) && same(claim.plate, claim.policyPlate)) {
    claim.policyPlate = 'XX 00-00000';
  }
  if (failed.has(2) && same(claim.vin, claim.policyVin)) {
    claim.policyVin = 'MISMATCHVIN0000000';
  }
  if (failed.has(3) && claim.lossDate) {
    claim.policyStart = shiftDate(claim.lossDate, 12);
    claim.policyEnd = shiftDate(claim.lossDate, 377);
  }
  if (failed.has(4) && same(claim.claimant, claim.policyholder)) {
    claim.policyholder = 'Other listed driver';
  }
  if (failed.has(5)) {
    const next = same(claim.vehicleColour, 'White') ? 'Red' : 'White';
    if (same(claim.policyColour, claim.vehicleColour)) claim.policyColour = next;
  }
  if (failed.has(6) && claim.lossDate) {
    claim.policyStart = shiftDate(claim.lossDate, -5);
  }
  if (failed.has(8) && claim.filedAt) {
    const delay = daysBetweenSeed(claim.lossDate, claim.filedAt);
    if (delay <= 14) claim.lossDate = shiftDate(claim.filedAt, -22);
  }
  if (failed.has(10)) {
    claim.garage = 'Al Noor Body Shop';
  }
  if (failed.has(14) && claim.amount != null) {
    claim.sumInsured = Math.round(Number(claim.amount) * 0.45);
  }
  return claim;
}

function daysBetweenSeed(fromIso, toIso) {
  if (!fromIso || !toIso) return 0;
  const a = new Date(`${fromIso}T12:00:00`);
  const b = new Date(`${toIso}T12:00:00`);
  return Math.round((b.getTime() - a.getTime()) / 86400000);
}

function pad2(n) {
  return String(n).padStart(2, '0');
}

function formatAuditAmount(amount) {
  return `AED ${Number(amount).toLocaleString('en-US')}`;
}

function nextAuditStamp() {
  const seq = (nextAuditStamp.seq = (nextAuditStamp.seq || 0) + 1);
  const mins = 15 + seq;
  return { date: '2026-08-14', time: `${pad2(16 + Math.floor(mins / 60))}:${pad2(mins % 60)}` };
}

function formatUseCaseCode(id) {

function formatClaimVersionLabel(index) {

function sortVersionsChronological(rows) {
  return [...(rows || [])].sort((a, b) => {
    const byWhen = `${a.date}T${a.time || '00:00'}`.localeCompare(`${b.date}T${b.time || '00:00'}`);
    if (byWhen) return byWhen;
    return String(a.version || '').localeCompare(String(b.version || ''));
  });
}

function decorateVersion(row, claim, index) {
  return {
    status: 'Completed',
    comments: row.comments || '',
    oldValue: row.oldValue ?? '—',
    newValue: row.newValue ?? '—',
    entity: row.entity || 'Claim',
    field: row.field || '—',
    action: row.action || 'Updated',
    changeType: row.changeType || 'Update',
    summary: row.summary || row.comments || row.action || 'Updated',
    changes:
      row.changes && row.changes.length
        ? row.changes
        : [
            {
              field: row.field || row.action || 'Change',
              oldValue: row.oldValue ?? '—',
              newValue: row.newValue ?? '—',
            },
          ],
    ...row,
    user:
      !row.user || row.user === 'Claim Intel'
        ? claim.assignedName || 'Fatima Al-Najjar'
        : row.user,
    version: formatClaimVersionLabel(index),

    registrationNo: row.registrationNo || claim.id,
    stage: row.stage || 'fnol',
  };
}

function capClaimVersions(rows, claim) {
  const sorted = sortVersionsChronological(rows);
  const kept =
    sorted.length <= MAX_CLAIM_VERSIONS ? sorted : [sorted[0], ...sorted.slice(-(MAX_CLAIM_VERSIONS - 1))];
  return kept.map((row, i) => decorateVersion(row, claim, i));
}

function docChange(row) {
  const statusLabel =
    row.displayStatus === 'waived'
      ? 'Bypassed'
      : row.displayStatus === 'already_on_file'
        ? 'Already on file'
        : row.rec.filename || 'Uploaded';
  return {
    field: row.def.name,
    oldValue: 'Missing',
    newValue: statusLabel,
  };
}

function getClaimVersions(claim) {
  const raw = RAW_CLAIMS.find((c) => c.id === claim?.id) || claim;
  const rows = raw?.versions || raw?.auditLog || [];
  return [...rows].sort((a, b) => {
    const byWhen = `${a.date}T${a.time || '00:00'}`.localeCompare(`${b.date}T${b.time || '00:00'}`);
    if (byWhen) return byWhen;
    return parseInt(String(a.version).replace(/\D/g, '') || '0', 10) - parseInt(String(b.version).replace(/\D/g, '') || '0', 10);
  });
}

function getClaimAuditLog(claim) {
  return getClaimVersions(claim);
}

function findClaimVersion(claim, versionId) {
  return getClaimVersions(claim).find((row) => String(row.version) === String(versionId)) || null;
}

function useCaseScoresForVersion(claim, version) {
  const stage = version?.stage || 'fnol';
  const maxIdx = Math.max(0, STAGE_FLOW.indexOf(stage));
  const results = claim.results || [];
  const versionTouchedBypass = /bypass/i.test(`${version?.action || ''} ${version?.summary || ''} ${version?.comments || ''}`);
  const source = results.length
    ? results.filter((r) => STAGE_FLOW.indexOf(r.stage) <= maxIdx)
    : USE_CASE_LIBRARY.filter((d) => STAGE_FLOW.indexOf(d.stage) <= maxIdx).map((d) => ({
        checkId: d.id,
        name: d.name,
        stage: d.stage,
        hardFail: isCriticalUseCase(d),
        weight: d.weight,
        state: (claim.checks || []).find((c) => c.checkId === d.id)?.state || 'pass',
        evidence: (claim.checks || []).find((c) => c.checkId === d.id)?.evidence || '',
      }));

  return source.map((r) => {
    let state = r.state;
    if (!versionTouchedBypass && state === 'bypassed') state = 'fail';
    return {
      checkId: r.checkId,
      code: formatUseCaseCode(r.checkId),
      name: r.name,
      state,
      hardFail: !!r.hardFail,
      weight: r.displayWeight ?? r.weight ?? 0,
      stage: r.stage,
      stageName: stageDisplayName(r.stage),
      evidence: r.evidence || '',
    };
  });
}

function appendClaimAudit(claimId, partial) {
  const claim = RAW_CLAIMS.find((c) => c.id === claimId);
  if (!claim) return;
  const stamp = nextAuditStamp();
  const row = {
    date: stamp.date,
    time: stamp.time,
    user: 'Demo user',
    action: 'Updated',
    changeType: 'Update',
    entity: 'Claim',
    field: '—',
    oldValue: '—',
    newValue: '—',
    status: 'Completed',
    comments: '',
    stage: getClaimWorkflowStage(claim),
    ...partial,
  };
  row.summary = partial.summary || partial.comments || partial.action || 'Updated';
  row.changes =
    partial.changes && partial.changes.length
      ? partial.changes
      : [{ field: row.field, oldValue: row.oldValue, newValue: row.newValue }];
  claim.versions = capClaimVersions([...(claim.versions || claim.auditLog || []), row], claim);
  claim.auditLog = claim.versions;
}

  const list = (claim?.exceptions || []).filter((e) => e.checkId === id);
  return list.length ? list[list.length - 1] : null;

function loadRuntimeStore() {
  try {
    const parsed = JSON.parse(localStorage.getItem(CLAIM_RUNTIME_KEY) || 'null');
    if (parsed && parsed.claims) return parsed;
  } catch {
    /* ignore */
  }
  return { claims: {} };
}

function persistClaimRuntime(claim) {
  const store = loadRuntimeStore();
  const fields = {};
  RUNTIME_FIELDS.forEach((key) => {
    if (claim[key] != null) fields[key] = claim[key];
  });
  store.claims[claim.id] = {
    fields,
    exceptions: claim.exceptions || [],
    waivedCheckIds: claim.waivedCheckIds || [],
    bypassedCheckIds: claim.bypassedCheckIds || [],
    dispositions: claim.dispositions || {},
    versions: claim.versions || claim.auditLog || [],
  };
  localStorage.setItem(CLAIM_RUNTIME_KEY, JSON.stringify(store));
}

function hydrateClaimRuntime() {
  const store = loadRuntimeStore();
  RAW_CLAIMS.forEach((claim) => {
    const slice = store.claims[claim.id];
    if (!slice) return;
    Object.assign(claim, slice.fields || {});
    if (slice.fields?.vehicleMake || slice.fields?.vehicleColour) {
      claim.vehicle = composeVehicle(claim);
    }
    claim.exceptions = slice.exceptions || [];
    claim.waivedCheckIds = slice.waivedCheckIds || [];
    claim.bypassedCheckIds = slice.bypassedCheckIds || [];
    claim.dispositions = slice.dispositions || {};
    if (Array.isArray(slice.versions) && slice.versions.length) {
      claim.versions = capClaimVersions(slice.versions, claim);
      claim.auditLog = claim.versions;
    }
    if (settleCoreBypasses(claim)) persistClaimRuntime(claim);
  });
}

function applyProposedFields(claim, proposed = {}) {
  Object.entries(proposed).forEach(([key, value]) => {
    claim[key] = NUMBER_FIELDS.has(key) ? Number(value) : value;
  });
  if (
    proposed.vehicleMake != null ||
    proposed.vehicleModel != null ||
    proposed.vehicleYear != null ||
    proposed.vehicleColour != null
  ) {
    claim.vehicle = composeVehicle(claim);
  }
}

function actorSnapshot(actor) {
  return {
    userId: actor?.userId || actor?.id || '',
    name: actor?.name || 'Demo user',
    role: actor?.role || '',
  };
}

function settleCoreBypasses(claim) {
  let changed = false;
  const ids = new Set(claim.bypassedCheckIds || []);
  (claim.exceptions || []).forEach((ex) => {
    if (ex.type === 'bypass' && ex.status === 'approved' && !ids.has(ex.checkId)) {
      ids.add(ex.checkId);
      changed = true;
    }
  });
  claim.bypassedCheckIds = [...ids];
  return changed;
}

/**
 * Request Bypass notifies the core system (out of scope). Scoring does not change
 * until core approves; the use-case stays Failed with status In approval.
 */
function requestCoreBypass(claimId, checkId, actor) {
  const claim = RAW_CLAIMS.find((c) => c.id === claimId);
  if (!claim) return { ok: false, message: 'Claim not found.' };
  const id = Number(checkId);
  if ((claim.bypassedCheckIds || []).includes(id)) {
    return { ok: false, message: 'This use-case is already bypassed.' };
  }
  const existing = latestExceptionForCheck(claim, id);
  if (existing?.type === 'bypass' && existing.status === 'pending') {
    return { ok: false, message: 'A bypass request is already in approval with the core system.' };
  }

  const stamp = nextAuditStamp();
  const exception = {
    id: `ex-${claim.id}-${(claim.exceptions || []).length + 1}`,
    checkId: id,
    type: 'bypass',
    status: 'pending',
    comment: 'Bypass requested — waiting for core system approval.',
    proposedFields: {},
    previousFields: {},
    hardFail: false,
    disposition: null,
    requestedBy: actorSnapshot(actor),
    requestedAt: stamp.date,
    decidedBy: null,
    decidedAt: null,
    decisionComment: '',
  };
  claim.exceptions = claim.exceptions || [];
  claim.exceptions.push(exception);
  persistClaimRuntime(claim);

  appendClaimAudit(claimId, {
    user: actor?.name || 'Demo user',
    action: 'Bypass requested',
    changeType: 'Bypass',
    entity: 'Use-case',
    field: checkCode(id),
    oldValue: 'Fail',
    newValue: 'In approval',
    summary: `${checkCode(id)} bypass requested; waiting for core approval.`,
    comments: 'Sent to the core system. Scoring is unchanged until core approves.',
    changes: [{ field: checkCode(id), oldValue: 'Fail', newValue: 'In approval' }],
  });
  persistClaimRuntime(claim);
  return {
    ok: true,
    message:
      'Bypass requested. This use-case is In approval until the core system approves. Scoring stays unchanged until then.',
  };
}

function fieldSummary(fields = {}) {
  const parts = Object.entries(fields).map(([k, v]) => `${k}=${v}`);
  return parts.join(', ') || '—';
}

function proposeCheckException(claimId, payload, actor) {
  const claim = RAW_CLAIMS.find((c) => c.id === claimId);
  if (!claim) return { ok: false, message: 'Claim not found.' };
  const checkId = Number(payload.checkId);
  const type = payload.type;
  const comment = String(payload.comment || '').trim();
  if (!['resolve', 'reject', 'approve', 'bypass'].includes(type)) {
    return { ok: false, message: 'Unknown exception action.' };
  }
  if (!comment) return { ok: false, message: 'A comment is required.' };

  const pending = latestExceptionForCheck(claim, checkId);
  if (pending?.status === 'pending') {
    return { ok: false, message: 'This check already has a pending exception.' };
  }

  const hardFail = !!payload.hardFail;
  if (type === 'reject' && hardFail && actor?.role === 'claim_user') {
    return { ok: false, message: 'Claim Users cannot bypass a hard-fail. Resolve the data or refer to FIU.' };
  }
  if (type === 'reject' && hardFail && !isCheckerRole(actor?.role)) {
    return { ok: false, message: 'Only Claim Head or FIU can bypass a hard-fail.' };
  }

  const proposedFields = type === 'resolve' ? { ...(payload.proposedFields || {}) } : {};
  if (type === 'resolve') {
    const allowed = new Set(getExceptionFields(checkId).map((f) => f.key));
    Object.keys(proposedFields).forEach((key) => {
      if (!allowed.has(key)) delete proposedFields[key];
    });
  }

  const previousFields = {};
  Object.keys(proposedFields).forEach((key) => {
    previousFields[key] = claim[key] ?? '—';
  });

  const exception = {
    id: `ex-${claim.id}-${(claim.exceptions || []).length + 1}`,
    checkId,
    type,
    status: 'pending',
    comment,
    proposedFields,
    previousFields,
    hardFail,
    disposition: type === 'approve' ? (hardFail ? 'refer' : 'continue') : null,
    requestedBy: actorSnapshot(actor),
    requestedAt: '2026-08-14',
    decidedBy: null,
    decidedAt: null,
    decisionComment: '',
  };
  claim.exceptions = claim.exceptions || [];
  claim.exceptions.push(exception);
  persistClaimRuntime(claim);

  const actionLabel =
    type === 'resolve'
      ? 'Exception resolve'
      : type === 'reject'
        ? 'Exception reject'
        : type === 'bypass'
          ? 'Bypass requested'
          : 'Exception approve';
  appendClaimAudit(claimId, {
    user: actor?.name || 'Demo user',
    action: actionLabel,
    changeType: 'Exception',
    entity: 'Use-case',
    field: checkCode(checkId),
    oldValue: type === 'resolve' ? fieldSummary(previousFields) : 'Active fail',
    newValue:
      type === 'resolve'
        ? fieldSummary(proposedFields)
        : type === 'reject'
          ? 'Pending bypass'
          : type === 'bypass'
            ? 'Pending bypass'
            : exception.disposition,
    comments: comment,
  });
  persistClaimRuntime(claim);
  return { ok: true, exception };
}

function decideCheckException(claimId, exceptionId, decision, comment, actor) {
  const claim = RAW_CLAIMS.find((c) => c.id === claimId);
  if (!claim) return { ok: false, message: 'Claim not found.' };
  if (!isCheckerRole(actor?.role)) {
    return { ok: false, message: 'Only Claim Head, Admin, or FIU can decide an exception.' };
  }
  const exception = (claim.exceptions || []).find((e) => e.id === exceptionId);
  if (!exception || exception.status !== 'pending') {
    return { ok: false, message: 'No pending exception found.' };
  }
  const actorId = actor?.userId || actor?.id;
  if (actorId && exception.requestedBy?.userId && actorId === exception.requestedBy.userId) {
    return { ok: false, message: 'Maker cannot approve their own request.' };
  }
  if (decision === 'sent_back') {
    const note = String(comment || '').trim();
    if (!note) return { ok: false, message: 'A comment is required to send back.' };
    exception.status = 'sent_back';
    exception.decisionComment = note;
    exception.decidedBy = actorSnapshot(actor);
    exception.decidedAt = '2026-08-14';
    persistClaimRuntime(claim);
    appendClaimAudit(claimId, {
      user: actor?.name || 'Demo user',
      action: 'Exception sent back',
      changeType: 'Exception',
      entity: 'Use-case',
      field: checkCode(exception.checkId),
      oldValue: 'Pending',
      newValue: 'Sent back',
      comments: note,
    });
    persistClaimRuntime(claim);
    return { ok: true, exception };
  }
  if (decision !== 'approved') return { ok: false, message: 'Unknown decision.' };

  exception.status = 'approved';
  exception.decisionComment = String(comment || '').trim();
  exception.decidedBy = actorSnapshot(actor);
  exception.decidedAt = '2026-08-14';

  if (exception.type === 'resolve') {
    applyProposedFields(claim, exception.proposedFields);
  } else if (exception.type === 'reject') {
    const ids = new Set(claim.waivedCheckIds || []);
    ids.add(exception.checkId);
    claim.waivedCheckIds = [...ids];
  } else if (exception.type === 'bypass') {
    const ids = new Set(claim.bypassedCheckIds || []);
    ids.add(exception.checkId);
    claim.bypassedCheckIds = [...ids];
  } else if (exception.type === 'approve') {
    claim.dispositions = { ...(claim.dispositions || {}), [exception.checkId]: exception.disposition };
  }
  persistClaimRuntime(claim);
  appendClaimAudit(claimId, {
    user: actor?.name || 'Demo user',
    action: 'Exception approved',
    changeType: 'Exception',
    entity: 'Use-case',
    field: checkCode(exception.checkId),
    oldValue:
      exception.type === 'resolve'
        ? fieldSummary(exception.previousFields)
        : exception.type === 'reject' || exception.type === 'bypass'
          ? 'Fail'
          : 'Fail',
    newValue:
      exception.type === 'resolve'
        ? fieldSummary(exception.proposedFields)
        : exception.type === 'reject'
          ? 'Bypassed'
          : exception.type === 'bypass'
            ? 'Bypassed'
          : exception.disposition === 'refer'
            ? 'Refer to FIU'
            : 'Accept risk',
    comments: exception.decisionComment || exception.comment,
  });
  persistClaimRuntime(claim);
  return { ok: true, exception };
}

        name: d.name,
        description: d.description,
        stage: d.stage,
        riskCategory: critical ? 'critical' : d.riskCategory || 'high',
        hardFail: critical,
        weight,

    });
  });

/** Inclusive coverage: startDate <= asOf and (no end or endDate >= asOf). */
function versionCoversDate(version, asOf = CONFIG_TODAY) {
  if (!version?.startDate) return false;
  if (version.startDate > asOf) return false;
  if (version.endDate && version.endDate < asOf) return false;
  return true;
}

/** Active config version for a given date (defaults to prototype today). */
function getVersionForDate(asOf = CONFIG_TODAY, store = getConfigStore()) {
  const covering = store.versions
    .filter((v) => versionCoversDate(v, asOf))
    .sort((a, b) => a.number - b.number);
  if (covering.length) return covering[covering.length - 1];

  const started = store.versions
    .filter((v) => v.startDate && v.startDate <= asOf)
    .sort((a, b) => a.number - b.number);
  if (started.length) return started[started.length - 1];

  return store.versions.find((v) => v.id === store.currentId) || store.versions[store.versions.length - 1];
}

  version.startDate = startDate;

  store.currentId = getVersionForDate(CONFIG_TODAY, store).id;
