function dayBefore(iso) {
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() - 1);
  return d.toISOString().slice(0, 10);
}

/**
 * Apply a mutation to current use-cases and open a new version.
 * @param {object[]} nextUseCases
 * @param {{ startDate?: string, endDate?: string|null }} [dates]
 * @param {{ stagePassPct?: object, stageMix?: object }} [extras]
 */
function commitConfigChange(nextUseCases, dates = {}, extras = {}) {
  const store = getConfigStore();
  const current = getCurrentConfigVersion(store);
  const startDate = dates.startDate || CONFIG_TODAY;
  const endDate = dates.endDate || null;

  // Close any open/overlapping versions that start before the new one.
  store.versions.forEach((v) => {
    if (v.startDate < startDate && (!v.endDate || v.endDate >= startDate)) {
      v.endDate = dayBefore(startDate);
    }
  });

  const newNumber = Math.max(...store.versions.map((v) => v.number)) + 1;
  const newVersion = withVersionExtras({
    id: Math.max(...store.versions.map((v) => v.id)) + 1,
    number: newNumber,
    startDate,
    endDate,
    useCases: cloneUseCases(nextUseCases),
    stagePassPct: extras.stagePassPct || current.stagePassPct,
    stageMix: extras.stageMix || current.stageMix,
  });

  store.versions.push(newVersion);
  store.currentId = getVersionForDate(CONFIG_TODAY, store).id;
  persistConfig(store);
  appendConfigAudit({
    field: extras.summary || 'Scoring configuration',
    oldValue: `Version ${current.number}`,
    newValue: `Version ${newNumber}`,
    comments: extras.reason || `Published scoring version ${newNumber} (${startDate} – ${endDate || 'Present'}).`,
  });
  return store;
}

function resolvePeriodRange(period, { from, to, today = PROTOTYPE_TODAY } = {}) {

function filterClaimUniverse(claims, filters = {}) {

    branch = 'All branches',
    claimType = 'all',
    stage = 'all',

    to,
    query = '',
    garage = '',
    assignedTo = '',
    attention = '',

    if (!c.filedAt || c.filedAt < range.from || c.filedAt > range.to) return false;
    if (branch && branch !== 'All branches' && c.branch !== branch) return false;
    if (claimType && claimType !== 'all' && c.claimType !== claimType) return false;
    if (stage && stage !== 'all' && getClaimWorkflowStage(c) !== stage) return false;
    if (tier === 'fail') {
      if (!c.forcedRed) return false;
    } else if (tier === 'high') {
      if (c.tier !== 'red' || c.forcedRed) return false;
    } else if (tier === 'red') {
      if (c.tier !== 'red') return false;
    } else if (tier === 'pass' || tier === 'green') {
      if (c.tier !== 'green') return false;
    } else if (tier === 'yellow' || tier === 'medium') {
      if (c.tier !== 'yellow') return false;
    }
    if (garage && c.garage !== garage) return false;
    if (assignedTo && c.assignedTo !== assignedTo && c.assignedName !== assignedTo) return false;
    if (attention === 'aging') {
      const high = c.tier === 'red' || c.forcedRed;
      if (!high || c.dueInDays > 2) return false;
    }
    if (attention === 'bypass') {
      const pending = (c.exceptions || []).some((e) => e.type === 'bypass' && e.status === 'pending');
      if (!pending) return false;
    }
    if (attention === 'hold' || attention === 'stage-hold') {
      if (currentStageOutcome(c) !== 'held') return false;
    }
    if (attention === 'stage-pass') {
      if (currentStageOutcome(c) !== 'pass') return false;
    }
    if (attention === 'stage-fail') {
      if (currentStageOutcome(c) !== 'fail') return false;
    }
    if (attention === 'high-risk') {
      if (!inHighRiskBand(c)) return false;
    }
    if (attention === 'failed-check') {
      const failed = (c.results || []).some((r) => r.state === 'fail');
      if (!failed) return false;
    }
    if (attention === 'critical') {
      const n = c.hardFails?.length || c.summary?.hardFailCount || 0;
      if (!n) return false;
    }
    if (query) {
      const q = String(query).trim().toLowerCase();
      const blob = `${c.id} ${c.fnolNumber || ''} ${c.claimant || ''} ${c.assignedName || ''} ${c.garage || ''} ${c.branch || ''}`.toLowerCase();

}

function describeClaimScope(claims, filters = {}, { includeValue = false } = {}) {
  const range = resolvePeriodRange(filters.period, { from: filters.from, to: filters.to });
  const period = filters.period === 'custom' ? formatRangeLabel(range) : periodLabel(filters.period);
  const branch = filters.branch && filters.branch !== 'All branches' ? filters.branch : 'All branches';
  const parts = [`${claims.length} motor claim${claims.length === 1 ? '' : 's'} in scope`, period, branch];
  if (includeValue) {
    const value = claims.reduce((sum, c) => sum + (c.amount || 0), 0);
    parts.push(formatAED(value));
  }
  if (filters.claimType && filters.claimType !== 'all') parts.push(claimTypeLabel(filters.claimType));
  if (filters.stage && filters.stage !== 'all') {
    const name = WORKFLOW_STAGES.find((s) => s.id === filters.stage)?.name || filters.stage;
    parts.push(name);
  }
  if (filters.tier === 'red' || filters.tier === 'high') parts.push('High risk');
  if (filters.tier === 'fail') parts.push('Fail');
  if (filters.tier === 'pass' || filters.tier === 'green') parts.push('Pass');
  if (filters.attention === 'aging') parts.push('Aging high-risk');
  if (filters.attention === 'bypass') parts.push('Bypass pending in core');
  if (filters.attention === 'hold' || filters.attention === 'stage-hold') parts.push('Held');
  if (filters.attention === 'stage-pass') parts.push('Pass');
  if (filters.attention === 'stage-fail') parts.push('Fail');
  if (filters.attention === 'high-risk') parts.push('High-risk band');
  if (filters.attention === 'failed-check') parts.push('Failed a check');
  if (filters.attention === 'critical') parts.push('Critical fail');
  if (filters.garage) parts.push(filters.garage);
  if (filters.assignedTo) parts.push(filters.assignedTo);
  if (filters.query) parts.push(`“${filters.query}”`);
  return parts.join(' · ');
}

function snapshotMetrics(claims) {
  const count = claims.length;
  const value = claims.reduce((sum, c) => sum + (c.amount || 0), 0);
  const red = claims.filter((c) => c.tier === 'red');
  const failed = claims.filter((c) => (c.summary?.failCount || c.summary?.softFailCount || 0) > 0);
  const hardFails = claims.reduce((n, c) => n + (c.hardFails?.length || 0), 0);
  const bypassed = claims.reduce(
    (n, c) => n + (c.bypassedCheckIds?.length || 0) + (c.waivedCheckIds?.length || 0),
    0
  );
  const pending = claims.reduce((n, c) => n + getPendingExceptions(c).length, 0);
  return {
    count,
    value,
    redCount: red.length,
    redValue: red.reduce((sum, c) => sum + (c.amount || 0), 0),
    highRiskRate: count ? Math.round((red.length / count) * 100) : 0,
    failCount: failed.length,
    failRate: count ? Math.round((failed.length / count) * 100) : 0,
    cantEvalCount: 0,
    cantEvalRate: 0,
    hardFails,

function paginate(list, page = 1, size = LIST_PAGE_SIZE) {
  const total = list.length;
  const pages = Math.max(1, Math.ceil(total / size) || 1);
  const current = Math.min(Math.max(1, Number(page) || 1), pages);
  const start = (current - 1) * size;
  return {
    page: current,
    pages,
    total,
    size,
    slice: list.slice(start, start + size),
    from: total ? start + 1 : 0,

function pageNumberList(current, pages) {
  if (pages <= 7) return Array.from({ length: pages }, (_, i) => i + 1);
  const keep = new Set([1, pages, current - 1, current, current + 1]);
  if (current <= 3) [2, 3, 4].forEach((n) => keep.add(n));
  if (current >= pages - 2) [pages - 3, pages - 2, pages - 1].forEach((n) => keep.add(n));
  const nums = [...keep].filter((n) => n >= 1 && n <= pages).sort((a, b) => a - b);
  const out = [];
  let last = 0;
  for (const n of nums) {
    if (last && n > last + 1) out.push('…');
    out.push(n);
    last = n;
  }
  return out;

function ledgerChangeType(row) {
  const raw = row.changeType || '';
  if (raw === 'Upload' || row.entity === 'Document') return 'Document';
  if (raw === 'Status' || row.entity === 'Stage') return 'Stage';
  if (raw === 'Score') return 'Score';
  if (raw === 'Config' || row.entity === 'Configuration') return 'Config';
  if (raw === 'Bypass' || /bypass/i.test(row.action || '')) return 'Bypass';
  if (raw === 'Exception') return 'Exception';
  if (raw === 'Assignment') return 'Assignment';
  if (raw === 'Review') return 'Review';
  if (/disposition|refer|accept risk/i.test(`${row.action || ''} ${row.field || ''}`)) return 'Disposition';
  return raw || 'Update';
}

function csvEscape(value) {
  const s = String(value ?? '');
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

function escHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function triggerDownload(filename, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function downloadCsv(filename, rows) {
  const csv = rows.map((r) => r.map(csvEscape).join(',')).join('\n');
  triggerDownload(filename, new Blob([csv], { type: 'text/csv;charset=utf-8' }));
}

function downloadXls(filename, rows) {
  const table = rows
    .map((r) => `<tr>${r.map((c) => `<td>${escHtml(c)}</td>`).join('')}</tr>`)
    .join('');
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head><body><table>${table}</table></body></html>`;
  const name = filename.toLowerCase().endsWith('.xls') ? filename : `${filename}.xls`;
  triggerDownload(name, new Blob([html], { type: 'application/vnd.ms-excel' }));
}

function downloadPdf(title, bodyHtml) {
  const w = window.open('', '_blank', 'noopener,noreferrer');
  if (!w) return;
  w.document.write(`<!DOCTYPE html><html><head><title>${escHtml(title)}</title>
    <style>
      body { font-family: "Poppins", system-ui, sans-serif; color: #16303d; padding: 28px; }
      h1 { font-size: 1.25rem; margin: 0 0 6px; }
      p { color: #6b7f8a; font-size: 0.85rem; margin: 0 0 16px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { border: 1px solid #d5e8df; padding: 7px 8px; text-align: left; font-size: 12px; }
      th { background: #e8fff6; }
    </style>
  </head><body>${bodyHtml}</body></html>`);
  w.document.close();
  w.focus();
  w.print();
}

function exportMenuHtml(id, { disabled = false, size = '', variant = 'primary' } = {}) {
  const tone = variant === 'secondary' ? 'btn-secondary' : 'btn-export';
  const btnClass = size === 'sm' ? `btn btn-sm ${tone}` : `btn ${tone}`;
  return `
    <div class="export-menu" data-export-menu="${id}">
      <button type="button" class="${btnClass}" data-export-toggle ${disabled ? 'disabled' : ''} aria-haspopup="true" aria-expanded="false">
        Export ${iconCaretDown()}
      </button>
      <div class="export-menu-panel" hidden>
        <button type="button" data-export-fmt="csv">Export in CSV</button>
        <button type="button" data-export-fmt="xls">Export in XLS</button>
        <button type="button" data-export-fmt="pdf">Export in PDF</button>
      </div>
    </div>`;
}

function bindExportMenus(root, handlers = {}) {
  const closeAll = () => {
    root.querySelectorAll('[data-export-menu]').forEach((menu) => {
      const panel = menu.querySelector('.export-menu-panel');
      const toggle = menu.querySelector('[data-export-toggle]');
      if (panel) panel.hidden = true;
      if (toggle) toggle.setAttribute('aria-expanded', 'false');
      menu.classList.remove('is-open');
    });
  };
  root.querySelectorAll('[data-export-toggle]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const menu = btn.closest('[data-export-menu]');
      const panel = menu?.querySelector('.export-menu-panel');
      if (!panel) return;
      const open = panel.hidden;
      closeAll();
      panel.hidden = !open;
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      menu.classList.toggle('is-open', open);
    });
  });
  root.querySelectorAll('[data-export-fmt]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const id = btn.closest('[data-export-menu]')?.dataset.exportMenu;
      const fn = handlers[id]?.[btn.dataset.exportFmt];
      closeAll();
      if (typeof fn === 'function') fn();
    });
  });
  document.addEventListener('click', closeAll, { once: true });
}

function bindDialogDismiss(root, onClose) {
  root._dialogAbort?.abort();
  if (typeof onClose !== 'function') return;
  const dialog = root.querySelector('[role="dialog"]');
  if (!dialog) return;
  const ac = new AbortController();
  root._dialogAbort = ac;
  document.addEventListener(
    'keydown',
    (e) => {
      if (e.key === 'Escape') {
        e.preventDefault();
        onClose();
      }
    },
    { signal: ac.signal }
  );
  const focusable = dialog.querySelector(
    'button, [href], input:not([type="hidden"]), select, textarea, [tabindex]:not([tabindex="-1"])'
  );
  focusable?.focus();
}

function riskMixHtml({ high = 0, medium = 0, low = 0, highValue = 0, formatValue }) {

  if (!total) {
    return `<div class="chart-empty">No claims in this view.</div>`;

  const pct = (n) => Math.round((n / total) * 100);
  const highPct = pct(high);

  return `
    <div class="risk-mix">
      <div class="risk-mix-bar" role="img" aria-label="Risk mix: ${highPct}% high, ${medPct}% medium, ${lowPct}% low">
        <span class="is-high" style="width:${highPct}%"></span>

        <span class="is-low" style="width:${lowPct}%"></span>
      </div>
      <ul class="risk-mix-legend">

        <li><i class="is-medium"></i> Low <strong>${medium}</strong> <span>${medPct}%</span></li>
        <li><i class="is-low"></i> Pass <strong>${low}</strong> <span>${lowPct}%</span></li>

    </div>

}

function shareRowsHtml(items, { hrefFor } = {}) {
  const max = Math.max(1, ...items.map((i) => i.red || 0));
  return items
    .map((item) => {
      const count = item.count || 0;
      const red = item.red || 0;
      const width = Math.round((red / max) * 100);
      const share = count ? Math.round((red / count) * 100) : 0;
      const inner = `
        <span class="share-row-name">${esc(item.name)}</span>
        <span class="share-row-track" aria-hidden="true"><span class="share-row-fill" style="width:${width}%"></span></span>
        <span class="share-row-meta"><strong>${red}</strong> high risk · ${share}% of ${count}</span>
      `;
      return hrefFor
        ? `<a class="share-row" href="${hrefFor(item)}">${inner}</a>`
        : `<div class="share-row">${inner}</div>`;

function sparklineSvg(values, { stroke = '#2EDB8E', fill = 'rgba(46, 219, 142, 0.18)' } = {}) {
  const nums = (values || []).map(Number).filter((n) => Number.isFinite(n));
  if (nums.length < 2) return '';
  const w = 140;
  const h = 44;
  const pad = 3;
  const min = Math.min(...nums);
  const max = Math.max(...nums);
  const span = max - min || 1;
  const pts = nums.map((v, i) => {
    const x = pad + (i / (nums.length - 1)) * (w - pad * 2);
    const y = h - pad - ((v - min) / span) * (h - pad * 2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const line = pts.join(' ');
  const area = `${pad},${h - pad} ${line} ${w - pad},${h - pad}`;
  return `<svg class="ov-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polygon points="${area}" fill="${fill}"/><polyline points="${line}" fill="none" stroke="${stroke}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function mixMetricRowsHtml(items) {
  const max = Math.max(1, ...items.map((i) => i.count || 0));

          <span class="share-row-meta"><strong>${count}</strong> ${item.meta || ''}</span>
        </div>
      `;
    })
    .join('');
}

function versionHistoryTableHtml(claim) {
  const rows = [...getClaimVersions(claim)].reverse();
  if (!rows.length) {
    return `<div class="claim-audit-empty">No version history recorded for this claim.</div>`;
  }
  return `

      <table class="az-grid-table history-table">

              return `

}

function versionHistoryModalHtml(claim) {

function bindVersionPopup(root, claims, onChange, stateKey = 'versionKey') {
  const close = () => onChange({ [stateKey]: null });
  root.querySelectorAll('[data-open-version]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      onChange({ [stateKey]: `${btn.dataset.openVersion}|${btn.dataset.version}` });
    });
  });
  root.querySelectorAll('[data-action="close-version-modal"]').forEach((el) => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      close();
    });
  });
  if (root.querySelector('[data-action="close-version-modal"]')) {
    bindDialogDismiss(root, close);
  }
}

function parseVersionKey(key) {
  if (!key) return null;
  const idx = String(key).indexOf('|');
  if (idx < 0) return null;
  return { claimId: key.slice(0, idx), version: key.slice(idx + 1) };
}

function renderOpenVersionPopup(claims, versionKey) {
  const parsed = parseVersionKey(versionKey);
  if (!parsed) return '';
  const claim = claims.find((c) => c.id === parsed.claimId);
  if (!claim) return '';
  return versionPopupHtml(claim, parsed.version);
}

function routeAfterLogin(user) {
  const next = sessionStorage.getItem(NEXT_KEY);
  sessionStorage.removeItem(NEXT_KEY);
  if (next && next.startsWith('#/') && next !== '#/login') {
    const feature = next.replace(/^#\//, '').split(/[/?]/)[0];
    const mapped = feature === 'claim' ? 'claim' : feature;
    if (canAccess(user.role, mapped)) return next;
  }
  return homeRouteForRole(user.role);

}

  if (source.forcedRed || source.criticalFailed) return 'Fail';
  if (source.tier === 'red') return 'High';
  if (source.tier === 'yellow') return 'Low';
  return 'Pass';
}

function stageScoreLine(stageScore) {
  if (!stageScore) return 'Not scored';
  const outcome = scoreOutcome(stageScore);
  if (outcome === 'Fail') return 'Fail';
  return `${formatScore(stageScore.score)} ${outcome}`;
}

function weightCellHtml(r, stageHasExcluded) {
  if (r.state === 'bypassed' || r.state === 'waived') {
    return `<span class="check-weight-excluded" title="Excluded from this stage’s score">—</span>`;
  }
  if (r.hardFail) {
    return `<span class="check-weight-gate" title="Critical use-cases are pass / fail only">Pass / fail</span>`;
  }
  const shown = r.displayWeight ?? r.weight ?? 0;
  const configured = r.configuredWeight ?? r.weight ?? 0;
  if (stageHasExcluded && shown !== configured) {
    return `${shown}% <span class="check-weight-was">was ${configured}%</span>`;
  }
  return `${shown}%`;
}

function exceptionBlockHtml(result, session, claim) {
  if (session.role === 'surveyor') return '';
  const bits = [];
  const pending = latestExceptionForCheck(claim, result.checkId);
  const awaitingCore = pending?.type === 'bypass' && pending.status === 'pending';
  if (result.state === 'bypassed') {
    bits.push(`<span class="tag override">Bypassed</span>`);
    bits.push(
      session.role === 'claim_user'
        ? `<p class="exception-note">Excluded from this stage.</p>`
        : `<p class="exception-note">Excluded from this stage. Remaining use-case weights are normalised to 100%.</p>`
    );
  } else if (awaitingCore) {
    bits.push(`<span class="tag pending">In approval</span>`);
    bits.push(
      `<p class="exception-note">Bypass requested. Waiting for the core system to approve. Scoring is unchanged until then.</p>`
    );
  }
  const buttons = [];
  if (result.state === 'fail' && !awaitingCore) {
    buttons.push(
      `<button type="button" class="btn btn-sm btn-secondary" data-action="request-bypass" data-check-id="${result.checkId}">Request Bypass</button>`
    );
  }
  if (!bits.length && !buttons.length) return '';
  return `
    <div class="exception-block">
      ${bits.join('')}
      ${buttons.length ? `<div class="exception-actions">${buttons.join('')}</div>` : ''}
    </div>
  `;
}

function requiredTag(def) {
  if (def.required === 'optional') return `<span class="tag doc-optional">Optional</span>`;
  if (def.required === 'conditional') return `<span class="tag doc-conditional">Conditional</span>`;
  return `<span class="tag doc-required">Required</span>`;
}

function docStatusLabel(status) {
  if (status === 'uploaded' || status === 'already_on_file' || status === 'waived' || status === 'bypassed') {
    return 'View';
  }
  return 'Missing';
}

function isDocOnFile(status) {
  return status === 'uploaded' || status === 'already_on_file' || status === 'waived' || status === 'bypassed';
}

function hashDigits(value, len = 7) {
  const s = String(value || '');
  let n = 0;
  for (let i = 0; i < s.length; i += 1) n = (n * 31 + s.charCodeAt(i)) >>> 0;
  return String(n).padStart(len, '0').slice(-len);
}

function eidNumber(claim) {
  const year = String(claim.lossDate || claim.filedAt || '1988').slice(0, 4);
  return `784-${year}-${hashDigits(claim.id, 7)}-1`;
}

function extractedDate(iso) {
  const raw = String(iso || '').slice(0, 10);
  const d = new Date(`${raw}T12:00:00`);
  if (Number.isNaN(d.getTime())) return '—';
  return `${d.getDate()} ${d.toLocaleString('en-GB', { month: 'short' })} ${d.getFullYear()}`;
}

function extractedFieldsForDoc(claim, def) {

      { field: 'Make / model', document: makeModel, claim: policyMakeModel, result: makeModel === policyMakeModel ? 'Match' : 'Mismatch' },
      { field: 'Colour', document: colour, claim: policyColour, result: colour === policyColour ? 'Match' : 'Mismatch' },
    ],
    'fnol-police': [
      { field: 'Report number', document: `PR-${hashDigits(claim.id, 6)}`, claim: claim.fnolNumber || '—', result: 'Match' },
      { field: 'Loss date', document: formatDate(claim.lossDate), claim: formatDate(claim.lossDate), result: 'Match' },
      { field: 'Location', document: claim.lossLocation || claim.branch || '—', claim: claim.lossLocation || claim.branch || '—', result: 'Match' },
    ],
    'int-estimate': [
      { field: 'Garage', document: garage, claim: garage, result: 'Match' },
      { field: 'Estimate amount', document: amount, claim: amount, result: 'Match' },
      { field: 'Vehicle', document: makeModel, claim: policyMakeModel, result: makeModel === policyMakeModel ? 'Match' : 'Mismatch' },
    ],
    'int-nomination': [
      { field: 'Nominated garage', document: garage, claim: garage, result: 'Match' },
      { field: 'Assignment', document: garage === 'Network panel garage' ? 'Network' : 'Claimant selected', claim: garage === 'Network panel garage' ? 'Network' : 'Claimant selected', result: 'Match' },
    ],
    'int-tp-pack': [
      { field: 'Counterparty', document: name, claim: policyName, result: namesMatch ? 'Match' : 'Mismatch' },
      { field: 'Plate number', document: plate, claim: policyPlate, result: plate === policyPlate ? 'Match' : 'Mismatch' },
    ],
    'ass-surveyor': [
      { field: 'Surveyor', document: claim.assignedName || '—', claim: claim.assignedName || '—', result: 'Match' },
      { field: 'Vehicle', document: makeModel, claim: policyMakeModel, result: makeModel === policyMakeModel ? 'Match' : 'Mismatch' },
      { field: 'Recommended amount', document: amount, claim: amount, result: 'Match' },
    ],
    'ass-parts': [
      { field: 'Vehicle', document: makeModel, claim: policyMakeModel, result: makeModel === policyMakeModel ? 'Match' : 'Mismatch' },
      { field: 'Estimate amount', document: amount, claim: amount, result: 'Match' },
    ],
    'set-invoice': [
      { field: 'Invoice amount', document: amount, claim: amount, result: 'Match' },
      { field: 'Payee', document: name, claim: policyName, result: namesMatch ? 'Match' : 'Mismatch' },
    ],
    'set-discharge': [
      { field: 'Claimant', document: name, claim: policyName, result: namesMatch ? 'Match' : 'Mismatch' },

    ],
    'set-iban': [
      { field: 'Account name', document: name, claim: policyName, result: namesMatch ? 'Match' : 'Mismatch' },

function documentListHtml(claim, stageId) {

function stageHoldMessage(claim, stageId) {
  const scored = (claim.stageScores || []).some((s) => s.stageId === stageId);
  if (scored) return '';
  const heldName = stageDisplayName(claim.heldAtStage || claim.workflowStage);
  if (claim.holdReason === 'critical') {
    return `This stage is not scored. A critical use-case failed at ${heldName}. The claim cannot move on unless that check is bypassed and approved.`;
  }
  if (claim.holdReason === 'docs') {
    return `This stage is not scored until required ${heldName} documents are on file.`;
  }
  if (claim.holdReason === 'surveyor') {
    return `This stage is not scored until Assessment is submitted.`;
  }
  return `This stage is not scored yet. The claim is still at ${heldName}.`;
}

function metaRow(label, value) {
  return `
    <div class="cd-meta-row">
      <span class="cd-meta-label">${label}</span>
      <span class="cd-meta-colon">:</span>
      <span class="cd-meta-value">${value}</span>
    </div>
  `;
}

function iconCopy() {
  return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
}

function copyField(label, value) {
  const text = String(value || '').trim();
  if (!text) return metaRow(label, '—');
  return metaRow(
    label,
    `<span class="cd-id">
      ${esc(text)}
      <button type="button" class="cd-copy" data-action="copy-id" data-copy="${esc(text)}" title="Copy ${esc(label)}" aria-label="Copy ${esc(label)}">
        ${iconCopy()}
      </button>
    </span>`
  );
}

function copyFallback(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  ta.remove();
}

function copyText(text) {
  if (navigator.clipboard?.writeText) {
    return navigator.clipboard.writeText(text).catch(() => copyFallback(text));
  }
  copyFallback(text);
  return Promise.resolve();
}

function partyBlock(title, lines) {
  return `
    <div class="cd-party">
      <h4>${title}</h4>
      ${lines.map((line) => `<p>${line}</p>`).join('')}
    </div>
  `;
}

function stageFilterHtml(stageFilter) {
  const options = [{ id: 'overview', label: 'Overview' }, ...CLAIM_STAGES.map((st) => ({ id: st.id, label: stageDisplayName(st.id) }))];
  return `
    <div class="ov-pills" role="tablist" aria-label="Claim stage">
      ${options
        .map((opt) => {
          const active = stageFilter === opt.id;
          return `
          <button type="button" class="${active ? 'is-on' : ''}" data-stage-tab="${opt.id}" role="tab" aria-selected="${active ? 'true' : 'false'}">
            ${opt.label}
          </button>`;
        })
        .join('')}
    </div>
  `;
}

function checksSummary(stageResults) {
  if (!stageResults.length) return '—';
  const pass = stageResults.filter((r) => r.state === 'pass').length;
  const fail = stageResults.filter((r) => r.state === 'fail' || r.state === 'cant_evaluate').length;
  if (fail && pass) return `${pass} passed, ${fail} failed`;
  if (fail) return `${fail} failed`;
  return `${pass} passed`;
}

function needsActionLabel(claim, stage, stageResults, stageScore) {
  const failed = stageResults.find((r) => r.state === 'fail' || r.state === 'cant_evaluate');
  if (failed) return failed.name;
  const docs = getStageDocCompleteness(claim, stage.id);
  if (docs.total && docs.done < docs.total) return 'Documents missing';
  if (!stageScore) return 'Not scored yet';
  return '—';
}

function overviewTableHtml(claim) {
  const rows = CLAIM_STAGES.map((stage) => {
    const stageResults = (claim.results || []).filter((r) => r.stage === stage.id);
    const stageScore = (claim.stageScores || []).find((x) => x.stageId === stage.id);
    const docs = getStageDocCompleteness(claim, stage.id);
    const outcome = stageScore ? scoreOutcome(stageScore) : '';
    const action = needsActionLabel(claim, stage, stageResults, stageScore);
    return `
      <tr class="listing-row" data-stage-tab="${stage.id}">
        <td class="sum-stage">${stageDisplayName(stage.id)}</td>
        <td class="sum-score${outcome ? ` is-${outcome.toLowerCase()}` : ''}">${esc(stageScoreLine(stageScore))}</td>
        <td>${esc(checksSummary(stageResults))}</td>
        <td>${docs.total ? `${docs.done}/${docs.total}` : '—'}</td>
        <td class="sum-action${action === '—' ? ' is-clear' : ''}">${esc(action)}</td>
        <td class="sum-open">Open</td>
      </tr>`;
  }).join('');
  return `
    <div class="listing-table-wrap">
      <table class="listing-table is-fluid sum-table">
        <thead>
          <tr>
            <th>Stage</th>
            <th>Score</th>
            <th>Checks</th>
            <th>Documents</th>
            <th>Needs action</th>
            <th></th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function stageScoringStripHtml(claim, stage) {
  const stageResults = (claim.results || []).filter((r) => r.stage === stage.id);
  const stageScore = (claim.stageScores || []).find((x) => x.stageId === stage.id);
  const pass = stageResults.filter((r) => r.state === 'pass').length;
  const fail = stageResults.filter((r) => r.state === 'fail' || r.state === 'cant_evaluate').length;
  const scored = pass + fail;
  const passPct = scored ? (pass / scored) * 100 : 0;
  const failPct = scored ? (fail / scored) * 100 : 0;
  const outcome = stageScore ? scoreOutcome(stageScore) : 'Not scored';
  return `
    <div class="stage-score">
      <div class="stage-score-top">
        <h2><i aria-hidden="true"></i> ${stageDisplayName(stage.id)} scoring</h2>
        <span class="stage-score-rule" aria-hidden="true"></span>
        <span>Sum insured ${formatAED(claim.sumInsured)}</span>
      </div>
      <p>Claim value ${formatAED(claim.amount)} · ${esc(outcome)}</p>
      <div class="stage-score-bar" aria-hidden="true">
        ${passPct ? `<span class="is-pass" style="width:${passPct}%"></span>` : ''}
        ${failPct ? `<span class="is-fail" style="width:${failPct}%"></span>` : ''}
      </div>
      <div class="stage-score-legend">
        <span><i class="is-pass"></i> Passed ${pass} check${pass === 1 ? '' : 's'}</span>
        <span><i class="is-fail"></i> Failed ${fail}</span>
      </div>
    </div>`;
}

function summaryField(label, valueHtml) {
  return `<div class="cd-field"><span class="cd-field-label">${label}</span><div class="cd-field-value">${valueHtml}</div></div>`;
}

function scoreCardHtml(claim) {
  const stageId = getClaimWorkflowStage(claim);
  const stageScore = (claim.stageScores || []).find((s) => s.stageId === stageId);
  const stageResults = (claim.results || []).filter((r) => r.stage === stageId);
  const pool = stageResults.length ? stageResults : claim.results || [];
  const failed = pool.filter((r) => r.state === 'fail' || r.state === 'cant_evaluate').length;
  const outcome = scoreOutcome(stageScore || claim) || 'Pass';
  const score = stageScore?.criticalFailed ? 0 : Number(stageScore?.score ?? claim.score) || 0;
  const arc = outcome === 'High' || outcome === 'Fail' ? '#F24456' : outcome === 'Low' ? '#E0A100' : '#2ED88E';
  const pct = Math.max(0, Math.min(100, Math.round(score)));
  const note = pool.length ? `${failed} of ${pool.length} checks failed` : 'Not scored yet';
  return `
    <aside class="cd-scorecard">
      <div class="cd-donut" style="--p:${pct};--arc:${arc}" role="img" aria-label="${stageDisplayName(stageId)} score ${pct}%">
        <span>${outcome === 'Fail' ? 'Fail' : `${pct}%`}</span>
      </div>
      <div class="cd-scorecard-copy">
        <h2>${stageDisplayName(stageId)} Score</h2>
        <span class="cd-score-pill is-${outcome.toLowerCase()}">${outcome}</span>
        <p class="cd-score-note">${note}</p>
      </div>
    </aside>`;
}

function checksListHtml(claim, session, stage, items, filter, hideWeights) {
  const stageHasExcluded = (claim.results || []).some(
    (r) => r.stage === stage.id && !r.hardFail && (r.state === 'bypassed' || r.state === 'waived')
  );
  const stageHasCritical = (claim.results || []).some((r) => r.stage === stage.id && r.hardFail);
  const hints = [];
  if (!hideWeights && stageHasCritical) {
    hints.push('Critical use-cases are pass / fail only. If they pass, remaining use-cases in this stage share 100%.');
  }
  if (!hideWeights && stageHasExcluded) {
    hints.push('Bypassed use-cases are excluded. Remaining weights in this stage are normalised to 100%.');
  }
  const holdNote = stageHoldMessage(claim, stage.id);
  return `
    ${holdNote ? `<p class="stage-hold-note">${holdNote}</p>` : ''}
    <div class="checks-list cd-checks">
      ${
        items.length === 0
          ? filter === 'all' || holdNote
            ? holdNote
              ? ''
              : `<div class="empty-checks">No scoring checks for this stage.</div>`
            : `<div class="empty-checks">No checks in this result state.</div>`
          : items
              .map(
                (r) => `
        <div class="check-row ${r.state}${hideWeights ? ' no-weight' : ''}">
          <div class="check-state-icon ${r.state}">${stateIcon(r.state)}</div>
          <div class="check-body">
            <div class="check-name">
              <span class="check-code">${checkCode(r.checkId)}</span>
              ${r.name}
              ${r.hardFail ? `<span class="tag critical">Critical</span>` : ''}
            </div>
            <p class="evidence">${r.evidence}</p>
            ${exceptionBlockHtml(r, session, claim)}
          </div>
          ${hideWeights ? '' : `<div class="check-weight">${weightCellHtml(r, stageHasExcluded)}</div>`}
        </div>
      `
              )
              .join('')
      }
    </div>
    ${hints.map((h) => `<p class="stage-norm-hint">${h}</p>`).join('')}
  `;
}

function renderClaimDetail(
  root,
  session,
  claim,
  filter,
  onFilter,
  { selectedStage = null, exceptionNotice = null, pageTab = 'overview', versionKey = null, extractedDocId = null } = {}
) {
  if (!claim) {
    root.innerHTML = renderShell(
      session,
      '#/queue',
      `<div class="empty-state">Claim not found. <a href="#/queue">Back to claims</a></div>`,
      { mainClass: 'is-claim' }
    );
    root.querySelector('[data-role-label]').textContent = ROLE_LABELS[session.role];
    return;
  }

  const isSurveyor = session.role === 'surveyor';
  const isClaimUser = session.role === 'claim_user';
  const hideAssigned = isClaimUser || isSurveyor;
  const hideWeights = isClaimUser;
  const stageFilter = isSurveyor ? selectedStage || 'assessment' : selectedStage || 'overview';
  const isOverview = stageFilter === 'overview';
  const visibleStages = isOverview ? [] : CLAIM_STAGES.filter((s) => s.id === stageFilter);
  const assessmentVisible = visibleStages.some((s) => s.id === 'assessment');
  const surveyorCanWork =
    isSurveyor &&
    assessmentVisible &&
    hasPassedPriorStages(claim, ['fnol', 'intimation']) &&
    !claim.surveyorSubmitted;
  const surveyorSubmitted = isSurveyor && !!claim.surveyorSubmitted;
  const visibleResults = (claim.results || []).filter((r) => visibleStages.some((s) => s.id === r.stage));
  const counts = {
    all: visibleResults.length,
    pass: visibleResults.filter((r) => r.state === 'pass').length,
    fail: visibleResults.filter((r) => r.state === 'fail' || r.state === 'cant_evaluate').length,
  };
  const hardFailNames = (claim.hardFails || []).map((h) => `${checkCode(h.checkId)} ${h.name}`).join('; ');
  const stageSections = visibleStages
    .map((stage) => {
      const stageResults = (claim.results || []).filter((r) => r.stage === stage.id);
      const sorted = sortChecksForDisplay(stageResults);
      const items =
        filter === 'all'
          ? sorted
          : filter === 'fail'
            ? sorted.filter((r) => r.state === 'fail' || r.state === 'cant_evaluate')

(function () {

const AUDIT_PAGE_SIZE = 25;

function pct(part, whole) {
  if (!whole) return '0%';
  return `${Math.round((part / whole) * 100)}%`;
}

function bypassRequested(claim, checkId) {
  const id = Number(checkId);
  if ((claim.exceptions || []).some((row) => row.type === 'bypass' && Number(row.checkId) === id)) return true;
  if ((claim.bypassedCheckIds || []).some((row) => Number(row) === id)) return true;
  return (claim.results || []).some((row) => Number(row.checkId) === id && (row.state === 'bypassed' || row.bypassed));
}

function stageUseCaseRows(claims, stageId) {
  const byId = new Map();
  claims.forEach((claim) => {
    const reached = (claim.stageScores || []).some((row) => row.stageId === stageId);
    if (!reached) return;
    (claim.results || [])
      .filter((row) => row.stage === stageId)
      .forEach((result) => {
        const id = Number(result.checkId);
        if (!byId.has(id)) {
          const code = String(result.code || '').startsWith('#') ? result.code : `#${String(id).padStart(2, '0')}`;
          byId.set(id, { id, code, name: result.name || 'Use case', frequency: 0, failed: 0, requested: 0 });
        }
        const bucket = byId.get(id);
        bucket.frequency += 1;
        if (result.state === 'fail') bucket.failed += 1;
        if (bypassRequested(claim, id)) bucket.requested += 1;
      });
  });
  return [...byId.values()].sort((a, b) => a.id - b.id);
}

function stagePopupHtml(claims) {
  if (!openStageId) return '';
  const stage = WORKFLOW_STAGES.find((row) => row.id === openStageId);

function destroyReportCharts() {}

function esc(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function formatSlashDate(iso) {
  const raw = String(iso || '').slice(0, 10);
  const [y, m, d] = raw.split('-');
  if (!y || !m || !d) return '—';
  return `${d}/${m}/${y}`;
}

function money(amount) {
  return formatAED(amount || 0);
}

function claimsHref(state, range, extra = {}) {
  const params = new URLSearchParams();
  params.set('period', state.period || '90');
  if (range?.from) params.set('from', range.from);
  if (range?.to) params.set('to', range.to);
  params.set('stage', state.stage && state.stage !== 'all' ? state.stage : 'all');
  if (state.branch && state.branch !== 'All branches') params.set('branch', state.branch);
  if (state.claimType && state.claimType !== 'all') params.set('claimType', state.claimType);
  Object.entries(extra).forEach(([key, value]) => {
    if (value) params.set(key, value);
  });
  return `#/queue?${params.toString()}`;
}

function outcomeBuckets(claims) {
  const buckets = {
    pass: { count: 0, value: 0 },
    fail: { count: 0, value: 0 },
    held: { count: 0, value: 0 },
  };
  claims.forEach((claim) => {
    const key = currentStageOutcome(claim);
    const bucket = buckets[key] || buckets.fail;
    bucket.count += 1;
    bucket.value += claim.amount || 0;
  });
  return buckets;
}

function checkTotals(claims) {
  let failed = 0;
  let run = 0;
  let claimsWithFail = 0;
  claims.forEach((claim) => {
    const results = claim.results || [];
    const fails = results.filter((r) => r.state === 'fail').length;
    run += results.length;
    failed += fails;
    if (fails) claimsWithFail += 1;
  });
  return { failed, run, claimsWithFail };
}

function criticalTotals(claims) {
  let count = 0;
  let value = 0;
  claims.forEach((claim) => {
    const n = claim.hardFails?.length || claim.summary?.hardFailCount || 0;
    count += n;
    if (n) value += claim.amount || 0;
  });
  return { count, value };
}

function stageRows(claims) {
  return WORKFLOW_STAGES.map((stage) => {
    const scored = claims
      .map((claim) => ({
        claim,
        stageScore: (claim.stageScores || []).find((row) => row.stageId === stage.id) || null,
      }))
      .filter((row) => row.stageScore);
    const count = scored.length;
    const pass = scored.filter((row) => row.stageScore.passed).length;
    const failed = count - pass;
    const avgScore = count ? Math.round(scored.reduce((sum, row) => sum + Number(row.stageScore.score || 0), 0) / count) : 0;
    const value = scored.reduce((sum, row) => sum + (row.claim.amount || 0), 0);
    const crit = scored.reduce((sum, row) => sum + (row.stageScore.hardFailCount || 0), 0);
    const avgCrit = count ? crit / count : 0;
    const bypassed = scored.filter((row) =>
      (row.claim.results || []).some((r) => r.stage === stage.id && (r.bypassed || r.state === 'bypassed'))
    ).length;
    return { ...stage, count, pass, failed, avgScore, value, avgCrit, bypassed };
  });
}

function auditActionLabel(version) {
  const blob = `${version?.action || ''} ${version?.summary || ''} ${version?.changeType || ''} ${version?.newValue || ''} ${version?.comments || ''}`.toLowerCase();
  const bypass = /bypass/.test(blob);
  if (bypass && /reject|sent back|declin/.test(blob)) return 'Rejected bypass';
  if ((bypass || /exception/.test(blob)) && /approv/.test(blob)) return 'Approved bypass';
  if (bypass || /pending bypass|in approval/.test(blob)) return 'Requested bypass';
  if (/upload|document/.test(blob)) return 'Document added';
  if (/submit/.test(blob)) return 'Submitted';
  return 'Field updated';
}

function versionCheckId(version) {
  const blob = `${version?.field || ''} ${version?.summary || ''} ${version?.comments || ''}`;
  const coded = blob.match(/UC\s*(\d+)/i);
  if (coded) return Number(coded[1]);
  const hash = blob.match(/#\s*(\d+)/);
  if (hash) return Number(hash[1]);
  return null;
}

function criticalBypassFlag(version) {
  const label = auditActionLabel(version);
  if (!/bypass/i.test(label)) return false;
  const id = versionCheckId(version);
  if (id == null) return /critical/i.test(`${version?.summary || ''} ${version?.comments || ''}`);
  const def = USE_CASE_LIBRARY.find((row) => Number(row.id) === id);
  return isCriticalUseCase(def);
}

function auditRows(claims) {
  const rows = [];
  claims.forEach((claim) => {
    getClaimVersions(claim).forEach((version) => {
      const stageId = version.stage || claim.workflowStage;
      const stageScore = (claim.stageScores || []).find((row) => row.stageId === stageId) || currentStageScore(claim);
      rows.push({
        date: version.date,
        time: version.time || '—',
        claim,
        stage: stageDisplayName(stageId),
        actor: version.user || '—',
        action: auditActionLabel(version),
        critical: criticalBypassFlag(version),
        score: stageScore?.criticalFailed ? 'Fail' : stageScore ? `${Math.round(Number(stageScore.score) || 0)}%` : formatClaimScore(claim),
      });
    });
  });
  rows.sort((a, b) => `${b.date || ''}T${b.time || ''}`.localeCompare(`${a.date || ''}T${a.time || ''}`));
  return rows;
}

function formatAvgCrit(value) {
  if (!value) return '0';
  const rounded = Math.round(value * 10) / 10;
  return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);

function claimWord(count) {
  const n = Number(count) || 0;
  return `${n.toLocaleString('en-AE')} claim${n === 1 ? '' : 's'}`;
}

function checksContribute(claims) {
  const parts = WORKFLOW_STAGES.map((stage) => {
    let failed = 0;
    let run = 0;
    claims.forEach((claim) => {
      const rows = (claim.results || []).filter((row) => row.stage === stage.id);
      run += rows.length;
      failed += rows.filter((row) => row.state === 'fail').length;
    });
    if (!run) return null;
    return `${failed} of ${run} on ${stage.name}`;
  }).filter(Boolean);
  return parts.join('; ') || '—';
}

function criticalContribute(claims) {
  const parts = WORKFLOW_STAGES.map((stage) => {
    let count = 0;
    let value = 0;
    let shown = false;
    claims.forEach((claim) => {
      const stageScore = (claim.stageScores || []).find((row) => row.stageId === stage.id);
      if (!stageScore) return;
      shown = true;
      const fails = stageScore.hardFailCount || 0;
      count += fails;
      if (fails) value += claim.amount || 0;
    });
    if (!shown) return null;
    if (!count) return `None on the ${stage.name} checks`;
    return `${count} on ${stage.name}, ${money(value)}`;
  }).filter(Boolean);
  return parts.join('; ') || 'None';
}

function countBy(list, keyFn) {
  const map = new Map();
  list.forEach((c) => {
    const key = keyFn(c) || '—';
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(c);
  });
  return [...map.entries()]
    .map(([name, rows]) => ({
      name,
      count: rows.length,
      red: rows.filter((c) => c.tier === 'red' || c.forcedRed).length,
      value: rows.reduce((s, c) => s + (c.amount || 0), 0),
    }))
    .sort((a, b) => b.red - a.red || b.count - a.count);
}

function formatCompactAED(amount) {
  const n = Number(amount) || 0;
  if (n >= 1_000_000) return `AED ${(n / 1_000_000).toFixed(1)}M`;
  if (n >= 10_000) return `AED ${Math.round(n / 1000)}k`;
  return formatAED(n);
}

function pctDelta(current, previous) {
  if (previous == null || previous === 0) {
    if (!current) return { dir: 'flat', text: 'No prior period' };
    return { dir: 'up', text: 'New vs last period' };
  }
  const d = ((current - previous) / previous) * 100;
  const dir = d > 0.4 ? 'up' : d < -0.4 ? 'down' : 'flat';
  const sign = d > 0 ? '+' : '';
  return { dir, text: `${sign}${d.toFixed(1)}% vs last period` };
}

function ptsDelta(current, previous) {
  if (previous == null) return { dir: 'flat', text: 'No prior period' };
  const delta = current - previous;
  const dir = delta > 0 ? 'up' : delta < 0 ? 'down' : 'flat';
  const arrow = delta > 0 ? '▲' : delta < 0 ? '▼' : '•';
  return { dir, text: `${arrow} ${Math.abs(delta)} pt${Math.abs(delta) === 1 ? '' : 's'} vs last period` };
}

function formatTableDate(iso) {

    bucket,
    recommended: !!(bucket && activeBuckets?.has(bucket)),

        const q = filters.query.toLowerCase();
        const flags = libraryFlags(u.id);
